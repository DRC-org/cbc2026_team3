; DC モータ用自作モタドラの **CAN トランシーバ故障時の代替版**（Arduino UNO R4 Minima）。
; 内蔵 CAN ペリフェラルを一切使わず、USB CDC の Serial で SLCAN を喋る。
; Linux 側は slcand が SocketCAN の netdev へ昇格させるので、PC 側のコードも
; プロトコル（docs/motor_driver_can_protocol.md）も dc_motor と同一。
;
; 基板と配線は firmware/dc_motor と物理的に同一。CAN ピン D4/D5 はこの版では未使用に
; なるが、他用途へ割り当ててはならない（src/main.cpp の static_assert が検出する）。

[platformio]
default_envs = uno_r4_minima
extra_configs = ../common.ini

[env:uno_r4_minima]
extends = arduino_common
platform = renesas-ra
board = uno_r4_minima
; RGB LED（D6・1 個）の状態表示。他の基板と同じライブラリに揃えてある。
lib_deps = adafruit/Adafruit NeoPixel@^1.12.3
; 共有テスト（MotorCan）は dc_motor / servo から回す。
test_ignore = *
