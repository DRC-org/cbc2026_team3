; DC モータ用自作モタドラの CAN を使わない固定 duty 版（Arduino UNO R4 Minima）。
; 起動直後から include/config.h の kFixedDuty を出し続ける。
; 上位からの停止手段は無く、止められるのは物理緊急停止スイッチのみ。

[platformio]
default_envs = uno_r4_minima
extra_configs = ../common.ini

[env:uno_r4_minima]
extends = arduino_common
platform = renesas-ra
board = uno_r4_minima
; RGB LED（D6・1 個）の状態表示。他の基板と同じライブラリに揃えてある。
lib_deps = adafruit/Adafruit NeoPixel@^1.12.3
; 共有テストはこのプロジェクトからは回さない。
test_ignore = *
