; dc_motor / servo で共通のビルド設定。
;
; 2 つの platformio.ini がコメント以外まったく同じ内容を持っていると、片方だけを直したことに
; 誰も気付けない（WATCHDOG_ENABLED をサーボにだけ実装して DC に入れ忘れたのと同じ事故が
; ビルド設定でも起きる）。共通部はここだけが持ち、各プロジェクトは extra_configs で読み込む。

[env]
lib_extra_dirs = ../lib
test_framework = unity

[arduino_uno_r4]
platform = renesas-ra
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++17
build_flags = -std=gnu++17
; ファーム本体は Arduino 依存で native テストの対象外。共有テストは実機 env では 1 つも走らせない。
; 個別のテスト名ではなくワイルドカードにしてあるのは、テストを足すたびにここへ名前を
; 書き足す必要を無くすため（書き忘れると実機 env で Arduino ヘッダを踏んでビルドが壊れる）。
test_ignore = *

[env:uno_r4_minima]
extends = arduino_uno_r4
board = uno_r4_minima

; MotorCan（Arduino 非依存）のユニットテスト専用。Arduino ヘッダを一切踏まないこと。
[env:native]
platform = native
build_flags = -std=gnu++17 -Wall -Wextra
