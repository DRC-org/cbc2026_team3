; dc_motor / servo で共通のビルド設定（PlatformIO の 2 プロジェクト）。
; **MotorCan は電磁弁用（firmware/solenoid、CubeMX + CMake）とも共有している。**
; native テストは 3 枚ぶんの規則をここから回す。
;
; **2 枚は別の MCU に載っている。** DC 用は UNO R4 Minima（Renesas RA4M1 / 32bit）、
; サーボ用は Arduino Nano（ATmega328P / 8bit）で、CAN も内蔵ペリフェラルと MCP2515 で違う。
; そのため実機 env は各プロジェクトが自分で持ち、ここが持つのは本当に共通の部分だけ。
;
; native env（MotorCan のユニットテスト）だけは両者で完全に同じなのでここに置く。
; テスト対象の MotorCan は Arduino 非依存なので、MCU が違っても 1 つの env で足りる。

[env]
lib_extra_dirs = ../lib
test_framework = unity

; 実機ビルドの共通部分。platform / board は MCU が違うので各プロジェクトが指定する。
[arduino_common]
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11 -std=gnu++14 -std=gnu++17
build_flags = -std=gnu++17
; ファーム本体は Arduino 依存で native テストの対象外。共有テストは実機 env では 1 つも走らせない。
; 個別のテスト名ではなくワイルドカードにしてあるのは、テストを足すたびにここへ名前を
; 書き足す必要を無くすため（書き忘れると実機 env で Arduino ヘッダを踏んでビルドが壊れる）。
test_ignore = *

; MotorCan（Arduino 非依存）のユニットテスト専用。Arduino ヘッダを一切踏まないこと。
[env:native]
platform = native
build_flags = -std=gnu++17 -Wall -Wextra
