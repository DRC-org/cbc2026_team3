; DC モータ用自作モタドラのファームウェア。
; プロトコルの単一情報源は docs/motor_driver_can_protocol.md。
;
; 基板が Minima か WiFi かは未確定のため両方の env を用意してある。
; 共通ライブラリ MotorCan は Arduino 非依存で、native 環境でも同じソースを使う。

[platformio]
default_envs = uno_r4_minima

[env]
lib_extra_dirs = ../lib
test_framework = unity

[arduino_uno_r4]
platform = renesas-ra
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++17
build_flags = -std=gnu++17
; ファーム本体は Arduino 依存のため native 用テストは実機 env から除外する
test_ignore = test_protocol

[env:uno_r4_minima]
extends = arduino_uno_r4
board = uno_r4_minima

; UNO R4 WiFi 向けの env は意図的に用意していない。
; WiFi は CAN ペリフェラルのピンが Minima と違い、TX=D10 / RX=D13 に割り当たる。
; この基板の配線では PWM_L が D10、ステータス LED が D13 なので、
; モータ出力が CAN 送信線を乗っ取り PC から一切停止できない基板ができあがる。
; チーム提供のサンプルが CAN_RX 5 / CAN_TX 4 を前提にしていることからも
; DC 基板は Minima である。src/main.cpp の static_assert が衝突をビルドで検出する。

; プロトコル層のユニットテスト専用。Arduino ヘッダを一切踏まないこと
; （MotorCan が Arduino.h を include しないのはこの env を成立させるため）。
[env:native]
platform = native
build_flags = -std=gnu++17 -Wall -Wextra
