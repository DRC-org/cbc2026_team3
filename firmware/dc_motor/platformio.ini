; DC モータ用自作モタドラのファームウェア。
; プロトコルの単一情報源は docs/motor_driver_can_protocol.md。
;
; 基板は **Arduino UNO R4 Minima**。CAN は R4 内蔵ペリフェラルで、D4(TX)/D5(RX) に
; 固定されている。そのピンを他用途へ割り当ててはならない
; （src/main.cpp の static_assert が全ピンの衝突・重複を検出する）。

[platformio]
default_envs = uno_r4_minima
extra_configs = ../common.ini

; テストの対象は共有ライブラリ MotorCan なので、dc_motor と servo のどちらから回しても
; 同じ全ケースが走るよう共有ディレクトリを指す。片方のプロジェクトにだけ置くと、
; もう一方だけを回した人が共有ライブラリの回帰を検出できない。
test_dir = ../test

[env:uno_r4_minima]
extends = arduino_common
platform = renesas-ra
board = uno_r4_minima
; RGB LED（D6・1 個）の状態表示。CAN 不通と ID 未設定を現場で切り分けるために使う。
; サーボ用（Nano / Flash 32KB）と同じライブラリに揃えてある。表示の意味を 2 枚で
; 同じにしておかないと、現場で 2 種類の対応表を覚えることになる。
lib_deps = adafruit/Adafruit NeoPixel@^1.12.3
