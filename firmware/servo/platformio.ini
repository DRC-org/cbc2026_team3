; サーボ用自作モタドラのファームウェア。
; プロトコルの単一情報源は docs/motor_driver_can_protocol.md（特に §7）。
;
; **このプロジェクトだけ MCU が 2 種類ある**（3 枚のサーボ基板のうち 1 枚が別の MCU）:
;   - 基板 #0 / #1 … **Arduino Nano**（ATmega328P / 8bit / 5V）。CAN は **MCP2515 を
;     SPI で外付け**（内蔵 CAN ペリフェラルは無い）。D11/D12/D13 をハードウェア SPI が
;     占有する（D13 は SCK なのでステータス LED に使えない）
;   - 基板 #2      … **Arduino UNO R4 Minima**（RA4M1 / 32bit）。CAN は内蔵ペリフェラルで
;     D4(TX)/D5(RX) 固定
; PWM はどちらも Servo ライブラリ（R4 専用の PwmOut は使わない）。
;
; **プロジェクトを分けずに env を 2 つにしてあるのは、版番号を 1 つに保つため。**
; firmware/servo_r4/ を新設すると include/config.h が 2 つになり、can_id 0x40 台に
; 対応する kFirmwareVersion が 2 つ生まれる。tests/test_firmware_version_sync.py は
; 「can_id の上位 2bit → プロジェクト 1 つ」で config/**/*.yaml の expected_firmware と
; 突き合わせるので、**焼き忘れ検出の検査そのものが片方しか見ない嘘になる**。
;
; **default_envs は両方**。片方だけをビルドして満足すると、もう一方が壊れたことに
; 気付けない（ピンの表も静的検査も MCU ごとに違う分岐を通る）。
;
; Nano は Flash 32KB / SRAM 2KB しかないので、ライブラリを足したら必ず使用率を確認すること。

[platformio]
default_envs = nano, uno_r4_minima
extra_configs = ../common.ini

; テストの対象は共有ライブラリ MotorCan なので、dc_motor と servo のどちらから回しても
; 同じ全ケースが走るよう共有ディレクトリを指す。
test_dir = ../test

; 手元の実機は**古いブートローダ（57600 baud）**の個体。新しいブートローダ
; （115200 baud）の個体を使うときは board = nanoatmega328new に変える。
; 違うと avrdude が同期できず、しかも症状が紛らわしい: 同期待ちのあいだに
; スケッチが起動してシリアルへ喋り出し、avrdude がそれを応答として読むため
; 「not in sync: resp=0x45」のように**意味のある ASCII が並ぶ**。配線やポートの
; 誤りに見えるが、実際にはボーレート違いでしかない。
; 切り分けは -n（書き込みなし）で署名だけ読むのが速い:
;   avrdude -c arduino -p atmega328p -P /dev/ttyUSB0 -b 57600 -n
; ビルド成果物は同一（MCU も F_CPU も同じ）で、違うのは書き込み時の baud だけ。
[env:nano]
extends = arduino_common
platform = atmelavr
board = nanoatmega328
; **もう一方の MCU の CAN バックエンドは翻訳単位ごと外す。** 残すと、この env には
; 存在しないヘッダ（Arduino_CAN.h）を踏んでビルドが落ちる。
build_src_filter = +<*> -<can_r4.cpp>
; Servo は Arduino IDE には同梱されているが PlatformIO の AVR コアには入っていない。
; RGB LED は FastLED ではなく Adafruit NeoPixel を使う。1 個の WS2812 を光らせるだけに
; FastLED を引くと Flash 32KB に収まらない（FastLED は fl/json.cpp まで丸ごと付いてくる）。
lib_deps =
    arduino-libraries/Servo@^1.2.2
    coryjfowler/mcp_can@^1.5.0
    adafruit/Adafruit NeoPixel@^1.12.3

; 基板 #2。CAN は R4 内蔵ペリフェラルで D4(TX)/D5(RX) に固定されている。そのピンを
; 他用途へ割り当ててはならない（src/main.cpp の static_assert が variant のマクロを
; 直接見て衝突を検出する）。書き込みは DFU なのでブートローダの baud の話は無関係。
[env:uno_r4_minima]
extends = arduino_common
platform = renesas-ra
board = uno_r4_minima
build_src_filter = +<*> -<can_mcp2515.cpp>
; **mcp_can は入れない。** この基板に MCP2515 は載っていないので、依存に残すと
; 「SPI 外付けの構成でも動くように見える」誤解を残す。Arduino_CAN は R4 のコアに同梱。
lib_deps =
    arduino-libraries/Servo@^1.2.2
    adafruit/Adafruit NeoPixel@^1.12.3
