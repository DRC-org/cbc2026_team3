; サーボ用自作モタドラのファームウェア。
; プロトコルの単一情報源は docs/motor_driver_can_protocol.md（特に §7）。
;
; 基板が Minima か WiFi かは未確定のため両方の env を用意してある。
; CAN ペリフェラルのピンが両者で違う（Minima=D4/D5, WiFi=D10/D13）ので、
; サーボ出力ピンは include/config.h で env ごとに切り替えている。
;
; 共通ライブラリ MotorCan は Arduino 非依存で、native 環境でも同じソースを使う。

[platformio]
default_envs = uno_r4_minima

[env]
lib_extra_dirs = ../lib
test_framework = unity

[arduino_uno_r4]
platform = renesas-ra
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++17
build_flags = -std=gnu++17
; ファーム本体は Arduino 依存のため native 用テストは実機 env から除外する
test_ignore = test_servo

[env:uno_r4_minima]
extends = arduino_uno_r4
board = uno_r4_minima

[env:uno_r4_wifi]
extends = arduino_uno_r4
board = uno_r4_wifi

; 角度補間・可動範囲クランプ・到達推定のユニットテスト専用。Arduino ヘッダを一切踏まないこと
; （ServoMotion が Arduino.h を include しないのはこの env を成立させるため）。
[env:native]
platform = native
build_flags = -std=gnu++17 -Wall -Wextra
