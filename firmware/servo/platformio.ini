; サーボ用自作モタドラのファームウェア。
; プロトコルの単一情報源は docs/motor_driver_can_protocol.md（特に §7）。
;
; 基板は **Arduino Nano**（ATmega328P / 8bit / 5V）。DC 用の UNO R4 Minima とは
; MCU も CAN の持ち方も違う:
;   - CAN は **MCP2515 を SPI で外付け**（内蔵 CAN ペリフェラルは無い）
;   - PWM は R4 専用の PwmOut が使えないので Servo ライブラリを使う
;   - D11/D12/D13 をハードウェア SPI が占有する（D13 は SCK なのでステータス LED に使えない）
;
; Flash 32KB / SRAM 2KB しかないので、ライブラリを足したら必ず使用率を確認すること。

[platformio]
default_envs = nano
extra_configs = ../common.ini

; テストの対象は共有ライブラリ MotorCan なので、dc_motor と servo のどちらから回しても
; 同じ全ケースが走るよう共有ディレクトリを指す。
test_dir = ../test

; 新しいブートローダ（115200 baud）の Nano。古い個体（57600 baud）なら
; board = nanoatmega328 に変える。書き込み時にしか効かない違い。
[env:nano]
extends = arduino_common
platform = atmelavr
board = nanoatmega328new
; Servo は Arduino IDE には同梱されているが PlatformIO の AVR コアには入っていない。
; RGB LED は FastLED ではなく Adafruit NeoPixel を使う。1 個の WS2812 を光らせるだけに
; FastLED を引くと Flash 32KB に収まらない（FastLED は fl/json.cpp まで丸ごと付いてくる）。
lib_deps =
    arduino-libraries/Servo@^1.2.2
    coryjfowler/mcp_can@^1.5.0
    adafruit/Adafruit NeoPixel@^1.12.3
