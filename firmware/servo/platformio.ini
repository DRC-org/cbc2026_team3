; サーボ用自作モタドラのファームウェア。
; プロトコルの単一情報源は docs/motor_driver_can_protocol.md（特に §7）。
;
; 基板は UNO R4 Minima。CAN ペリフェラルは D4(TX)/D5(RX) に固定されているので、
; サーボ出力ピンをそこへ割り当ててはならない（src/main.cpp の static_assert が検出する）。
;
; ビルド設定の実体は ../common.ini。ここが持つのはプロジェクト固有の行だけ。

[platformio]
default_envs = uno_r4_minima
extra_configs = ../common.ini

; テストの対象は共有ライブラリ MotorCan なので、dc_motor と servo のどちらから回しても
; 同じ全ケースが走るよう共有ディレクトリを指す。片方のプロジェクトにだけ置くと、
; もう一方だけを回した人が共有ライブラリの回帰を検出できない
; （実際 MotorSafety のテストは dc_motor 側にしか無かった）。
test_dir = ../test
