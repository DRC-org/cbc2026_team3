# セッティングタイム中の指差喚呼チェックリスト。
#
# ロールは pre_match 1 つだけ。かつては main_hand / sub_hand の 2 名が別々に
# 指差喚呼し、両方揃って初めて試合に入れる構成だったが、実運用では 2 名が必ず
# 同じ場所で操縦するため独立した 2 回の確認にはならず、同じ機体を二度読み上げる
# だけになっていた。統合して Monitor の設定セクションに 1 つだけ置く。
#
# 全項目が完了するまで試合フェーズに入れない。
# 項目は id / label のみ必須。id は一覧内で一意にすること。
#
# ## group — その項目を画面のどこに置くか
#
# 指差喚呼を 1 本の長いリストにすると、操作 (コート選択・動作確認の起動) と
# それを確認する項目が画面の別の場所に離れ、操縦者は「押す → リストを探す →
# チェックする」を項目ごとに往復することになる。group はその往復を無くすための
# 宣言で、UI は同じ group の項目を対応するコントロールの直下へ並べる。
#
#   preflight    通電前・機体の初期状態。対応する操作は無く、列の先頭に並ぶ
#   court        コート選択ボタンの直下
#   motor_check  動作確認の起動ボタンと進捗の直下
#   final        開始直前。列の末尾に並ぶ
#
# **省略してよい。** 書かなかった項目と、UI が知らない group 名の項目は
# 「その他」としてまとめて描かれる (どこにも出ない項目は作らない)。
# 機構を持たないベンチ設定 (config/bench/*/checklist.yaml) は group を持たない。
# 語彙を増やすときは web/src/lib/checklistGroups.ts の CHECKLIST_GROUPS も足すこと
# — 足さないと項目は「その他」へ落ちる (消えはしない)。

checklists:
  # **動作確認 (sequences/motor_check.py) から除外されているアクチュエータは 1 つも無い。**
  # 両ハンドの全軸を 1 本のシーケンスで順に駆動する。ペア軸の y_axis / rotate も
  # move_to が軸名でしか指令を受けないので左右が同一フレームで同時に動き、
  # 単独駆動で機構を壊す経路が構造的に存在しない。
  #
  # ここが埋めるのは「駆動はするが**自動で合否が付かない**」ぶんである。
  # 切り分けは軸の種類だけで決まる:
  #
  #   - position / velocity 軸 … 位置定数の tolerance で到達を自動判定する。
  #     左右のずれも sync_tolerance で AxisSyncError になる → 指差喚呼は不要
  #   - duty 軸 (conveyor / 吸気・排気ポンプ) … 自作 DC 基板はエンコーダも電流センスも
  #     持たず FEEDBACK に速度が無いので、到達判定を持てず settle_s の固定待ちに落ちる。
  #     回ったかどうかは目視・聴音でしか分からない
  #   - on_off 軸 (電磁弁 6 個) … 電磁弁基板は弁が開いたかを観測する手段を持たず
  #     (圧力センサもリミットスイッチも非搭載)、到達フラグも立てない (仕様書 §9.3)。
  #     開いたかどうかは打音・目視でしか分からない
  #
  # 左右のずれ (y_axis_sync / rotate_sync) はこの分類の例外で、監視そのものは
  # 常駐保護の 3 層が持つが、**機構が実際に揃って見えるか**は人にしか見えない。
  # origin_sensor も駆動対象ではないので動作確認の枠に乗らないが、死んだまま
  # 原点合わせを始めると「いつまでも当たらない」形でしか現れないため、ここで
  # 反応を確認する。
  #
  # したがって *_sync / conveyor_* / valves_* / pumps_run / suction_* /
  # origin_sensor_react は省略できない。**これらが group: motor_check なのは、
  # どれも動作確認シーケンスが駆動したものを人が確かめるぶんだからである** —
  # 動作確認を回した直後、同じ場所で続けて唱えられるように隣へ並べる。
  pre_match:
    # --- 通電前の安全確認・機体の初期状態 ---
    #
    # can_bus_strict / health_ready は「機械が既に知っているのに、人が見る手順へ
    # 結び付いていなかった」ぶんである。
    #   - scripts/setup_can.sh --strict は試合前点検として作ってあるが、操縦者に
    #     実行させる導線がどこにも無かった。CANable が 1 本欠けたまま起動すると
    #     制御プログラムはそのバスを開けずに落ち、systemd の再起動制限に掛かって
    #     failed で固定される (復旧手順は docs/venue_recovery.md)
    #   - 無励磁 (state.safety.unenergized_motors) は配信されているが、
    #     「指令しても動かない」としてしか現れないので試合が始まってから気付く
    - id: can_bus_strict
      label: scripts/setup_can.sh --strict が全バス起動で通ること確認 (欠け 0 / 失敗 0)
      group: preflight
    - id: health_ready
      label: Monitor のヘルスが READY・無励磁のモータが 0 台であること確認
      group: preflight
    - id: estop_release
      label: 非常停止スイッチ解除確認
      group: preflight
    - id: main_home_position
      label: メインハンド初期位置確認
      group: preflight
    - id: sub_home_position
      label: サブハンド初期位置確認
      group: preflight
    - id: main_gripper_open
      label: グリッパ開状態確認
      group: preflight
    - id: sub_gripper_open
      label: 補助ハンド開状態確認
      group: preflight
    - id: wall_initial
      label: 壁 前後とも初期位置確認
      group: preflight
    - id: valves_closed
      label: 電磁弁 6 個が全て閉じていること確認 (通電音がしないこと)
      group: preflight
    - id: sub_dm3520_origin
      label: サブハンド 前後・昇降が原点位置にあること確認 (DM3520 は電源投入位置が原点)
      group: preflight

    # --- コート設定 ---
    - id: court
      label: コート設定 (赤/青) と実配置の一致確認
      group: court

    # --- 動作確認の結果と、自動判定できない機構の目視確認 ---
    - id: motor_check
      label: アクチュエータ動作確認 完了
      group: motor_check
    - id: y_axis_sync
      label: y 軸 左右のずれがないこと確認
      group: motor_check
    - id: rotate_sync
      label: エンドエフェクタ回転 左右のずれがないこと確認
      group: motor_check
    # 版番号の照合は自作モタドラ 3 種すべてに掛かる (サーボ / DC / 電磁弁)。
    # 一部の基板にだけ焼き忘れると症状は「そのモータが応答しない」だけなので、
    # 不一致の表示が出ていないことを 1 度だけ人が確かめる。
    - id: firmware_match
      label: 自作モタドラ 3 種のファーム版・サーボ可動角の異常表示が出ていないこと確認
      group: motor_check
    - id: origin_sensor_react
      label: 原点センサに触れて反応することを確認
      group: motor_check
    - id: sub_lift_holds
      label: 昇降軸を上げた状態で非常停止し、無励磁でも自重で落ちないこと確認 (DM3520 に保持ブレーキは無い)
      group: motor_check
    - id: conveyor_run
      label: コンベア 正転・逆転の目視確認
      group: motor_check
    - id: conveyor_stop
      label: コンベア停止確認
      group: motor_check
    - id: pumps_run
      label: 吸気ポンプ・排気ポンプが個別に回ること確認 (聴音。DC 基板は回転を報告しない)
      group: motor_check
    - id: valves_actuate
      label: 手動操縦で valve_1〜6 を個別に開閉し、6 個とも打音・動作を目視確認
      group: motor_check
    - id: suction_hold
      label: 吸気ポンプ運転中に弁を開き、ワークを吸着して保持できること確認
      group: motor_check
    - id: suction_release
      label: 弁を閉じ排気ポンプでワークが確実に離れること確認 (残圧で張り付かないこと)
      group: motor_check

    # --- 開始直前 ---
    #
    # estop_functional は estop_release (解除されていることの確認) とは別物である。
    # 物理非常停止は DC 基板の REF が受け、FEEDBACK の緊急停止ビット → サーバー全体の
    # 緊急停止 → ブロードキャスト E_STOP という経路で伝わるので、**配線 1 本・基板 1 枚で
    # 機能ごと失われる**。しかも失われても画面は平常のままで、押しても何も起きない
    # ことでしか分からない。押す側の確認は試合直前に 1 度だけ、実際に押して確かめる。
    # (DC 基板が繋がっていない構成では物理停止そのものが効かない)
    - id: estop_functional
      label: 非常停止を実際に押し、機体が止まり画面が緊急停止表示になること確認。解除で復帰すること
      group: final
    - id: field_clear
      label: 可動範囲内に人・物がないこと確認
      group: final
