checklists:
  pre_match:
    - id: installation
      label: ロボットの固定は正しいか
      group: preflight
    - id: error_pcb
      label: エラーの基板はないか
      group: preflight

    - id: court
      label: コート設定は正しいか
      group: court

    - id: motor_check
      label: ロボットの動作は正しいか
      group: motor_check

    - id: estop_functional
      label: 非常停止を実際に押し、機体が止まり画面が緊急停止表示になること確認。解除で復帰すること
      group: final
    - id: field_clear
      label: 可動範囲内に人・物がないこと確認
      group: final
    - id: operation_mode_sequence
      label: 試合開始パネルに「手動操縦中」の警告が出ていないこと確認 (手動のままだと START が拒否される)
      group: final
