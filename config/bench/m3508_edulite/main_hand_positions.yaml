# M3508 + EDULITE 05 同時ベンチ (機構未装着) の位置定数。
#
# 本番の config/main_hand_positions.yaml から y_axis と rotate だけを取り出したもの。
# gripper / conveyor / wall_* はモータを登録していないので書かない
# (書くと手動操縦の軸一覧に、指令の届かない軸が並ぶ)。
#
# **数値は単体ベンチ (config/bench/m3508/ と config/bench/edulite/) と同一に揃えてある。**
# ここだけ違う値にすると「単体で確かめた挙動」と「2 種同時の挙動」の差が、同時に
# 載せたせいなのか値を変えたせいなのか切り分けられなくなる。機構へ組み込むときは
# 本番の config/main_hand_positions.yaml を使うこと。
#
# **homing はどちらの軸にも書かない。** rotate のリミットスイッチは本番でも未装着で、
# しかもセンサは自作サーボ基板 = can_generic 側に居る。このセットは can_generic を
# 開かないので、書いても「センサが応答していません」で必ず失敗する。y_axis も同じ理由
# (原点センサは can_generic 側) で書かない —— 原点は電源投入位置。
# **ただし 2 軸で成り立ち方が違う。** y_axis (M3508) は最初のフィードバックを基準に
# 累積角を積むので放っておいても電源投入位置が原点になるが、rotate (EDULITE 05) の
# 原点はフラッシュの機械ゼロなので、config/bench/m3508_edulite/main_hand.yaml の
# set_zero_on_start: true が起動のたびに 0 へ付け替えて初めて揃う。

axes:
  # 昇降軸。左右 2 台の M3508 が機構的に直結しており、逆回転で同一の動作になる。
  # 指令・フィードバックともにモータ軸の deg。
  y_axis:
    unit: mm
    command_unit: deg
    timeout_s: 4.0
    tolerance: 1.0
    # 機構未装着なので左右がずれても壊れない。本番の 2.0mm のままだと、無負荷での
    # 追従差だけで緊急停止が掛かり通信確認が進まないため緩めてある。
    # それでも「片方がまったく動かない」(配線・CAN ID の誤り) は確実に超過するので、
    # 同期監視そのものは機能したまま。機構へ組み込むときは本番の 2.0mm へ戻すこと。
    sync_tolerance: 10.0
    # ベンチの可動範囲 [mm]。60mm でも出力軸は約 172deg (ほぼ半回転) にしかならないので、
    # 「回っているか」を目視するにはこの程度の幅が要る。機構は付いていないので端は無い。
    manual:
      min: 0.0
      max: 650.0
      steps: [1.0, 5.0, 10.0, 50.0, 100.0]
    # scale は本番と同じ値をそのまま使う。ここを変えると「ベンチで確かめた指令量」と
    # 「本番で出る指令量」が別物になり、通信確認としての意味が薄れる。
    #   出力軸 1 回転 = 360 * 3591/187 ≒ 6913.155 deg
    #   ピニオンは モジュール 1 / 歯数 40 (基準円 40.0mm)、1 回転で 125.664mm
    #   モータ軸 55.0131deg = 1mm 相当 (出力軸では約 2.865deg = 1mm 相当)
    # 導出と実測での確かめ方は本番の config/main_hand_positions.yaml に書いてある。
    motors:
      y_axis_r: { scale: 55.0131, offset: 0.0 }
      y_axis_l: { scale: -55.0131, offset: 0.0 }   # 機構的に逆回転で同一動作

  # エンドエフェクタ回転。左右 2 台の EDULITE 05 が機構的に直結しており、
  # 逆回転で同一の動作になる。指令・フィードバックともに rad。
  rotate:
    unit: deg
    command_unit: rad
    # 本番の 3.0s に対し延ばしてある。limit_speed をベンチで半分 (1.0rad/s ≒ 57deg/s) に
    # 絞ったので、full (90deg) の移動だけで 1.6s 掛かる。本番値のままだと
    # 「モータは正常なのに到達前にタイムアウトする」ことになり、通信確認が進まない。
    timeout_s: 5.0
    # 本番と同じ 2.0deg。ここを緩めるとフィードバックの解釈ミス
    # (uint16 ↔ rad のレンジ取り違え) を見逃すので、ベンチでこそ本番と同じ厳しさで見る。
    tolerance: 2.0
    # 機構未装着なので左右がずれても壊れない。本番の 3.0deg のままだと、無負荷での
    # 追従差だけで緊急停止が掛かり通信確認が進まないため緩めてある。
    # それでも「片方がまったく動かない」(配線・CAN ID の誤り) は確実に超過するので、
    # 同期監視そのものは機能したまま。機構へ組み込むときは本番の 3.0deg へ戻すこと。
    sync_tolerance: 15.0
    # ベンチの可動範囲 [deg]。本番の -5〜15deg では回転しているか目視しづらいため
    # 広げてある。機構は付いていないので端は無く、90deg でも 1.57rad と
    # EDULITE 05 の可動レンジ (±12.57rad) には遠く及ばない。
    manual:
      min: 0.0
      max: 180.0
      steps: [1.0, 5.0, 15.0, 45.0]
    motors:
      # deg -> rad (pi/180)。scale は本番と同じ値をそのまま使う。ここを変えると
      # 「ベンチで確かめた指令量」と「本番で出る指令量」が別物になり、通信確認としての
      # 意味が薄れる。機構側に減速が入るなら本番側を実測値へ差し替えること
      rotate_r: { scale: 0.017453292519943295, offset: 0.0 }
      rotate_l: { scale: -0.017453292519943295, offset: 0.0 }   # 逆回転で同一動作

positions:
  # 起動時のロータ位置が原点になる (M3508Driver は最初のフィードバックを基準に累積角を積む)。
  # 手動操縦パネルからプリセットとして送れる。
  y_axis:
    home: 0.0            # 原点 = 電源投入位置
    small: 5.0           # 出力軸で約 14deg。まず動いたことの確認
    half: 30.0           # 出力軸で約 86deg
    full: 60.0           # 出力軸で約 172deg。回転方向が左右で逆になることの確認

  # 原点 (0.0) は電源投入位置。ただし上の y_axis と成り立ち方が違う —— **EDULITE 05 の
  # 原点は放っておくとフラッシュの機械ゼロで、電源投入位置ではない**。
  # set_zero_on_start: true が起動のたびに set_zero を送ってその場を 0 にすることで、
  # 初めて y_axis と同じ「原点 = 電源投入位置」になる。
  # したがって「前回どこまで回したか」は起動を跨いで残らない (y_axis も同じ)。
  rotate:
    home: 0.0            # 原点 = 電源投入位置
    small: 10.0          # まず動いたことの確認
    half: 45.0           # 指令量と実際の回転角が比例していることの確認
    full: 90.0           # 回転方向が左右で逆になることの確認
