# M3508 + EDULITE 05 同時ベンチ (機構未装着) のモータ構成。
#
# robot_name を main_hand にしてあるのは、Web UI のロボットキーが web/src/routes.tsx で
# main_hand / sub_hand に固定されているため。ベンチ専用の名前にすると、どのタブにも
# 現れず手動操縦パネルを開けない。実機でもこの 4 台はメインハンド側なので main_hand を使う。
#
# 位置定数の読み先は「robot config と同じディレクトリの <robot_name>_positions.yaml」
# (main.py の _positions_path) なので、このファイルを config/bench/m3508_edulite/ に
# 置くことで robot_name は main_hand のまま
# config/bench/m3508_edulite/main_hand_positions.yaml が読まれる。
# 本番の config/main_hand_positions.yaml は無傷のまま残る。
#
# **このベンチでは M3508 2 台 + EDULITE 05 2 台だけを登録する。** 自作モタドラ
# (can_generic) を外すことで、登録されないバスへの送信も動作確認の対象も消え、
# CAN 通信の確認がこの 2 種に絞られる。
#
# **EDULITE 側 (rotate) は単体ベンチ (config/bench/edulite/) と同一に揃えてある。**
# そこだけ違う値にすると「単体で確かめた挙動」と「2 種同時の挙動」の差が、
# 同時に載せたせいなのか値を変えたせいなのか切り分けられなくなる。
#
# **一方 y_axis の PID は単体ベンチ (config/bench/m3508/ の kp 2.0) と別物である。**
# あちらは「まず回ること」を見るための最小構成で、こちらは 2026-09-03 に
# このセットで実測して詰めた値 (下の y_axis_r の注記と docs/mechanism_handoff.md
# §3-3)。**揃え直してはならない** —— 揃えると位置定数側の motion (台形速度
# プロファイル) と対にならないゲインが入り、実測した挙動が再現しなくなる。
#
# 機構へ組み込むときは本番の config/main_hand.yaml を使うこと。**この値を本番へ
# 写してもならない** —— 直結していない空回しで詰めた値なので、負荷が違う。
#
# --- 起動しないときに最初に見るところ ----------------------------------------
# このセットは CANable 2 本を同時に開く。片方が挿さっていなければ
# [Errno 19] No such device で起動そのものが落ちる (ip -br link show で両方確認)。
# バス名は serial で固定されるので、番号 (can0/can1) が入れ替わっても影響しない。

robot_name: main_hand

motors:
  # --- 昇降 y_axis (M3508 ×2, can_m3508) --------------------------------------
  #
  # 逆回転ペア軸 y_axis の右側。can_id は本番 (config/main_hand.yaml) と同じ 1。
  # ここが実機の C620 の設定とずれていると、y_axis_r のフィードバックが永久に届かず、
  # SyncGuard がペア全員を電流 0 に落とすため「指令は通るのに 2 台とも微動だにしない」
  # 状態になる。UI 上は指令が成功して見えるので、疑うべきは真っ先に candump。
  y_axis_r:
    driver: m3508
    bus: m3508_bus
    can_id: 1
    # --- 2026-09-03 にこのセットで実測して決めた値 ------------------------------
    # **位置定数側の motion (台形速度プロファイル) が入っている前提のゲイン。**
    # 振幅 5mm・各 2 往復での比較:
    #   kp=10 → 8 ステップとも整定せず、定常偏差 ±0.16〜0.40mm
    #   kp=32 → 8 ステップとも 0.23〜0.32s で整定、定常偏差 ±0.002〜0.094mm
    # 飽和はどちらも 0%。**飽和を恐れて上げられなかった kp が、プロファイルで
    # 上げられるようになった** (プロファイル無しなら偏差 0.57mm で P 項が飽和する)。
    #
    # kp が定常偏差に効く理由は摩擦。この軸は静止摩擦が実測 900counts 相当あり
    # (901counts 流れているのに動かない周期があった)、それとつり合う偏差
    #   900 / kp / 55.0131 [mm]
    # の内側ならどこでも静止できるので、止まる位置がその幅でばらつく。
    #   kp=10 → 1.64mm / kp=32 → 0.51mm
    #
    # !!! ki は kp=10 時代の 3.57 のまま。kp=32 に合わせた再調整はしていない !!!
    # 実測の全体と、次に測る人への注意は docs/mechanism_handoff.md §3-3。
    pid:
      kp: 32.0
      ki: 3.57
      kd: 1.35
      # ki を入れた以上、これは省略できない。機構端で動けないまま積分が育つと
      # 拘束が外れた瞬間に暴走する。下の output_limit の 20%
      # (本番の 2000 に対する 400 と同じ比率)。
      # 200 → 500 へ上げても定常偏差は改善しなかったが、この機体は同一条件でも
      # ±0.2mm 程度ばらつくので、その差はばらつきに埋もれている (§3-3)
      integral_limit: 200
      dead_band: 1.0
      # 本番の 2000counts (≒2.4A) に対しベンチは半分に絞る。機構が付いていない M3508 は
      # 負荷が無いぶん同じ電流でも一気に回るため、まず回ることの確認は低い上限で行う。
      # **位置定数側の motion.max_acceleration 600 の上限を決めているのはこの値である** ——
      # 本番は倍あるのでさらに上げられる余地があるが、機構が付くと負荷が変わる (§3-3)。
      output_limit: 1000

  # y_axis_r と対になる側。左右で追従特性が変わると押し合いになるため PID は同一値にする
  y_axis_l:
    driver: m3508
    bus: m3508_bus
    can_id: 2
    # 値の根拠は y_axis_r 側に書いてある。左右で 1 つでも違うと押し合いになる
    pid:
      kp: 32.0
      ki: 3.57
      kd: 1.35
      integral_limit: 200
      dead_band: 1.0
      output_limit: 1000

  # --- エンドエフェクタ回転 rotate (EDULITE 05 ×2, can_edulite) ----------------
  #
  # **出荷値は 2 台とも 0x7F。** そのまま同一バスへ載せると 2 台が同じ ID で応答し、
  # CANManager は最初にマッチした 1 台で打ち切るのでもう 1 台は永久にフィードバックを
  # 得られない。書き換えは scripts/edulite_set_id.py が走査 → 書き込み → 照合まで行う
  # (1 台ずつ行うこと。手順は config/bench/edulite/main_hand.yaml に詳しい)。
  # 実機 2 台は 2026-08-30 に 0x7F -> 0x01 / 0x02 へ書き込み済み。
  #
  # can_id が 1 / 2 なのは can_m3508 側の y_axis と同じ数字だが、**バスが違えば衝突しない**
  # (CAN ID の一意性はバス単位。CLAUDE.md「CAN ID はバス単位でロボット横断に一意」)。
  # このセットは 2 バスを同時に開くので、その前提が実際に成り立つことをここで確認できる。
  rotate_r:
    driver: edulite05
    bus: edulite_bus
    can_id: 1
    host_id: 0xFD
    mode: position
    # 本番の 2.0rad/s に対しベンチは半分に絞る。機構が付いていない EDULITE は
    # 負荷が無いぶん同じ指令でも一気に回るため、まず回ることの確認は低い上限で行う。
    # 1.0rad/s は出力軸 約 57deg/s。90deg 動かすのに 1.6s ほど掛かる勘定で、
    # 「回っている途中」が目で追える速さ。ゲインを詰める段階で本番値へ戻すこと。
    limit_speed: 1.0
    # 本番 5.0A に対し半分。無負荷なのでこれで回り切るが、机上で何かに引っ掛けたときに
    # 押し切らずに止まる。**これは機構保護ではなく机上の安全側の値**で、
    # 機構へ組み込むときは本番の 5.0 へ戻すこと。
    limit_current: 2.5
    # 位置ループのゲインはドライバ内蔵。本番と同値にしてある —— ここを下げると
    # 「ベンチで確かめた追従」と「本番の追従」が別物になり、通信確認の意味が薄れる。
    position_kp: 30.0
    # **上の y_axis と違い、本機の原点は電源投入位置ではない。** M3508 は最初の
    # フィードバックを基準に累積角を積むので放っておいても電源投入位置が原点になるが、
    # EDULITE 05 の原点はフラッシュに保存された機械ゼロで、電源投入位置とは無関係。
    # 2 台の機械ゼロが揃っていないと、逆回転ペアは scale の符号で向きを表す都合上、
    # 物理的に同じ姿勢でも (pos_r + pos_l) / |scale| の差として現れる。実機では起動直後に
    # 175.879deg となり、ベンチの緩い sync_tolerance 15.0deg でも超過した。
    # **同じ 4 台構成でもこの 2 軸は原点の決まり方が違う** —— y_axis が素直に 0 から
    # 始まるのを見て rotate も同じだと読むと、ここで必ず躓く。
    #
    # true にすると initialization_steps() の末尾で set_zero (通信タイプ 0x06) を送り、
    # 電源投入時の姿勢がそのまま原点になる。代償として「前回どこまで回したか」は
    # 起動を跨いで残らないが、これで 2 軸とも「原点 = 電源投入位置」で揃う。
    #
    # **このセットでは放置の代償が単体ベンチより大きい。** SyncMonitor の発報は
    # 全体緊急停止なので、rotate の偏差 1 つで**can_m3508 側の通信確認まで始められない**。
    # 症状は「2 本挿したのに何も動かない」で、真っ先に疑うのが CANable の挿し忘れや
    # バス名の取り違え (このセットが確かめたい当のもの) になり、切り分けが逆走する。
    #
    # **左右は必ず揃えること。** 片側だけ true にすると、その 1 台だけ原点が付け替わり、
    # 揃うどころか機械ゼロの差がまるごと偏差として残る。
    # 本番 (config/main_hand.yaml) と単体ベンチ (config/bench/edulite/) も同じ値。
    # 本番側はリミットスイッチが付いて homing: を有効化したら false へ戻す暫定措置で、
    # そのときはこちらも合わせること。
    set_zero_on_start: true

  # rotate_r と対になる側。左右で追従特性が変わると押し合いになるため制御パラメータは同一値にする
  rotate_l:
    driver: edulite05
    bus: edulite_bus
    can_id: 2
    host_id: 0xFD
    mode: position
    limit_speed: 1.0
    limit_current: 2.5
    position_kp: 30.0
    # rotate_r と必ず同じ値にすること (上の理由)
    set_zero_on_start: true
