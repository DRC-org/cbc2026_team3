# M3508 + EDULITE 05 同時ベンチ (機構未装着) 用の共通設定。
#
# **単体ベンチ 2 つでは確かめられないことのために置いている。**
# config/bench/m3508/ と config/bench/edulite/ は 1 本の CANable しか開かないので、
# 「2 本挿した状態で両方が読めるか」を一度も通らない。実機のメインハンドはこの 2 種が
# 同じ PC・同じプロセスにぶら下がる構成なので、機構へ組み込む前の最後の机上確認として
# ここを通す。**単体で 1 種ずつ確かめた後に使うこと** —— いきなりここから始めると、
# 落ちたときに CAN ID なのかバスなのか配線なのかを切り分ける手掛かりが無い。
#
# 同時に載せることで初めて確かめられること:
#   - CANable 2 本の固定名が入れ替わっていないこと。バス名は udev が serial で固定するが、
#     config/can_buses.yaml の serial が実機とずれれば入れ替わる。**C620 へ EDULITE 用の
#     指令が飛ぶ事故 (CLAUDE.md「CAN バス名は udev で個体固定する」) は、2 本挿した
#     この構成でしか机上に現れない**
#   - 受信ループ 2 本 + 位置制御ループ (200Hz) + 目標値再送 (20Hz) + 同期監視 (50Hz) が
#     同時に回った状態で、どちらの軸もフィードバックが途切れないこと
#   - 左右直結ペアが 2 組 (y_axis / rotate) 同時に監視される状態
#
# main.py の _setup_robot() は can_buses に並んだバスを**すべて** socketcan で open する。
# **したがってこのセットは CANable 2 本を同時に挿していないと起動しない**
# ([Errno 19] No such device)。1 本しか挿せないときは単体ベンチのどちらかを使う。
#
# 使い方:
#   scripts/setup_can.sh
#   uv run python main.py --system config/bench/m3508_edulite/system.yaml \
#       --config config/bench/m3508_edulite/main_hand.yaml \
#       --checklist config/bench/m3508_edulite/checklist.yaml

can_buses:
  m3508_bus: can_m3508
  edulite_bus: can_edulite
  generic_bus: can_generic

# health / match は書かない。**しきい値の既定値は lib/config_schema.py にしかなく**
# (HealthThresholds / MatchSettings)、省略した分はそこから埋まる。本番と同じ数値を
# 書き写すと bench 7 セット + 本番の 8 重管理になり、境界を 1 つ動かすたびに 8 箇所を
# 揃え直すことになる —— 揃え損ねたセットは「机上では OK なのに実運用で警告が出る」
# 形でしか現れない。省略しておけば、ベンチと実運用で判定基準がずれる余地が無い。
