checklists:
  pre_match:
    - id: bench_buses_up
      label: can_m3508 / can_edulite / can_generic の**3 本すべて**が up していること確認 (ip -br link show)。1 本でも欠けると [Errno 19] で起動しない
    - id: bench_bus_serial
      label: config/can_buses.yaml の serial が実機 3 本と一致していること確認。**入れ替わると C620 に EDULITE 用の指令が飛ぶ**
    - id: bench_free
      label: 可動範囲内に人・物がないこと確認
    - id: edulite_power
      label: EDULITE ドライバに電源が入り、動力線・エンコーダ線が確実に嵌まっていること確認
    - id: edulite_can_id
      label: EDULITE 2 台の can_id が 1 / 2 に分かれていること確認 (**出荷値は 2 台とも 0x7F**。scripts/edulite_set_id.py scan で 2 個の ID が 1 通ずつ応答すること)

    - id: m3508_wiring
      label: candump can_m3508 で 0x201 / 0x202 の 2 本が届いていること確認
    - id: edulite_wiring
      label: candump can_edulite で拡張 ID 0x02____01 / 0x02____02 の 2 本が届いていること確認
    - id: edulite_host_id
      label: EDULITE のフィードバックの宛先 (拡張 ID 下位 8bit) が host_id 0xFD であること確認 (ずれると動くのに STALE のまま)
    - id: bench_feedback_all
      label: モータ 8 台 (y_axis_r/l・rotate_r/l・gripper・conveyor・wall_f・wall_r) とセンサ rotate_origin_sensor のフィードバックが届き、STALE が 1 つも無いこと確認

    - id: y_axis_move
      label: 手動操縦で y_axis に work_1 を送り、M3508 2 台が逆向きに回ること目視確認。同じ向きなら scale の符号が片方落ちている
    - id: rotate_move
      label: 手動操縦で rotate に pick を送り、EDULITE 2 台が逆向きに回ること目視確認
    - id: bench_no_crosstalk
      label: y_axis を動かしている間 rotate が 1 度も動かないこと、逆も同様であること確認。**動いたらバスの割り当てが入れ替わっている**
    - id: bench_both_axes
      label: y_axis と rotate を続けて動かし、その間どちらの軸もフィードバックが途切れないこと確認 (受信ループ 3 本が同時に回っていること。can_generic の gripper / conveyor / wall_f / wall_r も STALE にならないこと)
    - id: bench_sync_pairs
      label: y_axis を work_shared・rotate を pick まで動かした状態で、どちらも左右の位置が揃っていること確認 (ずれるなら本番の許容差では止まる)
    - id: bench_return_home
      label: 両軸に home を送り、どちらも電源投入位置へ戻ること確認

    - id: bench_estop
      label: 両軸を動かしている最中に非常停止を押し、**モータ 8 台すべて**が出力を止めること確認 (動いている y_axis_r/l・rotate_r/l はその場で止まる。gripper / conveyor / wall_f / wall_r はブロードキャスト停止でラッチし、サーボ基板 #0 と DC 基板 #0 の LED が橙になる)
    - id: m3508_estop_current
      label: 非常停止中は M3508 の電流指令が 0 に落ちていること確認 (保持トルクは残らない)
    - id: edulite_estop_detach
      label: 非常停止中は EDULITE が無励磁になり手で回せること確認 (**保持トルクは残らない**)
    - id: bench_estop_release
      label: 非常停止を解除してもモータ 8 台とも勝手に動き出さないこと確認 (解除時の保持目標は解除時点の実測角)。**両基板の LED が橙から平常の青へ戻ること**も確認 (橙のまま残るならラッチが外れていない)
