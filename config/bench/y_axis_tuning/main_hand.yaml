robot_name: main_hand

# y_axis の実機チューニング用。M3508 2 台だけを載せる。
#
# **機構が組み上がった状態を対象にする。** 位置定数と保護値は
# config/bench/y_axis_tuning/main_hand_positions.yaml を参照。
#
# --- output_limit を本番より下げてある ------------------------------------
# 本番は 2000 counts (≒2.4A)。チューニング中は kp を上げて振動を出したり、
# 可動範囲の端へ寄せたりするので、突き当たったときの押し付け力をそのぶん
# 小さくしておく。800 counts ≒ 0.98A で、出力軸トルクは約 0.3N・m
# (ピニオン基準円 20mm で 15N ほど)。
# **詰め終わったら本番 config の値へ戻すこと。** ここを上げたまま本番へ
# 持っていくと、この config だけが「弱い機体」として残る。
#
# 左右で PID を必ず同じ値に保つ。追従特性が違うと押し合いになる
# (UI から変える限り set_pid_gain がグループ全員へ展開するので自動で守られる)。

motors:
  y_axis_r:
    driver: m3508
    bus: m3508_bus
    can_id: 1
    pid:
      # 2026-09-03 に実機で実測して決めた値 (振幅 0.5〜1.5mm / output_limit 800)。
      # 詰めた経緯と各値の役割は docs/mechanism_handoff.md の §3-1 を参照。
      kp: 32.0             # 左が動き出すのに必要。16 では左が静止摩擦を超えない
      ki: 10.0             # 遅れている側でだけ積分が育ち、重い側へ多く電流を配る
      kd: 1.0              # 行き過ぎを 50〜113% から 0〜5% へ抑えた
      # 積分項の出力寄与の上限 [counts]。**ki を入れるなら省略できない。**
      # この機構は左右で静止摩擦が大きく違い、遊びのせいで片方がもう片方を
      # 連れ回さない。ki は「偏差が残り続ける側でだけ積分が育つ」ので、
      # 動き出しの重い側へ自動的に多く電流を配る —— この非対称性にちょうど効く。
      # 一方で上限が無いと、機構端に当たって動けない間に積分が際限なく育ち、
      # 拘束が外れた瞬間に暴走する。output_limit (800) の半分に置いてある。
      integral_limit: 400.0
      dead_band: 1.0       # モータ軸 [deg]。y_axis の scale で約 0.018mm 相当
      output_limit: 800    # 上のコメント参照。本番 (2000) より低い

  y_axis_l:
    driver: m3508
    bus: m3508_bus
    can_id: 2
    pid:
      kp: 32.0
      ki: 10.0
      kd: 1.0
      integral_limit: 400.0   # y_axis_r と同じ値にすること (上の理由)
      dead_band: 1.0
      output_limit: 800
