axes:
  y_axis:
    unit: mm
    command_unit: deg
    timeout_s: 4.0
    tolerance: 1.0
    sync_tolerance: 2.0
    sync_kp: 8.0
    sync_limit: 200.0
    manual:
      min: -2.0
      max: 2.0
      steps: [0.1, 0.5, 1.0]
    motors:
      y_axis_r: { scale: 55.0131, offset: 0.0 }
      y_axis_l: { scale: -55.0131, offset: 0.0 }

positions:
  y_axis:
    home: 0.0
    fwd_1: 1.0
    fwd_2: 2.0
    back_1: -1.0
    back_2: -2.0
