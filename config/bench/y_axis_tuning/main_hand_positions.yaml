# y_axis 実機チューニングの位置定数。
#
# **原点は「起動した瞬間の姿勢」である。** この構成にはリミットスイッチが無い
# (origin_sensor はサーボ基板 = can_generic 上にあり、このセットはそのバスを開かない)。
# M3508Driver は最初に受け取ったフィードバックを累積角の原点にするので、位置はすべて
# **起動時からの相対値**になる。したがって:
#
#   - 起動前に軸をストロークの中ほどへ寄せておくこと
#   - 起動し直すたびに原点が変わる。前回の値と比べるときは注意する
#
# --- 可動範囲を ±2mm に絞ってある -------------------------------------------
# 原点が起動時の姿勢である以上、**軸がストロークのどこに居るか config からは
# 分からない**。仮にストロークの端で起動していても、±2mm なら突き当てても
# output_limit 800 counts (≒15N) 止まりで済む。
#
# **実測ストロークが分かったら、この範囲と positions を実測値へ広げること。**
# 手順は docs/mechanism_handoff.md の「y_axis の左右ずれを詰める」節。
# 広げる前に必ず scripts/sync_probe.py で可動範囲を実測する (無励磁のまま
# 手で端から端まで動かせば、観測した位置の範囲がそのまま読める)。

axes:
  y_axis:
    unit: mm
    command_unit: deg
    timeout_s: 4.0
    # 到達許容差 [mm]。本番と同じ。チューニング中に緩めると「整定していないのに
    # 到達した」ことになり、応答の良し悪しが判定から消える
    tolerance: 1.0
    # 左右のずれ許容 [mm]。**本番と同じ値を保つ。**
    # config/bench/m3508/ が 10.0mm まで緩めてあるのは機構未装着だからで、
    # 左右が直結したこの構成で緩めると、押し合いを止める層が丸ごと効かなくなる。
    sync_tolerance: 2.0
    # --- 同期補正 -----------------------------------------------------------
    # チューニングの対象。0.0 から始めて、まず kp を詰め、それでも移動中に開く
    # なら kp の 1/4 あたりから上げていく (手順は docs/mechanism_handoff.md §3-1)。
    # 効果は scripts/sync_probe.py の「移動中のずれ最大」で比べる ——
    # WS 配信 (20Hz) の瞬時値では数百 ms の移動のピークを読めない。
    sync_kp: 0.0
    # 補正項 1 つあたりの上限 [counts]。上の output_limit (800) の 25%。
    # sync_kp を入れるならこれは省略できない (起動時に拒否される)
    sync_limit: 200.0
    # 起動時の姿勢を中心にした狭い範囲。上のコメント参照
    manual:
      min: -2.0
      max: 2.0
      steps: [0.1, 0.5, 1.0]
    # homing は書けない。このセットは can_generic を開かないので origin_sensor が
    # 居らず、書くと動作確認の最初のステップが必ず「センサが応答していません」で
    # 止まる (症状は配線不良と区別が付かない)
    motors:
      # scale は本番と同じ値をそのまま使う。ここを変えると「チューニングで見た
      # 応答」と「本番で出る応答」が別物になる。導出は本番の
      # config/main_hand_positions.yaml に書いてある
      y_axis_r: { scale: 55.0131, offset: 0.0 }
      y_axis_l: { scale: -55.0131, offset: 0.0 }   # 機構的に逆回転で同一動作

positions:
  # ステップ応答を取るためのプリセット。すべて起動時の姿勢からの相対値。
  # 手動操縦パネルからプリセットとして送れる。
  #
  # 小さい移動 (fwd_1 / back_1) は整定と定常偏差を見るため、大きい移動
  # (fwd_2 / back_2) は加速中に飽和するかどうかを見るために置いてある。
  y_axis:
    home: 0.0            # 起動時の姿勢
    fwd_1: 1.0
    fwd_2: 2.0
    back_1: -1.0
    back_2: -2.0
