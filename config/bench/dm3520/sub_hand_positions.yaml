    tolerance: 1.0
    manual:
      min: -10.0
      max: 60.0
      steps: [1.0, 5.0, 10.0]

  sub_lift:
    unit: mm
    command_unit: rad
    scale: 0.0555556
    offset: 0.0
    timeout_s: 4.0
    tolerance: 1.0
    manual:
      min: -10.0
      max: 60.0
      steps: [1.0, 5.0, 10.0]

positions:
