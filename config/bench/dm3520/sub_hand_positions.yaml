# Damiao DM3520 単体ベンチ (機構未装着) の位置定数。
#
# 本番の config/sub_hand_positions.yaml から DM3520 の 2 軸だけを取り出したもの。
# sub_arm_joint / sub_gripper / valve_* / pump_* はモータを登録していないので書かない
# (書くと手動操縦の軸一覧に、指令の届かない軸が並ぶ)。
#
# **数値はベンチ専用に振り直してある。** 機構に組み込む前の CAN 通信確認が目的なので、
# 機構保護のための厳しい値より「回ったことが目で分かる」ことを優先している。
# 機構へ組み込むときは本番の config/sub_hand_positions.yaml を使うこと。

axes:
  # scale は本番と同じ値をそのまま使う。ここを変えると「ベンチで確かめた指令量」と
  # 「本番で出る指令量」が別物になり、通信確認としての意味が薄れる。
  #   scale = 2 / (m * z) = 2 / 36 = 0.0555556 [rad / mm]  (モジュール 1 / 歯数 36)
  #   出力軸 1 回転 = 113.097mm 相当。**減速比はドライバ内部で吸収済み**なので
  #   M3508 の y_axis と違って scale には現れない。
  # 導出と実測での確かめ方は本番の config/sub_hand_positions.yaml に書いてある。
  #
  # ピニオンを付けていない状態でこのベンチを回すなら、「18mm = 出力軸 1.0rad ≒ 57deg」
  # として出力軸の回転角で確認すればよい。
  sub_y_axis:
    unit: mm
    command_unit: rad
    scale: 0.0555556
    offset: 0.0
    timeout_s: 4.0
    # 本番と同じ 1.0mm。ここを緩めるとフィードバックの解釈ミス (p_max のずれ) を
    # 見逃すので、ベンチでこそ本番と同じ厳しさで見る
    tolerance: 1.0
    # ベンチの可動範囲 [mm]。60mm でも出力軸は約 191deg (半回転強) にしかならないので、
    # 「回っているか」を目視するにはこの程度の幅が要る。機構は付いていないので端は無い。
    manual:
      min: -10.0
      max: 60.0
      steps: [1.0, 5.0, 10.0]

  # 昇降。ベンチでは前後軸と同じ扱い (機構が付いていないので上下の区別が無い)。
  sub_lift:
    unit: mm
    command_unit: rad
    scale: 0.0555556
    offset: 0.0
    timeout_s: 4.0
    tolerance: 1.0
    manual:
      min: -10.0
      max: 60.0
      steps: [1.0, 5.0, 10.0]

positions:
  # 原点 (0.0) は電源投入位置 (本機は投入時に 0.0rad へ固定される)。
  # 手動操縦パネルからプリセットとして送れる。
  sub_y_axis: &bench_states
    home: 0.0            # 原点 = 電源投入位置
    small: 5.0           # 出力軸で約 16deg。まず動いたことの確認
    half: 30.0           # 出力軸で約 95deg
    full: 60.0           # 出力軸で約 191deg。位置がリニアに追従することの確認

  sub_lift: *bench_states
