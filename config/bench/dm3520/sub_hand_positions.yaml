axes:
  sub_y_axis:
    unit: mm
    command_unit: rad
    scale: 0.0555556
    offset: 0.0
    timeout_s: 4.0
    tolerance: 1.0
    manual:
      min: -10.0
      max: 60.0
      steps: [1.0, 5.0, 10.0]

  sub_lift:
    unit: mm
    command_unit: rad
    scale: 0.0555556
    offset: 0.0
    timeout_s: 4.0
    tolerance: 1.0
    manual:
      min: -10.0
      max: 60.0
      steps: [1.0, 5.0, 10.0]

positions:
  sub_y_axis: &bench_states
    home: 0.0            # 原点 = 電源投入位置
    small: 5.0           # 出力軸で約 16deg。まず動いたことの確認
    half: 30.0           # 出力軸で約 95deg
    full: 60.0           # 出力軸で約 191deg。位置がリニアに追従することの確認

  sub_lift: *bench_states
