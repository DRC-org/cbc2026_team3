# Damiao DM3520 単体ベンチ (機構未装着) 用の共通設定。
#
# 本番の config/system.yaml との違いは can_buses だけ。
# main.py の _setup_robot() は can_buses に並んだバスを**すべて** socketcan で open する
# ため、本番の 4 本構成のままでは挿していない CANable のぶんが [Errno 19] No such device
# となり、起動そのものが失敗する。
#
# ここを dm3520_bus だけに絞ることで CANable 1 本 (can_dm3520) だけで起動できる。
#
# **can_dm3520 の serial を採取していないとこのベンチも起動しない。**
#   udevadm info -a -p /sys/class/net/can0 | grep -m1 'ATTRS{serial}'
# 採取して config/can_buses.yaml に書き、sudo scripts/install.sh を再実行すること。
#
# 使い方:
#   scripts/setup_can.sh
#   uv run python main.py --system config/bench/dm3520/system.yaml \
#       --config config/bench/dm3520/sub_hand.yaml \
#       --checklist config/bench/dm3520/checklist.yaml

can_buses:
  dm3520_bus: can_dm3520

# health / match は書かない。**しきい値の既定値は lib/config_schema.py にしかなく**、
# 省略した分はそこから埋まる。本番と同じ数値を書き写すと 9 重管理になり、揃え損ねた
# セットが「机上では OK なのに実運用で警告が出る」形で残る。
