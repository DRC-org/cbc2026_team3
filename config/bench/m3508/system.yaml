# M3508 単体ベンチ (機構未装着) 用の共通設定。
#
# 本番の config/system.yaml との違いは can_buses だけ。main.py の _setup_robot() は
# can_buses に並んだバスを**すべて** socketcan で open するため、本番の 4 本構成の
# ままでは挿していない CANable のぶんが [Errno 19] No such device となり、
# 起動そのものが失敗する。
#
# ここを m3508_bus だけに絞ることで CANable 1 本 (can_m3508) だけで起動でき、
# 相手のいない実バスへ 20Hz 再送して TX エラーを積み上げることも無くなる。
#
# DC モータ基板 (自作モタドラ) 単体のベンチは config/bench/dc/ にある別セット。
# あちらは can_generic だけを開く。2 つを 1 つの config にまとめられないのは、
# 開くバスの本数がそのまま起動の可否になるため (挿していない CANable が 1 本でも
# あると起動しない)。
#
# 使い方:
#   scripts/setup_can.sh
#   uv run python main.py --system config/bench/m3508/system.yaml \
#       --config config/bench/m3508/main_hand.yaml \
#       --checklist config/bench/m3508/checklist.yaml

can_buses:
  m3508_bus: can_m3508

# health / match は書かない。**しきい値の既定値は lib/config_schema.py にしかなく**
# (HealthThresholds / MatchSettings)、省略した分はそこから埋まる。本番と同じ数値を
# 書き写すと bench 6 セット + 本番の 7 重管理になり、境界を 1 つ動かすたびに 7 箇所を
# 揃え直すことになる —— 揃え損ねたセットは「机上では OK なのに実運用で警告が出る」
# 形でしか現れない。省略しておけば、ベンチと実運用で判定基準がずれる余地が無い。
