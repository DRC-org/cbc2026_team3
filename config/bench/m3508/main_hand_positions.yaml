axes:
  y_axis:
    unit: mm
    command_unit: deg
    timeout_s: 4.0
    tolerance: 1.0
    sync_tolerance: 10.0
    sync_kp: 0.0
    sync_limit: 250.0
    manual:
      min: -10.0
      max: 60.0
      steps: [1.0, 5.0, 10.0]
    motors:
      y_axis_r: { scale: 55.0131, offset: 0.0 }
      y_axis_l: { scale: -55.0131, offset: 0.0 }

positions:
  y_axis:
    home: 0.0
    small: 5.0
    half: 30.0
    full: 60.0
