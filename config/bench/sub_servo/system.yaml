# サブハンドのサーボ 5 スロット (基板 #2) を 1 本ずつ動かすベンチ用の共通設定。
#
# **このセットの存在理由は「左右ペアを軸として動かさないこと」の一点である。**
# 本番の `sub_rotate` / `sub_pitch` は左右 2 台で 1 軸を成し、左は
# `scale: -1.0` / `offset: 270.0` で写す。**この 2 つは仮値**で、実機の左右は
# いま生値 0.0deg に居るので、軸として 0.0 を指令した瞬間に左だけ 270deg 振れる。
# 機構が付いた状態でそれをやると直結した機構をその場で捻る。
# ここでは 5 スロットを**それぞれ独立した 1 モータ軸**として登録するので、
# 折り返し点を知らないまま片側だけを少しずつ動かせる。
#
# サーボは位置を測らない。`FEEDBACK` が返すのは**クランプ後の指令角のエコー**で
# あって実測ではないので、角が正しいかを決められるのは人の目だけである。
#
# 使い方:
#   scripts/setup_can.sh
#   uv run python main.py --system config/bench/sub_servo/system.yaml \
#       --config config/bench/sub_servo/sub_hand.yaml \
#       --checklist config/bench/sub_servo/checklist.yaml --port 8082
#
# **cbc-can-watchdog は止めない。** 止めるのは相手の居ないバスを開くときで、
# can_generic には基板 #0〜#2 と電磁弁基板が居る。他のベンチと同時に走らせる
# ことがあるので、共有物であるウォッチドッグを個別のベンチで落とさない。
#
# **ポートは他と重ねない。** 同じ CAN ID を 2 つのサーバーが持つと目標値再送
# (20Hz) が殴り合うので、**基板 #2 を登録した他のサーバーは先に止めること**
# (本番 config は sub_hand を含むので該当する)。

can_buses:
  generic_bus: can_generic

# health / match は書かない。既定値は lib/config_schema.py にしかないので、
# 書き写すとベンチと実運用で判定基準がずれる余地ができる。
