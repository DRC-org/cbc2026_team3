# サブハンド直動 2 軸 + リミットスイッチのベンチの確認項目。
#
# 本番の config/checklist.yaml は y_axis / rotate / conveyor / 電磁弁など、この
# セットに存在しない機構の確認を求めるためそのままでは使えない。
#
# 手動操縦は PHASES_ANY なので、この一覧を埋めなくてもモータは動かせる
# (試合フェーズへ入るためのゲートであって、手動操縦のゲートではない)。
#
# **先頭の 2 つがこのセット固有の危険である。** 物理非常停止は効かず、
# 零点確定は「当たるまで動かす」動作なので、始める前に人の目で確かめる。

checklists:
  pre_match:
    - id: bench_no_physical_estop
      label: 「このセットでは物理非常停止が効かない」ことを全員が理解していること確認 (止める手段は UI の EMG STOP だけ)
      group: preflight
    - id: bench_clear
      label: 前後軸のストローク全域に人・物が無いこと確認 (零点確定は当たるまで動かす)
      group: preflight
    - id: bench_watchdog_off
      label: cbc-can-watchdog を止めてあること確認 (相手の居ないバスがあると 5 秒周期で全バスを down/up する)
      group: preflight
    - id: bench_bus_up
      label: can_dm3520 と can_generic の 2 本が up していること確認 (ip -br link)
      group: preflight
    - id: bench_mapping
      label: p_max/v_max/t_max が実機のレジスタ 0x15/0x16/0x17 と一致していること確認 (ずれると位置が比例倍で読める)
      group: preflight

    - id: sensor_react
      label: 前端スイッチを手で押し、画面のセンサ表示が反応すること確認 (未配線・極性違いは STALE にならないので触るしかない)
      group: motor_check
    - id: axis_direction
      label: 手動で正の指令を送り、機構が**前端へ近付く**向きに動くこと確認。逆なら homing.direction を -1 へ
      group: motor_check
    - id: axis_scale
      label: 指令 mm と実測 mm が一致すること確認 (ノギス。同じ方向から寄せて測る。ずれたら scale_new = scale_old * 指令値 / 実測値)
      group: motor_check
    - id: homing_from_away
      label: スイッチから離れた位置から零点確定が通ること確認 (探索 -> 到達 -> SET_ZERO)
      group: motor_check
    - id: homing_from_touching
      label: スイッチに触れた状態からも零点確定が通ること確認 (離脱の段が動くのはこのときだけ)
      group: motor_check
    - id: search_distance_fit
      label: 実測のストロークを控え、search_distance を「実測 + わずかな余裕」へ詰めたこと確認 (本番 config も同時に直す)
      group: motor_check
    - id: sub_lift_holds
      label: 昇降軸を上げた状態で無励磁にし、自重で落ちないこと確認 (DM3520 が SET_ZERO を宣言できる根拠がこれ)
      group: motor_check
