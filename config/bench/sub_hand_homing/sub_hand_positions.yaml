# サブハンド直動 2 軸 + リミットスイッチのベンチの位置定数。
#
# !!! **homing: は本番 (config/sub_hand_positions.yaml) と対である。片方だけ動かさない。** !!!
# 特に `search_distance` は「当たるまで動かす」動作に対する**唯一の無人の歯止め**なので、
# ベンチ側だけ広げると、本番では止まる構成がベンチでだけ機構端まで押し込む。
# ベンチで実測して詰めたら、同じ値を本番へも書くこと。
#
# 軸は本番と同じ 2 本だけ書く。登録していないモータの軸を書くと、手動操縦の軸一覧に
# 指令の届かない軸が並ぶ。

axes:
  # scale は本番と同じ。ここを変えると「ベンチで確かめた指令量」と「本番で出る指令量」が
  # 別物になる。
  #   scale = Gr * 2 / (m * z) = 19.203211 * 2 / 36 = 1.0668451 [rad / mm]
  #   ピニオンは KHK SS1-36 (モジュール 1 / 歯数 36)。
  #   **減速比 Gr は scale に現れる** —— 本機の位置はマニュアルの記述と違って
  #   ロータ角 (減速前) だった。2026-09-09 に実測で確定 (本番 config のコメント参照)。
  sub_y_axis:
    # 原点 = 前端。**唯一の無人の歯止めは search_distance だけ**なので、
    # 実測ストロークが分かるまでこの値を広げないこと。
    homing:
      sensor: sub_y_axis_f_limit_sensor   # 上の sub_hand.yaml の sensors: に登録した名前
      # **+ 方向で前端スイッチに当たることを 2026-09-09 に実機で確認済み。**
      direction: 1
      # !!! これは「既にスイッチに触れている状態から」しか通らない値である !!!
      # 実ストロークは 750mm なので、離れた位置から寄せるには 800mm 要る。
      # 0.1mm 刻みで 800mm は 8000 歩 = 8 分かかって点検に入らないので、
      # **粗い刻みで当てる → 離脱 → 0.1mm で寄せ直す二段探索が要る**(未実装)。
      # それが入るまで、この値は触れた状態からの確認にしか使えない。
      search_distance: 5.0
      # スイッチの移動許容が 0.3mm しかない。1 歩の行き過ぎがそのまま許容を食うので
      # 刻みはそれ以下に取る。原点のばらつきも刻み幅そのものなので、0.1mm 精度の
      # 要求とも一致する。フィードバック分解能 0.0286mm (p_max 1000) の 3.5 倍。
      step: 0.1
      # 触れた状態から離れるのに許す距離。**ON 区間の広さで決まる値で、
      # 刻み幅とは無関係。** 既定は step の 20 倍なので、書かないと
      # step 0.1 では 2.0mm しか離れられず、実測 2mm 以上の ON 区間を
      # 抜けきれない (2026-09-09 に実機で踏んだ)。実測は動作点 -2.02mm。
      release_distance: 10.0
      settle_s: 0.05          # 指令が機構へ届き、センサの状態が返る余裕
    unit: mm
    command_unit: rad
    scale: 1.0668451
    offset: 0.0
    timeout_s: 4.0
    # 本番と同じ 1.0mm。緩めるとフィードバックの解釈ミス (p_max のずれ) を見逃す。
    tolerance: 1.0
    # **これは手動ジョグでスイッチの位置を探すための範囲であって、零点確定の探索とは
    # 無関係である。** 探索 (`HomingRunner`) は `AxisHandle.set_target_value` を直接
    # 呼ぶので `manual` のクランプを 1 度も通らない —— 探索の歯止めは
    # `search_distance` ただ 1 つである。
    # 零点確定の前は原点が電源投入位置なので、座標の原点が機構のどこかは分からない。
    # 手で探すあいだだけ広く取ってある (本番は前端原点で -30.0〜2.0)。
    # **上限は p_max = 1000rad = ±937mm。** これを超えた位置は 16bit の
    # フィードバックが張り付くので「送ったのに位置が止まって見える」形でしか
    # 現れない。実ストローク 750mm に合わせて ±800 に取る。
    # **スイッチの位置が実測できたら本番と同じ値へ戻すこと。**
    manual:
      min: -800.0
      max: 800.0
      steps: [1.0, 5.0, 10.0]

  # 昇降。**homing: は書かない** —— 上下端スイッチ (0x4B / 0x4C) は登録してあり
  # 手段も開いているが、direction / search_distance / step が未実測。
  # この軸の原点は電源投入位置のまま。
  sub_lift:
    unit: mm
    command_unit: rad
    scale: 1.0668451
    offset: 0.0
    timeout_s: 4.0
    tolerance: 1.0
    manual:
      min: -2.0
      max: 30.0
      steps: [1.0, 5.0, 10.0]

positions:
  # 前後軸は前端が原点なので収納側が負。本番と同じ値。
  sub_y_axis:
    home: -20.0          # 収納位置 [mm]。前端から後ろへ
    extended: 0.0        # 前方への展開位置 = 前端 = 原点

  # 昇降は電源投入位置が原点のまま。
  sub_lift:
    home: 0.0
    lifted: 20.0
