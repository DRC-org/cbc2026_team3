# サブハンド直動 2 軸 + リミットスイッチのベンチの位置定数。
#
# !!! **homing: は本番 (config/sub_hand_positions.yaml) と対である。片方だけ動かさない。** !!!
# 特に `search_distance` は「当たるまで動かす」動作に対する**唯一の無人の歯止め**なので、
# ベンチ側だけ広げると、本番では止まる構成がベンチでだけ機構端まで押し込む。
# ベンチで実測して詰めたら、同じ値を本番へも書くこと。
#
# 軸は本番と同じ 2 本だけ書く。登録していないモータの軸を書くと、手動操縦の軸一覧に
# 指令の届かない軸が並ぶ。

axes:
  # scale は本番と同じ。ここを変えると「ベンチで確かめた指令量」と「本番で出る指令量」が
  # 別物になる。
  #   scale = Gr * 2 / (m * z) = 19.203211 * 2 / 36 = 1.0668451 [rad / mm]
  #   ピニオンは KHK SS1-36 (モジュール 1 / 歯数 36)。
  #   **減速比 Gr は scale に現れる** —— 本機の位置はマニュアルの記述と違って
  #   ロータ角 (減速前) だった。2026-09-09 に実測で確定 (本番 config のコメント参照)。
  sub_y_axis:
    # 原点 = 前端。**唯一の無人の歯止めは search_distance だけ**なので、
    # 実測ストロークが分かるまでこの値を広げないこと。
    homing:
      sensor: sub_y_axis_f_limit_sensor   # 上の sub_hand.yaml の sensors: に登録した名前
      # **+ 方向で前端スイッチに当たることを 2026-09-09 に実機で確認済み。**
      direction: 1
      # スイッチ間の実測は 500〜520mm (2026-09-09)。どこから始めても前端へ寄せられる
      # 値 + 余裕。**本番と対なので片方だけ動かさない。**
      search_distance: 560.0
      # 粗探索の刻み。ON 区間の実測 (動作点 -2.02mm、離脱まで約 2.2mm) より狭く取る
      coarse_step: 1.0
      # スイッチの移動許容が 0.3mm しかない。1 歩の行き過ぎがそのまま許容を食うので
      # 刻みはそれ以下に取る。原点のばらつきも刻み幅そのものなので、0.1mm 精度の
      # 要求とも一致する。フィードバック分解能 0.0286mm (p_max 1000) の 3.5 倍。
      step: 0.1
      # 触れた状態から離れるのに許す距離。**ON 区間の広さで決まる値で、
      # 刻み幅とは無関係。** 既定は step の 20 倍なので、書かないと
      # step 0.1 では 2.0mm しか離れられず、実測 2mm 以上の ON 区間を
      # 抜けきれない (2026-09-09 に実機で踏んだ)。実測は動作点 -2.02mm。
      release_distance: 10.0
      settle_s: 0.05          # 指令が機構へ届き、センサの状態が返る余裕
    # 指令を出す直前の歯止め。**この 3 つはどれも 2026-09-09 に実機で踏んだ形に
    # 対応する。** 判断は lib/motion_guard.py が持つ (層ごとに書き写さない)。
    guard:
      # 可動端のスイッチ。**+ 方向が前端。** ここを逆に書くと守りが反転し、
      # 押されている端へ進む指令だけが通る機体になる。
      # 離れる向きは必ず通るので、端に張り付いても手動で戻せる。
      limits:
        plus: sub_y_axis_f_limit_sensor    # + 方向 = 前端
        minus: sub_y_axis_r_limit_sensor   # - 方向 = 後端
      # 1 指令で実測位置から離れてよい最大量 [mm]。**桁の違う目標を止めるための値**で、
      # 正常な移動を塞がない側に取る (手動ジョグの刻みは最大 10mm、実ストロークは
      # 500〜520mm)。p_max の食い違いで位置が 80 倍に読めた事故はここに掛かる。
      max_step: 600.0
      # 機構に当たるとトルクが立つ (実測: 移動中 0.6Nm 以下、押し込みで 0.7Nm 超)。
      # 位置が進まないことより先に出るので、停滞判定より早く効く。
      stall_torque: 2.0
    unit: mm
    command_unit: rad
    scale: 1.0668451
    offset: 0.0
    timeout_s: 4.0
    # 本番と同じ 1.0mm。緩めるとフィードバックの解釈ミス (p_max のずれ) を見逃す。
    tolerance: 1.0
    # **これは手動ジョグでスイッチの位置を探すための範囲であって、零点確定の探索とは
    # 無関係である。** 探索 (`HomingRunner`) は `AxisHandle.set_target_value` を直接
    # 呼ぶので `manual` のクランプを 1 度も通らない —— 探索の歯止めは
    # `search_distance` ただ 1 つである。
    # 零点確定の前は原点が電源投入位置なので、座標の原点が機構のどこかは分からない。
    manual:
      min: -495.0
      max: 2.0
      steps: [1.0, 5.0, 10.0]

  # 昇降。**homing: は本番と対である。片方だけ動かさない。**
  sub_lift:
    # 原点 = 下端。**+ 方向が下**であることを 2026-09-09 に実機で確認した
    # (+ へ動かすと下端スイッチ 0x4C が立つ)。下端を原点に取るのは、上端へ寄せる
    # 探索よりも「降ろしきる」ほうが機構にとって自然な待機姿勢だからである。
    homing:
      sensor: sub_lift_b_limit_sensor
      direction: 1
      # スイッチ間の実測は 189mm (下端 +29.0mm / 上端 -160.0mm を同じ座標で測った)。
      # どこから始めても下端へ寄せられる値 + 余裕。**唯一の無人の歯止め。**
      search_distance: 220.0
      # 前後軸と同じ理由で 0.1mm。原点のばらつきは刻み幅そのもの
      step: 0.1
      # 粗探索の刻み。ON 区間の実測 (動作点 +29.0mm、離脱は 28.0〜28.5mm = 幅
      # 1.0〜1.5mm) より狭く取る。**前後軸より狭いのはこの実測差による。**
      coarse_step: 0.5
      # スイッチは動作点から下へ ON のままなので、押し込まれた姿勢で起動すると
      # 離脱に 30mm 要る (2026-09-09 に実機で踏んだ)。ヒステリシスは 3mm。
      release_distance: 35.0
      settle_s: 0.05
    # 指令を出す直前の歯止め。判断は lib/motion_guard.py が持つ。
    guard:
      # **+ 方向が下**なので plus が下端。ここを逆に書くと守りが反転する。
      limits:
        plus: sub_lift_b_limit_sensor      # + 方向 = 下端
        minus: sub_lift_t_limit_sensor     # - 方向 = 上端
      # スイッチ間の実測 189mm + 余裕。桁の違う目標だけを止める値に取る。
      max_step: 250.0
      # 前後軸と同じ。移動中のトルクより十分上、押し込みより下に取る。
      stall_torque: 2.0
    unit: mm
    command_unit: rad
    scale: 1.0668451
    offset: 0.0
    timeout_s: 4.0
    tolerance: 1.0
    manual:
      min: -185.0
      max: 2.0
      steps: [1.0, 5.0, 10.0]

positions:
  # 前後軸は前端が原点なので収納側が負。本番と同じ値。
  # 0.0 は動作点そのもの。tolerance 1.0mm (移動許容 0.3mm) と ON 区間 2mm の外へ離す。
  sub_y_axis:
    home: -20.0          # 収納位置 [mm]。前端から後ろへ
    extended: -5.0       # 前方への展開位置 [mm]

  # 昇降も下端スイッチで零点確定する。**+ 方向が下**なので上昇側が負。
  # **原点そのもの (0.0) を待機位置にしない** —— 下端スイッチの作動点がそこなので、
  # 待機のたびに ON 区間の縁へ座り、離脱段と guard の可動端インターロックの
  # どちらもその位置で誤動作する。本番と同じ値に揃えてある。
  sub_lift:
    home: -5.0           # 待機位置 [mm]。下端スイッチから 5mm 上げて離す
    lifted: -20.0        # 上昇位置 [mm]。**+ が下なので負**
