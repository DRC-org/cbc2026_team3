# サブハンド直動 2 軸 + リミットスイッチのベンチの位置定数。
#
# !!! homing: と guard: は本番 (config/sub_hand_positions.yaml) と対である。
#     片方だけ動かすと、本番では止まる構成がベンチでだけ機構端まで押し込む !!!
#
# 軸は本番と同じ 2 本だけ書く。登録していないモータの軸を書くと、手動操縦の軸一覧に
# 指令の届かない軸が並ぶ。

axes:
  sub_y_axis:
    homing:
      sensor: sub_y_axis_f_limit_sensor
      direction: 1
      # スイッチ間の実測は 447mm (2026-09-09 赤コート)。機構が動くうちは余裕を広く取る
      search_distance: 560.0
      # ON 区間の実測 2.2mm より狭く取る (広いと粗い 1 歩で跨ぎ切る)
      coarse_step: 1.0
      # スイッチの移動許容 0.3mm より小さく。原点のばらつきは刻み幅そのもの
      step: 0.1
      release_distance: 10.0
      settle_s: 0.05
    guard:
      # 逆に書くと守りが反転し、押されている端へ進む指令だけが通る
      limits:
        plus: sub_y_axis_f_limit_sensor
        minus: sub_y_axis_r_limit_sensor
      # 桁の違う目標だけを止める。実ストロークより広く取る
      max_step: 600.0
      # 移動中は 0.6Nm 以下、押し込みで 0.7Nm 超 (2026-09-09 実測)
      stall_torque: 2.0
      # 本番と対。区間の mm はこのベンチの top から解決されるので値は本番と違う
      requires: [{ axis: sub_lift, at: top }]
    unit: mm
    command_unit: rad
    # 位置はロータ角なので減速比が乗る: Gr * 2 / (m * z) = 19.203211 * 2 / 36
    scale: 1.0668451
    offset: 0.0
    # このベンチは limit_speed が本番の半分なので、本番の安全側の仮値 20mm/s も半分。
    # timeout_s は manual の全幅 442mm ÷ 10mm/s = 44.2 秒に整定の余裕
    min_speed: 10.0
    timeout_s: 50.0
    tolerance: 1.0
    # 探索は AxisHandle.set_target_value を直接呼ぶので、この範囲を 1 度も通らない
    manual:
      # 後端スイッチの実測 -447.0 の手前 (2026-09-09 赤コート)。スイッチ位置が動くので仮
      min: -440.0
      max: 2.0
      steps: [1.0, 5.0, 10.0]

  # 昇降。**+ 方向が下**。コートでモータの回転と上下の対応が鏡になり、スイッチは
  # 重力側に固定なので、scale の符号だけをコート別に持つ (2026-09-09 両コートで実機確認)。
  sub_lift:
    homing:
      sensor: sub_lift_b_limit_sensor
      direction: 1
      # スイッチ間の実測は 159mm (2026-09-09 赤コート)。機構が動くうちは余裕を広く取る
      search_distance: 220.0
      step: 0.1
      # ON 区間 1.0mm より狭く取る (前後軸より狭いのはこの実測差による)
      coarse_step: 0.5
      release_distance: 10.0
      settle_s: 0.05
    guard:
      # + が下なので plus が下端。逆に書くと守りが反転する
      limits:
        plus: sub_lift_b_limit_sensor
        minus: sub_lift_t_limit_sensor
      max_step: 250.0
      stall_torque: 2.0
    unit: mm
    command_unit: rad
    scale: { blue: 1.0668451, red: -1.0668451 }
    offset: 0.0
    # limit_speed は本番と同じ 1.0 なので、本番と同じ実測 17.39mm/s の直下と余裕 3 割
    min_speed: 17.0
    timeout_s: 12.0
    tolerance: 1.0
    manual:
      # 上端スイッチの実測 -159.0 の手前 (2026-09-09 赤コート)。スイッチ位置が動くので仮
      min: -152.0
      max: 2.0
      steps: [1.0, 5.0, 10.0]

# 位置名は本番 (config/sub_hand_positions.yaml) と対である。動作確認シーケンスは
# 位置名でしか指令できないので、名前がずれるとこのベンチでだけステップが引けない。
# 値は本番と違ってよい (このベンチには機構が無く、ストロークだけを確かめる)。
positions:
  sub_y_axis:
    # 0.0 は動作点そのもの。tolerance 1.0mm と ON 区間 2mm の外へ離す
    retracted: -20.0     # 収納位置 [mm]
    clear: -5.0          # 回転可能位置 [mm]

  sub_lift:
    # 0.0 は動作点そのもの。ON 区間の縁に座ると読みが揺れ、guard も 0.0 への
    # move_to を拒みうる
    top: -20.0           # 移動高さ [mm]
    pick: -5.0           # 吸着高さ [mm]
