# M3508 単体ベンチ (機構未装着) の位置定数。
#
# 本番の config/main_hand_positions.yaml から y_axis だけを取り出したもの。
# rotate / gripper / conveyor / wall_* はモータを登録していないので書かない
# (書くと手動操縦の軸一覧に、指令の届かない軸が並ぶ)。
#
# **数値はベンチ専用に振り直してある。** 機構に組み込む前の CAN 通信確認が目的なので、
# 機構保護のための厳しい値より「回ったことが目で分かる」ことを優先している。
# 機構へ組み込むときは本番の config/main_hand_positions.yaml を使うこと。

axes:
  # scale は本番と同じ値をそのまま使う。ここを変えると「ベンチで確かめた指令量」と
  # 「本番で出る指令量」が別物になり、通信確認としての意味が薄れる。
  #   出力軸 1 回転 = 360 * 3591/187 ≒ 6913.155 deg
  #   ピニオンは モジュール 1 / 歯数 40 (基準円 40.0mm)、1 回転で 125.664mm
  #   モータ軸 55.0131deg = 1mm 相当 (出力軸では約 2.865deg = 1mm 相当)
  # 導出と実測での確かめ方は本番の config/main_hand_positions.yaml に書いてある。
  y_axis:
    unit: mm
    command_unit: deg
    timeout_s: 4.0
    tolerance: 1.0
    # 機構未装着なので左右がずれても壊れない。本番の 2.0mm のままだと、無負荷での
    # 追従差だけで緊急停止が掛かり通信確認が進まないため緩めてある。
    # それでも「片方がまったく動かない」(配線・CAN ID の誤り) は確実に超過するので、
    # 同期監視そのものは機能したまま。機構へ組み込むときは本番の 2.0mm へ戻すこと。
    sync_tolerance: 10.0
    # ベンチの可動範囲 [mm]。60mm でも出力軸は約 172deg (ほぼ半回転) にしかならないので、
    # 「回っているか」を目視するにはこの程度の幅が要る。機構は付いていないので端は無い。
    manual:
      min: -10.0
      max: 60.0
      steps: [1.0, 5.0, 10.0]
    motors:
      y_axis_r: { scale: 55.0131, offset: 0.0 }
      y_axis_l: { scale: -55.0131, offset: 0.0 }   # 機構的に逆回転で同一動作

positions:
  # 起動時のロータ位置が原点になる (M3508Driver は最初のフィードバックを基準に累積角を積む)。
  # 手動操縦パネルからプリセットとして送れる。
  y_axis:
    home: 0.0            # 原点 = 電源投入位置
    small: 5.0           # 出力軸で約 14deg。まず動いたことの確認
    half: 30.0           # 出力軸で約 86deg
    full: 60.0           # 出力軸で約 172deg。回転方向が左右で逆になることの確認
