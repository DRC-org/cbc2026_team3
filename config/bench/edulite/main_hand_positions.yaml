# RobStride EDULITE 05 単体ベンチ (機構未装着) の位置定数。
#
# 本番の config/main_hand_positions.yaml から rotate だけを取り出したもの。
# y_axis / gripper / conveyor / wall_* はモータを登録していないので書かない
# (書くと手動操縦の軸一覧に、指令の届かない軸が並ぶ)。
#
# **数値はベンチ専用に振り直してある。** 機構に組み込む前の CAN 通信確認が目的なので、
# 機構保護のための厳しい値より「回ったことが目で分かる」ことを優先している。
# 機構へ組み込むときは本番の config/main_hand_positions.yaml を使うこと。
#
# **homing は書かない。** 本番でも rotate のリミットスイッチは未装着 (コメントアウト) で、
# しかもセンサは自作サーボ基板 = can_generic 側に居る。このベンチは can_edulite しか
# 開かないので、書いても「センサが応答していません」で必ず失敗する。

axes:
  # エンドエフェクタ回転。左右 2 台の EDULITE 05 が機構的に直結しており、
  # 逆回転で同一の動作になる。指令・フィードバックともに rad。
  rotate:
    unit: deg
    command_unit: rad
    # 本番の 3.0s に対し延ばしてある。limit_speed をベンチで半分 (1.0rad/s ≒ 57deg/s) に
    # 絞ったので、full (90deg) の移動だけで 1.6s 掛かる。本番値のままだと
    # 「モータは正常なのに到達前にタイムアウトする」ことになり、通信確認が進まない。
    timeout_s: 5.0
    # 本番と同じ 2.0deg。ここを緩めるとフィードバックの解釈ミス
    # (uint16 ↔ rad のレンジ取り違え) を見逃すので、ベンチでこそ本番と同じ厳しさで見る。
    tolerance: 2.0
    # 機構未装着なので左右がずれても壊れない。本番の 3.0deg のままだと、無負荷での
    # 追従差だけで緊急停止が掛かり通信確認が進まないため緩めてある。
    # それでも「片方がまったく動かない」(配線・CAN ID の誤り) は確実に超過するので、
    # 同期監視そのものは機能したまま。機構へ組み込むときは本番の 3.0deg へ戻すこと。
    sync_tolerance: 15.0
    # ベンチの可動範囲 [deg]。本番の -5〜15deg では回転しているか目視しづらいため
    # 広げてある。機構は付いていないので端は無く、90deg でも 1.57rad と
    # EDULITE 05 の可動レンジ (±12.57rad) には遠く及ばない。
    manual:
      min: -15.0
      max: 90.0
      steps: [1.0, 5.0, 15.0]
    motors:
      # deg -> rad (pi/180)。scale は本番と同じ値をそのまま使う。ここを変えると
      # 「ベンチで確かめた指令量」と「本番で出る指令量」が別物になり、通信確認としての
      # 意味が薄れる。機構側に減速が入るなら本番側を実測値へ差し替えること
      rotate_r: { scale: 0.017453292519943295, offset: 0.0 }
      rotate_l: { scale: -0.017453292519943295, offset: 0.0 }   # 逆回転で同一動作

positions:
  # 原点 (0.0) は電源投入位置 (set_zero_on_start: false なので起動しても 0 は動かない)。
  # 手動操縦パネルからプリセットとして送れる。
  rotate:
    home: 0.0            # 原点 = 電源投入位置
    small: 10.0          # まず動いたことの確認
    half: 45.0           # 指令量と実際の回転角が比例していることの確認
    full: 90.0           # 回転方向が左右で逆になることの確認
