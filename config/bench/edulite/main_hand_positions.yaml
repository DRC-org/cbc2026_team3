# RobStride EDULITE 05 単体ベンチ (機構未装着) の位置定数。
#
# 本番の config/main_hand_positions.yaml から rotate だけを取り出したもの。
# y_axis / gripper / conveyor / wall_* はモータを登録していないので書かない
# (書くと手動操縦の軸一覧に、指令の届かない軸が並ぶ)。
#
# **数値はベンチ専用に振り直してある。** 機構に組み込む前の CAN 通信確認が目的なので、
# 機構保護のための厳しい値より「回ったことが目で分かる」ことを優先している。
# 機構へ組み込むときは本番の config/main_hand_positions.yaml を使うこと。

axes:
  rotate:
    unit: deg
    # 本機のフィードバックも指令も rad。scale は本番と同じ値をそのまま使う ——
    # ここを変えると「ベンチで確かめた指令量」と「本番で出る指令量」が別物になり、
    # 通信確認としての意味が薄れる
    command_unit: rad
    # 本番の 3.0s では届かない。**ベンチは limit_speed を本番の半分 (1.0rad/s) に
    # 絞ってある**ので、可動端から端 (-90deg → +90deg = 3.14rad) に 3.1s かかる。
    # 3.0s のままだと「正しく動いているのに SequenceTimeoutError」になり、
    # 症状が配線不良と区別が付かない
    timeout_s: 5.0
    # 本番と同じ 2.0deg。ここを緩めるとフィードバックのレンジ取り違え
    # (POS_MIN/POS_MAX の誤り) を見逃すので、ベンチでこそ本番と同じ厳しさで見る
    tolerance: 2.0
    # 機構未装着なので左右がずれても壊れない。本番の 3.0deg のままだと、無負荷での
    # 追従差だけで緊急停止が掛かり通信確認が進まないため緩めてある。
    # それでも「片方がまったく動かない」(配線・CAN ID の誤り) は確実に超過するので、
    # 同期監視そのものは機能したまま。機構へ組み込むときは本番の 3.0deg へ戻すこと。
    sync_tolerance: 15.0
    # ベンチの可動範囲 [deg]。本番は機構の干渉を避けて -5〜+15deg に絞ってあるが、
    # 机上では端が無いうえ、その幅では「回ったか」が目視で分かりにくい。
    # ドライバのレンジ (POS_MIN/POS_MAX = ±12.57rad = ±720deg) には十分収まる。
    manual:
      min: -90.0
      max: 90.0
      steps: [5.0, 15.0, 45.0]
    # ホーミングは書かない。本番でもリミットスイッチ未装着で無効のままであり、
    # ベンチにはそもそもセンサが載っていない (センサ鮮度の事前確認で必ず失敗する)
    motors:
      # deg -> rad (pi/180)。本番と同一値
      rotate_r: { scale: 0.017453292519943295, offset: 0.0 }
      rotate_l: { scale: -0.017453292519943295, offset: 0.0 }   # 逆回転で同一動作

positions:
  # 原点 (0.0) は電源投入位置。main_hand.yaml で set_zero_on_start: true にしてあるので、
  # 起動時の姿勢がそのまま 0deg になる (本番は false = ドライバ保存の機械原点)。
  # 手動操縦パネルからプリセットとして送れる。
  rotate:
    home: 0.0            # 原点 = 電源投入位置
    small: 15.0          # まず動いたことの確認
    half: 45.0           # 指令量と実際の回転角が比例していることの確認
    full: 90.0           # 左右が逆向きに回ることの確認
