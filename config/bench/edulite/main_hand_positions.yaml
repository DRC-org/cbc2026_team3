axes:
  rotate:
    unit: deg
    command_unit: rad
    timeout_s: 5.0
    tolerance: 2.0
    sync_tolerance: 15.0
    manual:
      min: -15.0
      max: 90.0
      steps: [1.0, 5.0, 15.0]
    # travel（機械的可動域）は**書かない**。この構成は出力軸に何も繋がらないので
    # 軸は何回転でもし、到達しうる範囲が存在しない。manual の -15〜90 を流用すると、
    # 手で回した軸の論理角をその範囲へ引き寄せて読む。未設定 = 一意化しない
    motors:
      rotate_r: { scale: 0.017453292519943295, offset: 0.0 }
      rotate_l: { scale: -0.017453292519943295, offset: 0.0 }

positions:
  rotate:
    home: 0.0
    small: 10.0
    half: 45.0
    full: 90.0
