# RobStride EDULITE 05 単体ベンチ (機構未装着) 用の共通設定。
#
# 本番の config/system.yaml との違いは can_buses だけで、health / match は同一値を持つ。
# main.py の _setup_robot() は can_buses に並んだバスを**すべて** socketcan で open する
# ため、本番の 4 本構成のままでは挿していない CANable のぶんが [Errno 19] No such device
# となり、起動そのものが失敗する。
#
# ここを edulite_bus だけに絞ることで CANable 1 本 (can_edulite) だけで起動できる。
#
# **本機は 29bit 拡張 ID 専用**なので、物理的には自作モタドラ (11bit 標準 ID) と同じ
# バスに相乗りできる。それでもこのベンチが開くのは 1 本だけにしてある —— 相乗り相手の
# CANable を挿し忘れただけで起動そのものが落ち、症状が「EDULITE の確認ができない」に
# しか見えなくなるため。
#
# 使い方:
#   scripts/setup_can.sh
#   uv run python main.py --system config/bench/edulite/system.yaml \
#       --config config/bench/edulite/main_hand.yaml \
#       --checklist config/bench/edulite/checklist.yaml

can_buses:
  edulite_bus: can_edulite

# 以下 2 ブロックは本番 config/system.yaml と同値。ベンチだけ判定基準を変えると
# 「机上では OK なのに実運用で警告が出る」ことになり、確認の意味が薄れる。
health:
  feedback_timeout_ms: 500
  temp_warning_c: 65
  temp_critical_c: 80
  tx_error_threshold: 96

match:
  duration_s: 180
