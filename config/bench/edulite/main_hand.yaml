# RobStride EDULITE 05 単体ベンチ (機構未装着) のモータ構成。
#
# robot_name を main_hand にしてあるのは、Web UI のロボットキーが web/src/routes.tsx で
# main_hand / sub_hand に固定されているため。ベンチ専用の名前にすると、どのタブにも
# 現れず手動操縦パネルを開けない。実機でもこの 2 台はメインハンド側なので main_hand を使う。
#
# 位置定数の読み先は「robot config と同じディレクトリの <robot_name>_positions.yaml」
# (main.py の _positions_path) なので、このファイルを config/bench/edulite/ に置くことで
# robot_name は main_hand のまま config/bench/edulite/main_hand_positions.yaml が読まれる。
# 本番の config/main_hand_positions.yaml は無傷のまま残る。
#
# **このベンチでは EDULITE 05 の 2 台だけを登録する。** M3508 と自作モタドラを外すことで
# 登録されないバスへの送信も動作確認の対象も消え、CAN 通信の確認が EDULITE だけに絞られる。
#
# --- 最初に確かめること ------------------------------------------------------
# 1. can_id が実機と一致しているか。本機は 29bit 拡張 ID の下位 8bit が宛先なので、
#    違う ID の個体には **1 通も届かず、しかも指令も通らない**。「配線不良」にしか
#    見えないので、まず candump can_edulite でフィードバックの ID を読むこと。
#    フィードバック (通信タイプ 2) の拡張 ID は 0x02______ で、bit8-15 に相手の can_id が載る。
# 2. host_id (0xFD) がフィードバックの宛先と一致しているか。ずれるとこちらの指令は
#    受理されるのに、返ってくるフレームを PC 側が自分宛と判定しない
#    (症状は「動くのに STALE」= UI が赤いまま機体だけ動く、という最も紛らわしい形)。
#
# --- CAN ID の書き換え --------------------------------------------------------
# **出荷値は 2 台とも 0x7F。** そのまま同一バスへ載せると 2 台が同じ ID で応答し、
# CANManager は最初にマッチした 1 台で打ち切るのでもう 1 台は永久にフィードバックを
# 得られない。書き換えは scripts/edulite_set_id.py が走査 → 書き込み → 照合まで行う。
#
#   uv run python scripts/edulite_set_id.py scan
#   uv run python scripts/edulite_set_id.py set --from 0x7F --to 1
#
# **1 台ずつ行うこと。** 同じ ID の個体が 2 台ぶら下がっていると 1 通の書き換えフレームを
# 両方が受け取り、**両方とも同じ新 ID になる** (ツールが走査結果を見て拒否する)。
# 実機 2 台は 2026-08-30 に 0x7F -> 0x01 / 0x02 へ書き込み済み。

robot_name: main_hand

motors:
  # 逆回転ペア軸 rotate の右側。can_id は本番 (config/main_hand.yaml) と同じ 1。
  # ここが実機の設定とずれていると rotate_r のフィードバックが永久に届かず、
  # SyncGuard がペア全員を止めるため「指令は通るのに 2 台とも微動だにしない」状態になる
  # (M3508 ベンチと同じ現れ方。詳細は docs/impl_plan.md の M3508 ベンチの節)。
  rotate_r:
    driver: edulite05
    bus: edulite_bus
    can_id: 1
    host_id: 0xFD
    mode: position
    # 本番の 2.0rad/s に対しベンチは半分に絞る。機構が付いていない EDULITE は
    # 負荷が無いぶん同じ指令でも一気に回るため、まず回ることの確認は低い上限で行う。
    # 1.0rad/s は出力軸 約 57deg/s。90deg 動かすのに 1.6s ほど掛かる勘定で、
    # 「回っている途中」が目で追える速さ。ゲインを詰める段階で本番値へ戻すこと。
    limit_speed: 1.0
    # 本番 5.0A に対し半分。無負荷なのでこれで回り切るが、机上で何かに引っ掛けたときに
    # 押し切らずに止まる。**これは機構保護ではなく机上の安全側の値**で、
    # 機構へ組み込むときは本番の 5.0 へ戻すこと。
    limit_current: 2.5
    # 位置ループのゲインはドライバ内蔵。本番と同値にしてある —— ここを下げると
    # 「ベンチで確かめた追従」と「本番の追従」が別物になり、通信確認の意味が薄れる。
    position_kp: 30.0
    # **本機の原点は電源投入位置ではなく、フラッシュに保存された機械ゼロである。**
    # 2 台の機械ゼロは揃っておらず、逆回転ペアは scale の符号で向きを表すので、物理的に
    # 同じ姿勢でも人間の単位へ逆換算すると (pos_r + pos_l) / |scale| の差として現れる。
    # 実機では起動直後に 175.879deg となり、ベンチの緩い sync_tolerance 15.0deg でも
    # SyncMonitor が全体緊急停止を掛けて通信確認が 1 歩も進まなかった。
    #
    # true にすると initialization_steps() の末尾で set_zero (通信タイプ 0x06) を送り、
    # 電源投入時の姿勢がそのまま原点になる。**代償として「前回どこまで回したか」は
    # 起動のたびに失われる**が、通信確認の起点が毎回 0 で揃うほうが机上では読みやすい。
    #
    # **左右は必ず揃えること。** 片側だけ true にすると、その 1 台だけ原点が付け替わり、
    # 揃うどころか機械ゼロの差がまるごと偏差として残る。
    #
    # 本番 (config/main_hand.yaml) と同じ値にしてある —— ベンチと本番で起動時の原点の
    # 決まり方が違うと、机上で確かめた指令量と本番で出る指令量が別物になる。
    # 本番側はリミットスイッチが付いて homing: を有効化したら false へ戻す暫定措置で、
    # そのときはこちらも合わせること。
    set_zero_on_start: true

  # rotate_r と対になる側。左右で追従特性が変わると押し合いになるため制御パラメータは同一値にする
  rotate_l:
    driver: edulite05
    bus: edulite_bus
    can_id: 2
    host_id: 0xFD
    mode: position
    limit_speed: 1.0
    limit_current: 2.5
    position_kp: 30.0
    # rotate_r と必ず同じ値にすること (上の理由)
    set_zero_on_start: true
