# サーボ基板単体ベンチ (機構未装着) 用の共通設定。
#
# 本番の config/system.yaml との違いは can_buses だけ。main.py の _setup_robot() は
# can_buses に並んだバスを**すべて** socketcan で open するため、本番の 4 本構成の
# ままでは挿していない CANable のぶんが [Errno 19] No such device となり、
# 起動そのものが失敗する。
#
# ここを generic_bus だけに絞ることで CANable 1 本 (can_generic) だけで起動でき、
# 相手のいない実バスへ 20Hz 再送して TX エラーを積み上げることも無くなる。
#
# **DC 基板ベンチ (config/bench/dc/) と開くバスは同じ can_generic で、違うのは
# 登録するデバイスだけ。** 両方繋いだまま片方の config で起動しても動く
# (登録していない基板のフレームは _dispatch_frame が誰にも配らず捨てるだけ) ので、
# このセットで起動したときに DC 基板が STALE として現れることは無い。
#
# セットを 1 つにまとめられないのは、開くバスの本数がそのまま起動の可否になるため。
#
# 使い方:
#   scripts/setup_can.sh
#   uv run python main.py --system config/bench/servo/system.yaml \
#       --config config/bench/servo/main_hand.yaml \
#       --checklist config/bench/servo/checklist.yaml

can_buses:
  generic_bus: can_generic

# health / match は書かない。**しきい値の既定値は lib/config_schema.py にしかなく**、
# 省略した分はそこから埋まる。本番と同じ数値を書き写すと 9 重管理になり、揃え損ねた
# セットが「机上では OK なのに実運用で警告が出る」形で残る。
