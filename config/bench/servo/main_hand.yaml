# サーボ基板単体ベンチ (機構未装着) のモータ構成。
#
# robot_name を main_hand にしてあるのは、Web UI のロボットキーが web/src/routes.tsx で
# main_hand / sub_hand に固定されているため。ベンチ専用の名前にすると、どのタブにも
# 現れず手動操縦パネルを開けない。
#
# 位置定数の読み先は「robot config と同じディレクトリの <robot_name>_positions.yaml」
# (main.py の _positions_path) なので、このファイルを config/bench/servo/ に置くことで
# robot_name は main_hand のまま config/bench/servo/main_hand_positions.yaml が読まれる。
# 本番の config/main_hand_positions.yaml も他のベンチのものも無傷のまま残る。
#
# **このベンチではサーボ基板 1 枚の 5 スロットだけを登録する。** M3508 / EDULITE /
# DC 基板を外すことで、登録されないバスへの送信も動作確認の対象も消え、確認が
# 自作モタドラ (サーボ) の 1 枚に絞られる。
#
# 本番では 4 本のサーボに機構上の役割名 (gripper / wall_f / wall_r / sub_gripper) が
# 付くが、ベンチでは機構が付いていないのでスロット名で登録する。どのスロットに
# サーボを挿しても同じ手順で試せるようにするため。
#
# ---------------------------------------------------------------------------
# !!! デバイス ID は実機の DIP 設定 (基板番号 1) に合わせて 0x48-0x4C にしてある !!!
# ---------------------------------------------------------------------------
# デバイス ID は「基板種別 | 基板番号 | スロット番号」の固定ビット分割 (仕様書 §2.2)。
# サーボ基板 (種別 1) の基板番号 N、スロット 0-4 が 0x40+8N 〜 0x44+8N になる。
#
#   基板番号 | SV0  | SV1  | SV2  | SV3  | SV4
#   ---------+------+------+------+------+------
#      0     | 0x40 | 0x41 | 0x42 | 0x43 | 0x44   ← 本番 config/main_hand.yaml が前提にする値
#      1     | 0x48 | 0x49 | 0x4A | 0x4B | 0x4C   ← このベンチ (実機の DIP が 1 だった)
#
# **本番 (config/main_hand.yaml) は基板番号 0 を前提にしているので、この基板を
# 本番構成へ組み込む前に DIP を全 OFF へ戻すこと。** 戻し忘れると、本番では
# gripper / wall_f / wall_r が指令を受け取らず FEEDBACK も来ない (全て STALE) 状態に
# なり、症状は「サーボ基板だけ丸ごと死んでいる」ようにしか見えない。
#
# DIP を変えたらこのファイルの can_id も直すこと。実際の値は candump が教えてくれる:
# FEEDBACK の CAN ID は 0x300 + デバイス ID なので、0x348 が流れていれば 0x48。
# ID を合わせる仕組みはファーム側にも PC 側にも無く、ここが唯一の接点になる。

robot_name: main_hand

motors:
  # SV0 (D4)。本番では gripper が載っているスロット。
  servo_sv0:
    driver: generic
    bus: generic_bus
    can_id: 0x48               # サーボ基板 #1 SV0
    control_type: position
    # INFO（1Hz の自己申告）と突き合わせる期待値（仕様書 §3.4）。**不一致は FAULT。**
    # 焼き忘れも 180/270 サーボの取り違えも、機体は指令どおり動いたようにしか見えない
    # （FEEDBACK が返すのはクランプ後の指令角）ので、この照合以外に気付く手段が無い。
    # 値は firmware/servo/include/config.h の kFirmwareVersion と
    # kServoSlots[].pulse.angleRangeDeg に対応する。**ファームを直したらここも直す。**
    expected_firmware: 2
    expected_angle_range_deg: 270.0
    motor_check:
      # positions.servo_sv0.small と一致させること。ずれると「動作確認で動いた位置」と
      # 「手動操縦で送る位置」が別物になり、確認が意味を失う (本番 config と同じ規則)。
      #
      # **この基板は位置を報告できる**ので、DC 基板と違って動作確認を自動判定できる。
      # FEEDBACK は DLC=3 で Byte1-2 に現在角が載り、到達は Byte0 bit0 で分かる。
      # ファームのスルーレートは 90deg/s なので 5deg は約 56ms、
      # system.yaml の per_motor_timeout_ms (1500) に対して十分な余裕がある。
      magnitude: 5.0

  # SV1 (D5)。本番では wall_f。
  servo_sv1:
    driver: generic
    bus: generic_bus
    can_id: 0x49               # サーボ基板 #1 SV1
    control_type: position
    expected_firmware: 2
    expected_angle_range_deg: 270.0     # firmware/servo/include/config.h と対
    motor_check:
      magnitude: 5.0

  # SV2 (D6)。本番では wall_r。
  servo_sv2:
    driver: generic
    bus: generic_bus
    can_id: 0x4A               # サーボ基板 #1 SV2
    control_type: position
    expected_firmware: 2
    expected_angle_range_deg: 270.0     # firmware/servo/include/config.h と対
    motor_check:
      magnitude: 5.0

  # SV3 (D7)。本番ではサブハンドの sub_gripper。
  servo_sv3:
    driver: generic
    bus: generic_bus
    can_id: 0x4B               # サーボ基板 #1 SV3
    control_type: position
    expected_firmware: 2
    expected_angle_range_deg: 270.0     # firmware/servo/include/config.h と対
    motor_check:
      magnitude: 5.0

# --- センサ入力 (スロット SV4 / D8) ---
# **センサはモータではない。** 自作基板は 1 スロット = 1 CAN デバイスで、センサも
# 自分のデバイス ID で FEEDBACK を送る (仕様書 §5.2)。ここに登録しないと CANManager の
# 受信ループがそのフレームを誰にも配らず、接触が PC まで届かない (照合する仕組みは無い)。
#
# motors ではなくこちらに書くことで、動作確認・目標値再送・UI のモータ一覧に
# 「常に 0 のモータ」が並ばない。途絶は STALE として監視される。
#
# センサの FEEDBACK は DLC=1 (状態フラグのみ) で、位置を持たない。
# 接触は Byte0 bit4 で報告されるが、**接触そのものは異常ではない** — 原点合わせで
# 触れさせるたびに FAULT になってはならないので、ヘルス判定には入っていない。
sensors:
  servo_sv4:
    bus: generic_bus
    can_id: 0x4C               # サーボ基板 #1 SV4
