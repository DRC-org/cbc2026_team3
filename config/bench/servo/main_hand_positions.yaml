# サーボ基板単体ベンチ (機構未装着) の位置定数。
#
# 本番の gripper / wall_f / wall_r は離散状態しか取らないので manual: を書かないが、
# **ベンチはその逆で manual: を書いて連続操作を許す** —— 確かめたいのが「機構の状態」
# ではなく「指令した角度どおりにサーボが動くか」で、角度を連続で振らないとスルーレートも
# 可動範囲のクランプも確認できないため。機構へ組み込むときは本番の
# config/main_hand_positions.yaml を使うこと。
#
# ---------------------------------------------------------------------------
# 角度の範囲は**ファームのクランプ端ではない。この yaml が唯一の歯止めである**
# ---------------------------------------------------------------------------
# firmware/servo/include/config.h の kGripperLimits / kWallFLimits / kWallRLimits
# (基板 #0 SV0〜SV2) は 3 本とも {0.0, 270.0, 90.0} = 可動範囲 0〜270deg・
# スルーレート 90deg/s で、**サーボの全可動域なのでクランプは実質効いていない**。
# ファームは範囲外の指令をクランプで受けるが、その端が全可動域にある以上、ここに
# 40deg と書けば基板は 40deg まで動く —— 「行き過ぎてもファームが止めてくれる」
# 前提はもう無い。下の manual.min / max (0〜30deg) と positions の full (30.0) は
# その前提が消えた後も**意図的に残してある仮値**である。
#
# **負の角度は書けない**（仕様書 §7.7）。値は 0 起点の出力軸絶対角で、
# **180 度品か 270 度品かはこのファイルに現れない**（ServoPulseSpec が吸収する）。
#
# **可動範囲を広げるときは、この yaml とファームのそのスロットの定数の両方を見る。**
# 機構が付いた状態で「当たらない範囲」を実測し、**先にファームのそのスロットの定数を
# 実可動域へ狭めてから**この yaml をその内側で動かすこと。広すぎるとサーボがメカ
# ストッパに当たったまま停動し、短時間で焼損する (仕様書 §7.2)。

axes:
  # 3 本とも同一仕様。scale は 1.0 = 指令値がそのまま角度 [deg] で、本番の
  # gripper / wall_f / wall_r と同一にしてある (ベンチで確かめた指令量が本番でもそのまま出る)。
  #
  # **SV3 / SV4 はここに現れない。** ファームは SV3 を TouchSensor、SV4 を Unused と
  # 宣言しており (firmware/servo/include/config.h の kServoBoards[])、
  # どちらも駆動できないので軸を持たない。SV3 は
  # config/bench/servo/main_hand.yaml の sensors: に登録してある (SV4 は FEEDBACK を
  # 送らないので登録しない)。
  #
  # timeout_s はスルーレート 90deg/s で全ストローク 30deg を動く時間 (約 0.33s) に
  # 対する余裕を見た値。本番の 2.0s と同じにしてある。
  servo_sv0:
    unit: deg
    command_unit: deg
    scale: 1.0
    offset: 0.0
    timeout_s: 2.0
    # 手動の可動範囲 [deg]。**ファームのクランプ端 (現在 0〜270deg) より内側の仮値**で、
    # 実際に指令を止めているのはこの 2 行だけである (上のコメント参照)。
    # 機構が付いていないので「物理端の内側に取る」原則が効く相手はまだ無い。
    manual:
      min: 0.0
      max: 30.0
      steps: [1.0, 5.0, 10.0]

  servo_sv1:
    unit: deg
    command_unit: deg
    scale: 1.0
    offset: 0.0
    timeout_s: 2.0
    manual:
      min: 0.0
      max: 30.0
      steps: [1.0, 5.0, 10.0]

  servo_sv2:
    unit: deg
    command_unit: deg
    scale: 1.0
    offset: 0.0
    timeout_s: 2.0
    manual:
      min: 0.0
      max: 30.0
      steps: [1.0, 5.0, 10.0]

positions:
  # 手動操縦パネルにこの名前のプリセットボタンが並ぶ。ジョグと併用できる。
  #
  # **initial (0.0deg) が基板の起動角と一致しているのは servo_sv0 だけ。**
  # firmware/servo/include/config.h の kServoBoards[] の基板 #0 は initialAngleDeg に
  # SV0 0.0 / SV1 270.0 / SV2 90.0 を持ち、**基板は電源投入時にその角度へ駆動する**
  # (SV1 / SV2 の起動角は上の manual 範囲 0〜30deg の外側にある)。したがって
  # 「initial を送ったときの動きが起動直後の動きと一致する」ことを確認できるのは
  # servo_sv0 だけで、SV1 / SV2 は通電と瞬断のたびに 270deg / 90deg へ飛ぶ ——
  # ベンチでは何も付いていないので実害は無いが、本番の wall_f / wall_r で
  # 起きることそのものである (本番はその角が wall_f.initial / wall_r.initial に一致する)。
  #
  # 動作確認 (sequences/motor_check.py) も運用と同じ位置名へ動かすので、確認専用の
  # 駆動量は無い。
  # full はベンチの上端 (manual.max と同値) であって、ファームのクランプ端ではない ——
  # クランプは 0〜270deg なので掛からず、書いたぶんだけ実際に動く。
  servo_sv0:
    initial: 0.0         # 起動時の角度 [deg]。基板が setup() で駆動する位置
    small: 5.0           # まず動いたことの確認
    mid: 15.0            # 中間
    full: 30.0           # ベンチの上端 (manual.max と同値)。実可動域の実測後に見直す

  servo_sv1:
    initial: 0.0
    small: 5.0
    mid: 15.0
    full: 30.0

  servo_sv2:
    initial: 0.0
    small: 5.0
    mid: 15.0
    full: 30.0
