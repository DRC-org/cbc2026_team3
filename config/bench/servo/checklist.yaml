checklists:
  pre_match:
    - id: bench_bus_up
      label: can_generic が up していること確認 (ip -br link show)
    - id: bench_firmware
      label: 基板の RGB LED が緑の点滅 (平常) であること確認。赤の速い点滅は CAN 不通か DIP 未設定
    - id: bench_device_id
      label: candump can_generic に 0x340-0x343 が届いていること確認 (DIP 全 OFF = 基板番号 0)
    - id: bench_free
      label: サーボホーンに何も付いておらず、全可動範囲で回っても干渉しないこと確認
    - id: bench_power
      label: サーボ電源が投入され、電圧がサーボの定格内であること確認
    - id: servo_sv0_move
      label: 手動操縦で servo_sv0 に small を送り、サーボが動くこと目視確認
    - id: servo_sv0_full
      label: 手動操縦で servo_sv0 に full を送り、ベンチの上端 30deg まで動くこと目視確認 (サーボの可動域の端ではない)
    - id: servo_sv0_return
      label: 手動操縦で servo_sv0 に initial を送り、起動時と同じ角度へ戻ること目視確認
    - id: servo_clamp
      label: ジョグで max (30deg) を超えて送れないこと確認。**止めているのは positions の manual だけ** (ファームの kProvisionalLimits は 0〜270deg なので 30deg では効かない)
    - id: sensor_react
      label: SV3 のセンサに触れ、UI のセンサ表示が反応すること確認 (接触は異常ではない)
    - id: bench_estop
      label: 動作中に非常停止を押し、サーボがその場で停止すること確認
    - id: bench_estop_hold
      label: 非常停止中もサーボが脱力せず角度を保持していること確認 (kEStopDetach = false)
    - id: bench_estop_latch
      label: 非常停止解除まで新しい角度指令が通らないこと確認 (ラッチ。解除は UI の Reset のみ)
