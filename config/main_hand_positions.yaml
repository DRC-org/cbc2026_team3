# メインハンドの機構位置定数。
#
# !!! positions の位置と可動範囲は機構寸法が未確定のため、依然すべて仮値 !!!
# 「機構が付いていない状態で誰かが起動しても壊れない」ことだけを狙った、安全側の
# 小さい可動量に留めてある。機構が確定したら、このファイルの数値だけを実測値へ
# 差し替えれば済むようにしてある。sequences/main_hand.py には数値を書かないこと。
#
# 確定済みなのは y_axis の scale だけ (ピニオン モジュール 1 / 歯数 40 で確定)。
# axes の換算と positions の位置は別物なので、換算が決まっても位置は仮値のまま。
#
# axes: 人間が扱いやすい単位からモータ指令値への換算。command = value * scale + offset
#   モータごとに指令の単位が違う (M3508=モータ軸 deg / EDULITE 05=rad / 自作=deg) ため、
#   換算をここに閉じ込めてシーケンス本体から単位を消している。
#   左右 2 台で 1 つの動作をする軸は motors: に両方を並べる。逆回転は scale の符号で表す
#   (専用の invert フラグを設けないのは、単位換算と回転方向が 2 箇所に分かれると
#   片方だけ直したときに気付けないため)。
# positions: 各軸の目標位置。値は axes.<軸>.unit の単位で書く。
#   コートで値が変わる位置だけ `{ red: <値>, blue: <値> }` と書く (両方必須)。
# manual: 手動操縦で連続値を送ってよい範囲。**この節を書いた軸だけが連続操作の対象**で、
#   書かない軸には位置名によるプリセット指令だけが残る (= 定義した状態以外を送れない
#   という通常運用の保証がそのまま残る)。min/max は機構の物理端ではなく**その内側**に取る
#   — 手動は操縦者が端へ寄せていく操作なので、境界を物理端に合わせると「指令は範囲内
#   なのに機構は突き当たっている」状態が作れてしまう。
#   positions に書いた値が範囲外だと起動を拒否する (シーケンスで行ける位置へ手動で
#   行けない軸になり、症状は「手動で戻そうとしても途中で止まる」だけで原因が見えない)。
#
# 離散状態アクチュエータ (gripper / wall_f / wall_r) の値は「自作基板ファームが
# 目標角度 [deg] を受け取る」前提で書いてある。ファームが「状態番号を受け取る」仕様に
# なった場合は、ここの値を 0/1/2 のような状態番号へ差し替えるだけでよく、
# sequences/main_hand.py もドライバも変更しなくてよい。これがこの設計の要点である。
#
# --- サーボ軸の角度の書き方 -------------------------------------------------
# 値は**出力軸の絶対角 [deg]**。**180 度サーボか 270 度サーボかはここに現れない** ——
# 角度 → パルス幅の変換は firmware/servo/include/config.h の ServoPulseSpec だけが
# 持つので、**型を載せ替えてもこのファイルは 1 行も変わらない** (仕様書 §7.7)。
# 代わりに 2 つ制約がある:
#   - **負の角度は書けない。** ファームは 0deg でパルス幅の下端に張り付くようクランプ
#     するので、270 度サーボの中央を 0 とした ±135 のような書き方は取れない。0 起点の
#     片側絶対角で書き、機械原点をずらしたいときは axes.<軸>.offset で寄せる
#   - **ファームの angle_min / angle_max を超えた値は黙ってクランプされる。** 症状は
#     「送ったのに途中で止まる」だけで、SET_TARGET には書いた値が載っているので
#     candump からも読めない。範囲を広げるときはファームの kProvisionalLimits を直す

axes:
  # ラックアンドピニオンによる y 軸前後移動。左右 2 台の M3508 が機構的に直結しており、
  # 逆回転で同一の動作になる。指令は「モータ軸の累積角 [deg]」。
  #
  # scale = 360 * (3591/187) / (pi * m * z)   [モータ軸 deg / mm]
  #   減速比 3591/187 ≒ 19.203209、出力軸 1 回転 = モータ軸 6913.155deg
  #   ピニオンは モジュール 1 / 歯数 40 (基準円 40.0mm) — ラックピニオンは基準円で
  #   転がるので、1 回転で進む距離は基準円周 pi * 40 = 125.664mm
  #   -> 6913.155 / 125.664 = 55.01314。6 桁で丸めても 1m あたり 0.7um しかずれない
  # (旧 config にあったボールねじのリード基準の式は機構が変わったので使わない)
  #
  # 組み立て後に一度だけ実測で確かめること。ずれていたら
  #   scale_new = scale_old * 指令値 / 実測値
  # 測るときは必ず同じ方向から寄せる — バックラッシュは scale では吸収できず、
  # 往復で測ると遊びのぶんが scale の誤差として紛れ込む。
  y_axis:
    unit: mm
    command_unit: deg
    timeout_s: 4.0        # この時間で到達しなければシーケンスを停止する
    tolerance: 1.0        # 到達許容差 [mm]
    # 左右のずれ許容 [mm]。超過したら押し合いで機構が壊れるため停止する
    sync_tolerance: 10.0
    # --- 同期補正 (クロスカップリング) ---------------------------------------
    # 上の sync_tolerance を見る 3 層は「ずれたら止める」しかできない。位置制御は
    # モータごとに独立した PID なので、左右で負荷や摩擦が違えば駆動中の追従差は
    # 原理的に残り、それを縮める力はどこにも働かない。この 2 値がその力を作る:
    # 各モータの電流指令に「左右の平均位置へ引き戻す向き」の項を加える。
    # 逆回転ペアでは 2 台の補正が同符号・同じ大きさになるので、軸としての運動は
    # 動かさずに内部のずれだけが縮む (lib/axis_sync.py の SyncGroup.corrections)。
    #
    # --- 2026-09-04 に実運用ストローク (150mm) で取り直した --------------------
    # **振幅で最適値が変わる。** 振幅 1.5mm では 8 が最良だったが、150mm では 8 が
    # 最悪になる (2 回とも 1.0mm 超、1 回は 1.899mm。測定時点の sync_tolerance 2.0mm
    # では 95% だったが、現在の 10.0mm では 19%)。
    # v=200 / a=1200 で 3 往復ずつ比べた実測:
    #   sync_kp=8  → 移動中のずれ 最大 1.042mm / 平均 0.680mm
    #   sync_kp=16 → 最大 0.637mm / 平均 0.578mm   ← 2 回の測定とも最良
    #   sync_kp=24 → 最大 1.125mm / 平均 0.682mm   ← ここから上は悪化する
    # 単位は motors.y_axis_*.pid.kp と同じなので「kp の何割」で考えられる (16 は 1/2)。
    # 効果は移動中のピークにしか現れない。WS 配信 (20Hz) の瞬時値では読めないので、
    # 測り直すときは必ず scripts/sync_probe.py か scripts/tune_y_axis.py を使うこと。
    #
    # **短距離 (15mm) では未検証のまま。** 実運用は 150mm 以上が主だが 15mm も走る。
    # 取り直す手順は docs/mechanism_handoff.md の §3-1。
    sync_kp: 16.0
    # !!! sync_kp を入れるなら sync_limit は省略できない (起動時に拒否する) !!!
    # 補正項 1 つあたりの上限 [counts]。押し合いは左右直結の機構をその場で壊すので、
    # homing.search_distance と同格の唯一の歯止めになる。上の pid.output_limit
    # (5000) の 25% に置いてあり、補正だけで出力の 1/4 を超えて出ることはない。
    sync_limit: 1250.0
    # 手動の可動範囲 [mm]。TODO: 機構完成後、実測のストローク端より内側へ詰めること。
    # 現状は positions の 0〜15mm を包む安全側の仮値
    manual:
      min: 0.0
      max: 650.0
      steps: [1.0, 5.0, 10.0, 50.0, 100.0]
    # リミットスイッチで零点を確定する (動作確認シーケンスの先頭で実行)。
    # 電源投入位置をそのまま原点にすると、前の試合の終了姿勢や搬送中に手で動かした
    # ぶんがそのまま座標のずれになる。位置定数は全て原点からの相対値なので、
    # ずれた原点のまま走らせると全ステップが同じだけずれた場所へ動く。
    #
    # !!! search_distance は省略できない !!!
    # 「当たるまで動かす」動作なので、これが唯一の無人の歯止めになる。配線が抜けた
    # センサは「いつまでも当たらない」形でしか現れず、上限が無いと機構端まで押し込む。
    #
    # !!! 値は上の manual の範囲と整合させること !!!
    # かつて 30.0 だったが、それは上の manual (min -2.0 / max 20.0) が宣言している
    # 可動範囲の外まで探索を許す値だった。manual は「この軸を動かしてよい範囲」の
    # 唯一の宣言なので、そこを超えて動かす歯止めを置くと、宣言と歯止めのどちらが
    # 正なのか config から読めなくなる。現在値は manual の全幅
    #   max - min = 20.0 - (-2.0) = 22.0mm
    # で、**可動範囲の上端から始めても下端までは必ず届き、下端より先へは行かない**。
    # TODO: 機構完成後、実測のストローク全長 (+ わずかな余裕) へ詰めること。
    # 詰めるときは manual の min/max も同時に実測へ寄せる —— 片方だけ動かすと
    # 「原点に届かない」か「宣言範囲の外まで押し込む」のどちらかになる。
    homing:
      sensor: origin_sensor   # config/main_hand.yaml の sensors: に登録した名前
      direction: -1           # 原点は負方向 (home=0.0 より手前にスイッチを置く)
      search_distance: 22.0   # [mm] ここまで動かして当たらなければ失敗として止める
      step: 0.5               # 1 回の移動量 [mm]。小さいほど精度が上がり時間が延びる
      settle_s: 0.05          # 指令が機構へ届き、センサの状態が返る余裕
    # --- 台形速度プロファイル (中間目標の生成) --------------------------------
    # !!! この節を外すと実運用ストロークで原理的にオーバーシュートする !!!
    # 書かない軸は move_to の最終目標がそのまま PID へ入る。この軸ではそれが
    # 成立しない —— motors.y_axis_*.pid の kp=32 / output_limit=2000 と下の
    # scale=55.0131 では **偏差 1.14mm (= 2000 / 32 / 55.0131) で P 項が飽和する**。
    # 飽和中の PID は制御ではなくフル電流の定加速なので、減速に使える距離は
    # 「偏差が 1.14mm を切ってから」の一定値なのに、そこまでに乗る速度は移動距離と
    # ともに増える。止まりきれる条件は **移動距離 <= 2 * 1.14 = 約 2.3mm** で、
    # PID を詰めた振幅 1.5mm はその内側、実運用のストローク (5〜15mm) は外側である。
    # **kd を上げても直らない** —— 飽和中は合計がクランプされ D 項も出力に現れない。
    # 速度と加速度で制限した中間目標を毎周期入れれば、PID に見せるのは追従誤差だけに
    # なり、飽和しないまま移動距離に依らず同じ挙動になる。
    motion:
      # --- 2026-09-04 に実運用ストローク (150mm) で実測して決めた ---------------
      # [mm/s] 150mm を 0.837 秒で走る (取り直す前は 3.023 秒。**3.6 倍速い**)。
      # **長い移動の所要時間を決めているのはこの値である** —— 150mm では巡航が
      # 行程の 94% を占め、加速度を 4 倍にしても 0.755 秒にしかならない。
      # 逆に 15mm 前後の短い移動では巡航に入らないので、効くのは max_acceleration
      # の方になる。**実運用はその両方を走る。**
      max_velocity: 200.0
      # [mm/s^2] **速さではなく滑らかさで決めた値。** 上限は 4800 まで確認済みで、
      # 150mm の所要時間は 4800 で 0.755 秒 / 1200 で 0.837 秒と 1 割しか変わらない
      # のに、加速に掛ける時間は 0.042 秒と 0.167 秒で 4 倍違う。急な加減速は
      # 振動源になり、左右ずれも増える (150mm で最大 0.690mm → 0.554mm)。
      # **短い移動はこの値がそのまま所要時間になる** (15mm で 4800 なら 0.160 秒、
      # 1200 なら 0.243 秒) ので、上げ下げするときは長短の両方で測ること。
      # 効く制約は制御側ではなく機構強度とワーク保持力である
      max_acceleration: 1200.0
      # !!! motors.y_axis_*.pid.kd と同値に保つこと !!!
      # kd の単位は counts/(deg/s) なので **巡航速度がそのまま制動として出力に乗る**:
      # 200mm/s = 11003deg/s では D 項だけで -11003counts になり、output_limit 5000 を
      # 超えて逆向きに飽和する。定常追従では実測速度 ≒ 参照速度なので、参照速度へ
      # kd と同じ係数を掛けて足せばその制動をちょうど打ち消せる。
      # **max_velocity を上げるときは velocity_ff と kd をセットで見直すこと** ——
      # 片方だけ動かすと巡航中に D 項が出力を食い潰す。
      # **上げれば良いというものでもない**: kd=vff=2 の対も実測したが、行き過ぎは
      # 減る一方で立ち上がりが遅くなり、整定は kd=vff=1 より悪化した
      velocity_ff: 1.0
    motors:
      y_axis_r: { scale: 55.0131, offset: 0.0 }
      y_axis_l: { scale: -55.0131, offset: 0.0 }   # 機構的に逆回転で同一動作

  # エンドエフェクタ回転。左右 2 台の EDULITE 05 が直結し、逆回転で同一動作。
  # 指令・フィードバックともに rad。
  rotate:
    unit: deg
    command_unit: rad
    timeout_s: 3.0
    tolerance: 2.0        # 到達許容差 [deg]
    sync_tolerance: 5.0   # 左右のずれ許容 [deg]。超過で停止 (機構保護)
    # 手動の可動範囲 [deg]。TODO: 機構完成後、干渉しない角度範囲へ詰めること
    manual:
      min: 0.0
      max: 180.0
      steps: [1.0, 5.0, 15.0, 45.0]
    # !!! リミットスイッチ未装着。**下のコメントを外すだけでは動かない。** !!!
    #
    # 有効化には 2 つの前提が要る。どちらも現時点では満たされていない。
    #
    # --- 前提 1: センサを載せるスロットが無い ---------------------------------
    # かつてここには「サーボ基板 #0 の空きスロット SV5 (can_id 0x45) に配線する」と
    # 書いてあったが、**SV5 という信号線は存在しない**。この基板は SV0〜SV4 の 5 本
    # しか持たず (firmware/servo/include/config.h の kServoSlotCount = 5)、5 本とも
    # 既に埋まっている:
    #   0x40 gripper / 0x41 wall_f / 0x42 wall_r / 0x43 sub_gripper / 0x44 origin_sensor
    # 0x45〜0x47 は ID 空間としては基板 #0 のブロックに含まれるが、対応するピンが
    # 無いので**その ID のデバイスは FEEDBACK を 1 通も送らない**。手順どおり配線した
    # つもりで登録すると sensor_is_stale が真になり、動作確認の最初のステップが毎回
    # 「センサが応答していません」で止まる —— 症状は配線不良と区別が付かない。
    # 取れる道は 2 つ:
    #   (a) サーボ基板 #1 を足す (DIP=1 → 0x48〜0x4C が SV0〜SV4)。1 枚増える
    #   (b) 既存スロットを転用する。ただし 5 本とも運用中なので、転用するなら
    #       どのアクチュエータを別基板へ移すかを先に決めること
    #
    # --- 前提 2: EDULITE 軸は原点確定の経路そのものが無い ----------------------
    # 零点確定 (lib/sequence/homing.py) の原点確定は main.py の _make_origin_resolver
    # 経由で、**M3508PositionLoop に載っているモータしか確定できない**。rotate は
    # EDULITE 05 なのでループに載らず、センサを正しく配線してスイッチが反応しても
    # 最後に必ず HomingError になる。有効化するには EDULITE の SET_ZERO を送る経路を
    # 先に足す必要がある (config/sub_hand_positions.yaml の DM3520 2 軸も同じ状態)。
    #
    # **したがって、今この homing: のコメントを外すと動作確認が必ず失敗する。**
    # 失敗は早い —— 確定手段の有無は探索を始める前に問うので 1 歩も動かず、
    # さらに起動ログにも ERROR で「この軸は原点を確定できない」と出る。
    # 外したままでも動作確認は通る (ホーミングを持たない軸は零点確定を飛ばす)。
    #
    # --- それまでの暫定措置: set_zero_on_start ---------------------------------
    # 零点確定が入るまでの原点は config/main_hand.yaml の
    # `rotate_r` / `rotate_l` の **set_zero_on_start: true** が決めている ——
    # 起動のたびに set_zero (通信タイプ 0x06) を送り、電源投入時の姿勢を原点にする。
    # **本機の原点は放っておくとフラッシュの機械ゼロであり、電源投入位置ではない。**
    # 2 台の機械ゼロが揃っていないと、物理的に同じ姿勢でも逆換算後は差として現れ
    # (実機で 175.879deg)、起動直後に SyncMonitor が全体緊急停止を掛ける。
    #
    # **これは前提 2 を満たしたことにはならない。** 起動時に全軸を一律 0 にするだけで、
    # スイッチの位置を原点として確定する経路 (_make_origin_resolver) は依然として無い。
    # したがって搬送中に手で回されたぶんは、その姿勢が原点になる形でそのまま残る。
    # **上の 2 つが揃ったら必ず有効化すること。**
    #
    # 有効にする手順 (2 つの前提を満たした後):
    #   1. 上の (a) か (b) でスロットを確保し、そこへスイッチを配線する
    #   2. config/main_hand.yaml の sensors: に rotate_origin_sensor を足す
    #      (origin_sensor と同じ形。can_id は 1. で確保したスロットのもの)
    #   3. EDULITE 向けの原点確定経路 (SET_ZERO) を実装する
    #   4. config/main_hand.yaml の set_zero_on_start を 2 台とも false へ戻す。
    #      残したままだと起動時の一律 0 が零点確定の直前に割り込み、スイッチで決めた
    #      原点と電源投入位置のどちらが正なのか config から読めなくなる
    #   5. 下のコメントを外し、search_distance と direction を実測へ合わせる。
    #      search_distance は上の manual の全幅 (15.0 - (-5.0) = 20.0deg) を超えないこと
    # homing:
    #   sensor: rotate_origin_sensor
    #   direction: -1           # TODO: 実機で確認 (収納側へ寄せる向き)
    #   search_distance: 20.0   # [deg] TODO: 実測の可動範囲へ。manual の全幅が上限
    #   step: 0.5               # [deg]
    #   settle_s: 0.05
    motors:
      # deg -> rad (pi/180)。機構側に減速が入るなら実測値へ差し替えること
      rotate_r: { scale: 0.017453292519943295, offset: 0.0 }
      rotate_l: { scale: -0.017453292519943295, offset: 0.0 }   # 逆回転で同一動作

  # ワーク把持のグリッパ。開 / 閉 の 2 状態しか取らない。
  # manual: を書かないので手動でも open / closed しか送れない (中途半端な開度で
  # ワークを潰す操作が構造的に作れない)。
  gripper:
    unit: deg
    command_unit: deg
    scale: 1.0
    offset: 0.0
    timeout_s: 2.0

  # ワーク搬送コンベア。DC モータなので位置の概念がなく duty 指令で回す。
  # duty 軸に可動範囲は存在しないので manual: は書けない (書くと起動を拒否する)。
  # 手動でも run / stop のプリセットだけを送る。
  # duty 指令は到達フラグを持たないため、settle_s で待たないと指令直後に次の
  # ステップへ進んでしまう (起動・停止し切る前に先へ行く)。
  conveyor:
    unit: duty
    command_unit: duty
    command_mode: duty
    scale: 1.0
    offset: 0.0
    settle_s: 0.5         # DC モータの起動・停止待ち [s]
    timeout_s: 1.0

  # 前側の壁。初期 / 閉 / 開 の 3 状態しか取らない。gripper と同じく manual: は書かない。
  wall_f:
    unit: deg
    command_unit: deg
    scale: 1.0
    offset: 0.0
    timeout_s: 2.0

  # 後側の壁。wall_f と同一仕様。
  wall_r:
    unit: deg
    command_unit: deg
    scale: 1.0
    offset: 0.0
    timeout_s: 2.0

positions:
  y_axis:
    home: 0.0            # 電源投入位置 = 原点 [mm]
    work_1: 120.0        # 自陣ワーク 1 列目 [mm]
    work_2: 320.0        # 自陣ワーク 2 列目 [mm]
    work_3: 520.0        # 自陣ワーク 3 列目 [mm]
    work_shared: 650.0   # 共通ワーク [mm]
    # approach / place は試合シーケンスから未参照のまま実測の対象が無かったため削除。
    # 戦略が決まった時点で実測して足す。

  rotate:
    home: 0.0            # 収納姿勢 [deg]
    pick: 180.0          # 把持姿勢 [deg]
    place: 10.0          # 配置姿勢 [deg]。home と分けてあるのは、ワークを持った状態の
                         # 姿勢だけを後から詰められるようにするため

  # 以下 3 軸は離散状態アクチュエータ。動作確認 (sequences/motor_check.py) も運用と
  # 同じ位置名へ動かすので、確認専用の駆動量は存在しない。かつては main_hand.yaml が
  # motor_check.magnitude を別に持っており、この値とずれた瞬間に「動作確認で動く位置」と
  # 「運用で使う位置」が別物になって確認が意味を失っていた。**そのキーは config ごと
  # 消えている**ので、ここに合わせる先も無い (書けば起動時に未知キーとして拒否される)。
  gripper:
    open: 5.0            # 開 [deg]
    closed: 0.0          # 閉 (把持) [deg]

  conveyor:
    stop: 0.0            # 停止 [duty]
    run: 0.3             # 搬送 [duty]。符号が回転方向なので、逆転が必要になったら負値にする

  wall_f:
    initial: 0.0         # 初期 (退避) [deg]
    closed: 3.0          # 閉 (ワーク保持) [deg]
    open: 6.0            # 開 [deg]

  # wall_r の closed / open は**現在の試合シーケンスからは参照されていない**
  # (initial だけが使われる)。後壁を使う手順が未確定なだけなので消さない ——
  # 動作確認 (sequences/motor_check.py) は wall_f と同じく 3 状態すべてを駆動するので、
  # 消すと確認の網から後壁の可動が丸ごと外れる。
  wall_r:
    initial: 0.0         # 初期 (退避) [deg]
    closed: 3.0          # 閉 (ワーク保持) [deg] — 試合シーケンス未使用
    open: 6.0            # 開 [deg]              — 試合シーケンス未使用
