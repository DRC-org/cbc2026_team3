axes:
  y_axis:
    unit: mm
    command_unit: deg
    timeout_s: 4.0
    tolerance: 1.0
    sync_tolerance: 10.0
    sync_kp: 16.0
    sync_limit: 1250.0
    manual:
      min: 0.0
      max: 650.0
      steps: [1.0, 5.0, 10.0, 50.0, 100.0]
    motion:
      max_velocity: 200.0
      max_acceleration: 1200.0
      velocity_ff: 1.0
    # TODO(実機で確認): リミットスイッチ未装着のため無効。戻す日はファームの
    # kServoBoards 基板 #0 SV4 を TouchSensor へ / config/main_hand.yaml の sensors: へ
    # origin_sensor (can_id 0x44) を登録 / 下のコメントを外す、の 3 つを同時に行い、
    # search_distance を実測のストローク全長へ取り直すこと (現在値は仮値時代の manual 全幅)。
    # homing:
    #   sensor: origin_sensor
    #   direction: -1
    #   search_distance: 22.0   # [mm]
    #   step: 0.5               # [mm]
    #   settle_s: 0.05
    motors:
      y_axis_r: { scale: 55.0131, offset: 0.0 }
      y_axis_l: { scale: -55.0131, offset: 0.0 }

  rotate:
    unit: deg
    command_unit: rad
    timeout_s: 3.0
    tolerance: 2.0
    sync_tolerance: 5.0
    # TODO(実機で確認): 端まで振って他の機構と干渉しないことは未確認。
    manual:
      min: 0.0
      max: 180.0
      steps: [1.0, 5.0, 15.0, 45.0]
    # TODO(実機で確認): search_distance だけが暫定値 (触れていない位置から何 deg で
    # 当たるかは未計測)。詰めるときは上の manual の min/max も同時に寄せること。
    homing:
      sensor: rotate_origin_sensor
      direction: -1
      search_distance: 180.0
      step: 1.0
      settle_s: 0.05
    motors:
      rotate_r: { scale: 0.017453292519943295, offset: 0.0 }
      rotate_l: { scale: -0.017453292519943295, offset: 0.0 }

  gripper:
    unit: deg
    command_unit: deg
    scale: 1.0
    offset: 0.0
    timeout_s: 2.0

  conveyor:
    unit: duty
    command_unit: duty
    command_mode: duty
    scale: 1.0
    offset: 0.0
    settle_s: 0.5
    timeout_s: 1.0

  wall_f:
    unit: deg
    command_unit: deg
    scale: 1.0
    offset: 0.0
    timeout_s: 3.0

  wall_r:
    unit: deg
    command_unit: deg
    scale: 1.0
    offset: 0.0
    timeout_s: 2.0

positions:
  y_axis:
    home: 0.0
    work_1: 120.0
    work_2: 320.0
    work_3: 520.0
    work_shared: 650.0

  rotate:
    home: 0.0
    pick: 180.0
    place: 10.0

  gripper:
    open: 0.0
    closed: 65.0

  # TODO(実機で確認): 赤を正 (= 正転) とする符号は仮置き。対になる
  # firmware/dc_motor/include/config.h の kDirForwardIsLow も TODO のまま。
  conveyor:
    stop: 0.0
    run: { red: 0.3, blue: -0.3 }

  wall_f:
    initial: 270.0
    closed: 180.0
    open: 90.0

  wall_r:
    initial: 90.0
    closed: 90.0
    open: 180.0
