axes:
  y_axis:
    unit: mm
    command_unit: deg
    timeout_s: 4.0
    tolerance: 1.0
    sync_tolerance: 10.0
    sync_kp: 16.0
    sync_limit: 1250.0
    manual:
      min: 0.0
      max: 650.0
      steps: [1.0, 5.0, 10.0, 50.0, 100.0]
    # TODO(実機で確認): この軸のホーミングは実機で 1 度も走らせていない。
    # direction / align_distance / step と左右 2 本の極性 (ファーム側 sensorActiveLow)
    # はどれも未実測。初回は人が付いて EMG STOP を押せる状態で回すこと。
    homing:
      sensors:
        y_axis_r: y_axis_r_origin_sensor
        y_axis_l: y_axis_l_origin_sensor
      direction: -1
      # search_distance は上の manual の全幅 (max - min) と一致させる。対を機械的に
      # 守るのは tests/test_main_positions_config.py の一致検査だけである
      search_distance: 650.0
      align_distance: 5.0
      step: 0.5
      # 整列段は片側 1 台で押すので、探索段 (左右 2 台) と同じ 0.5mm では
      # 1 台ぶんの P 項 880counts が静止摩擦の実測 900counts に届かない。
      # 同じ力を 1 台で出すには 2 倍の刻みが要る (1.0mm = 1760counts)。
      # 引き換えに左右の整列の粒度は 1.0mm になる
      align_step: 1.0
      # y_axis = 0 と rotate = 0 は機構が干渉する。rotate の零点確定より前に
      # 干渉域を抜けておかないと rotate が 1 歩も動けない
      retreat_position: clear
      settle_s: 0.05
    guard:
      # 左右 2 本とも原点側 (homing.direction: -1) に付く。**2 本とも書く** ——
      # 1 本しか書かないと、書かなかった側のスイッチが押されても止まらない。
      # 逆 (plus) に書くと守りが反転し、押されている端へ進む指令だけが通る
      limits:
        minus:
          - y_axis_r_origin_sensor
          - y_axis_l_origin_sensor
      # max_step / stall_torque は書かない = **その守りが無い**。
      # max_step: 1 回の move_to が出す移動は 130〜530mm で、跳躍とストロークの
      #   境目が実測できていない (狭く取ると正常な移動が拒否される)。
      # stall_torque: M3508 の FEEDBACK は電流の生値で Nm ではないので、
      #   Nm のしきい値をそのまま当てると桁が合わない。換算を決めてから書くこと
    motion:
      max_velocity: 200.0
      max_acceleration: 1200.0
      # config/main_hand.yaml の motors.y_axis_*.pid.kd と同値に保つこと
      velocity_ff: 1.0
    motors:
      y_axis_r: { scale: 55.0131, offset: 0.0 }
      y_axis_l: { scale: -55.0131, offset: 0.0 }

  rotate:
    unit: deg
    command_unit: rad
    timeout_s: 3.0
    tolerance: 2.0
    sync_tolerance: 5.0
    manual:
      min: 0.0
      max: 185.0
      steps: [1.0, 5.0, 15.0, 45.0]
    # 機械的に到達しうる範囲。**上の manual とは別物**（あちらは手動で動かしてよい
    # 範囲で、意図的に狭められる）。1 回転未満なので EDULITE 05 はここから回転数を
    # 一意に決められ、電源が落ちているあいだに人が軸を回しても論理角を取り違えない。
    # TODO(実機で確認): 可動端を突き当てて実測していない暫定値。manual (0〜185deg) より
    # 広めに取ってある —— 狭すぎると正常な姿勢で WARNING が出るのに対し、広すぎても
    # 一意化は効く（曖昧になるのは 1 回転を超えたときだけ）ため
    travel:
      min: 0.0
      max: 200.0
    # TODO(実機で確認): search_distance だけが暫定値 (触れていない位置から何 deg で
    # 当たるかは未計測)。
    homing:
      sensor: rotate_origin_sensor
      direction: -1
      # search_distance は上の manual の全幅 (max - min) と対で、どちらを動かしたら
      # もう一方も同時に寄せる。狭いと宣言範囲の端から始めた探索が原点へ届く前に
      # 打ち切られ、広いと宣言範囲の外まで押し込む。対を機械的に守るのは
      # tests/test_main_positions_config.py の一致検査だけである
      search_distance: 185.0
      # 0.5deg では 1 歩も動かなかった (2026-09-05 実機。静止摩擦が下限を決める)
      step: 1.0
      # y_axis = 0 と rotate = 0 は機構が干渉する。rotate が原点に居座ったままだと、
      # 後から y_axis だけ零点確定を走らせたときに探索段が干渉域へ降りて 1 歩も動けず、
      # しかも症状は y_axis 側の失敗としてしか出ない
      retreat_position: home
      settle_s: 0.05
    guard:
      # 原点は - 側 (homing.direction: -1)。逆 (plus) に書くと守りが反転し、
      # 押されている端へ進む指令だけが通る。+ 側 (180deg) にスイッチは無い
      limits:
        minus: rotate_origin_sensor
      # max_step / stall_torque は書かない = **その守りが無い**。
      # max_step: 手動の刻みが最大 45deg なのに対し、正常な 1 回の移動が
      #   何 deg まで出るかを実測していない。
      # stall_torque: EDULITE 05 はトルクを Nm で返すが、機構が当たったときの
      #   値を測っていない (低すぎると回転の途中で止まる)
    motors:
      rotate_r: { scale: 0.017453292519943295, offset: 0.0 }
      rotate_l: { scale: -0.017453292519943295, offset: 0.0 }

  gripper:
    unit: deg
    command_unit: deg
    scale: 1.0
    offset: 0.0
    timeout_s: 2.0

  # manual_always: コンベアを止めるだけのためにシーケンス全体の制御権を奪わずに済む
  conveyor:
    unit: duty
    command_unit: duty
    command_mode: duty
    scale: 1.0
    offset: 0.0
    settle_s: 0.5
    timeout_s: 1.0
    manual_always: true

  # timeout_s はファームのスルーレート (90deg/s) から決まる。突き合わせは
  # tests/test_servo_travel_budget.py が行う
  wall_f:
    unit: deg
    command_unit: deg
    scale: 1.0
    offset: 0.0
    timeout_s: 3.0

  wall_r:
    unit: deg
    command_unit: deg
    scale: 1.0
    offset: 0.0
    timeout_s: 2.0

positions:
  # *_after_* は y_axis と rotate を一息に動かすと回した機構がコンベア側・ワーク側の
  # 双方と干渉するため、干渉域を避けて段階的に戻すための退避点 (3 列目だけが踏む)。
  # 両軸で同じ位置名を使い、対が崩れていないことを読めるようにしてある。
  # TODO(実機で確認): *_after_* の値はどれも仮値。実機で干渉を見ながら詰めること。
  y_axis:
    home: 0.0
    # 零点確定の直後に退避する先 (homing.retreat_position)。rotate を回してよい位置。
    # TODO(実機で確認): 仮値。rotate の干渉域を抜ける実測値へ詰めること
    clear: 40.0
    work_1: 65.0
    work_1_after_1: 225.0
    work_2: 255.0
    work_3: 450.0
    work_3_after_1: 380.0
    work_3_after_2: 350.0
    work_shared: 550.0
    work_shared_after_1: 400.0

  rotate:
    home: 5.0
    work_1_after_1: 90.0
    work_3_after_1: 165.0
    work_3_after_2: 155.0
    # TODO(実機で確認): 仮値。引き出し中は rotate を回さないよう pick と同値
    work_shared_after_1: 185.0
    pick: 185.0
    pick_shared: 165.0
    place: 5.0
    after_place: 30.0

  gripper:
    open: 0.0
    closed: 65.0

  # TODO(実機で確認): 赤を正 (= 正転) とする符号は仮置き。対になる
  # firmware/dc_motor/include/config.h の kDirForwardIsLow も TODO のまま。
  # 0.3 はファーム側 kDefaultMaxDuty と同値で、超えるとクランプされる。
  conveyor:
    stop: 0.0
    run: { red: 0.3, blue: -0.3 }

  wall_f:
    initial: 270.0
    closed: 180.0
    open: 90.0

  # TODO(実機で確認): closed が initial と同値なので動作確認の 1 段目が指令量 0 になり、
  # closed へ届かない故障を拾えない。後壁の実可動域が決まったら別々の値にすること。
  wall_r:
    initial: 90.0
    closed: 90.0
    open: 180.0
