axes:
  y_axis:
    unit: mm
    command_unit: deg
    timeout_s: 4.0
    tolerance: 1.0
    sync_tolerance: 10.0
    sync_kp: 16.0
    sync_limit: 1250.0
    manual:
      min: 0.0
      max: 650.0
      steps: [1.0, 5.0, 10.0, 50.0, 100.0]
    # TODO(実機で確認): この軸のホーミングは実機で 1 度も走らせていない。
    # direction / align_distance / step と左右 2 本の極性 (ファーム側 sensorActiveLow)
    # はどれも未実測。初回は人が付いて EMG STOP を押せる状態で回すこと。
    homing:
      sensors:
        y_axis_r: y_axis_r_origin_sensor
        y_axis_l: y_axis_l_origin_sensor
      direction: -1
      # search_distance は上の manual の全幅 (max - min) と一致させる。対を機械的に
      # 守るのは tests/test_main_positions_config.py の一致検査だけである
      search_distance: 650.0
      align_distance: 5.0
      step: 0.5
      # 整列段は片側 1 台で押すので、探索段 (左右 2 台) と同じ 0.5mm では
      # 1 台ぶんの P 項 880counts が静止摩擦の実測 900counts に届かない。
      # 同じ力を 1 台で出すには 2 倍の刻みが要る (1.0mm = 1760counts)。
      # 引き換えに左右の整列の粒度は 1.0mm になる
      align_step: 1.0
      # y_axis = 0 と rotate = 0 は機構が干渉する。rotate の零点確定より前に
      # 干渉域を抜けておかないと rotate が 1 歩も動けない
      retreat_position: clear
      settle_s: 0.05
    guard:
      # 左右 2 本とも原点側 (homing.direction: -1) に付く。**2 本とも書く** ——
      # 1 本しか書かないと、書かなかった側のスイッチが押されても止まらない。
      # 逆 (plus) に書くと守りが反転し、押されている端へ進む指令だけが通る
      limits:
        minus:
          - y_axis_r_origin_sensor
          - y_axis_l_origin_sensor
      # max_step / stall_torque は書かない = **その守りが無い**。
      # max_step: 1 回の move_to が出す移動は 130〜530mm で、跳躍とストロークの
      #   境目が実測できていない (狭く取ると正常な移動が拒否される)。
      # stall_torque: M3508 の FEEDBACK は電流の生値で Nm ではないので、
      #   Nm のしきい値をそのまま当てると桁が合わない。換算を決めてから書くこと
    motion:
      max_velocity: 200.0
      max_acceleration: 1200.0
      # config/main_hand.yaml の motors.y_axis_*.pid.kd と同値に保つこと
      velocity_ff: 1.0
    motors:
      y_axis_r: { scale: 55.0131, offset: 0.0 }
      y_axis_l: { scale: -55.0131, offset: 0.0 }

  rotate:
    unit: deg
    command_unit: rad
    timeout_s: 3.0
    tolerance: 2.0
    sync_tolerance: 5.0
    # TODO(実機で確認): 範囲は実測だが、端まで振って他の機構と干渉しないことは未確認。
    manual:
      min: 0.0
      max: 180.0
      steps: [1.0, 5.0, 15.0, 45.0]
    # TODO(実機で確認): search_distance だけが暫定値 (触れていない位置から何 deg で
    # 当たるかは未計測)。詰めるときは上の manual の min/max も同時に寄せること。
    homing:
      sensor: rotate_origin_sensor
      direction: -1
      search_distance: 180.0
      # 0.5deg では 1 歩も動かなかった (2026-09-05 実機。静止摩擦が下限を決める)
      step: 1.0
      settle_s: 0.05
    guard:
      # 原点は - 側 (homing.direction: -1)。逆 (plus) に書くと守りが反転し、
      # 押されている端へ進む指令だけが通る。+ 側 (180deg) にスイッチは無い
      limits:
        minus: rotate_origin_sensor
      # max_step / stall_torque は書かない = **その守りが無い**。
      # max_step: 手動の刻みが最大 45deg なのに対し、正常な 1 回の移動が
      #   何 deg まで出るかを実測していない。
      # stall_torque: EDULITE 05 はトルクを Nm で返すが、機構が当たったときの
      #   値を測っていない (低すぎると回転の途中で止まる)
    motors:
      rotate_r: { scale: 0.017453292519943295, offset: 0.0 }
      rotate_l: { scale: -0.017453292519943295, offset: 0.0 }

  gripper:
    unit: deg
    command_unit: deg
    scale: 1.0
    offset: 0.0
    timeout_s: 2.0

  # manual_always: コンベアを止めるだけのためにシーケンス全体の制御権を奪わずに済む
  conveyor:
    unit: duty
    command_unit: duty
    command_mode: duty
    scale: 1.0
    offset: 0.0
    settle_s: 0.5
    timeout_s: 1.0
    manual_always: true

  # timeout_s はファームのスルーレート (90deg/s) から決まる。突き合わせは
  # tests/test_servo_travel_budget.py が行う
  wall_f:
    unit: deg
    command_unit: deg
    scale: 1.0
    offset: 0.0
    timeout_s: 3.0

  wall_r:
    unit: deg
    command_unit: deg
    scale: 1.0
    offset: 0.0
    timeout_s: 2.0

positions:
  # *_via_* は y_axis と rotate を一息に動かすと回した機構がコンベア側・ワーク側の
  # 双方と干渉するため、干渉域を避けて段階的に寄せるための経由点。両軸で同じ位置名を
  # 使い、対が崩れていないことを読めるようにしてある。
  # TODO(実機で確認): 経由点の値はどれも等分割の仮値。実機で干渉を見ながら列ごとに詰めること。
  y_axis:
    home: 0.0
    # 零点確定の直後に退避する先 (homing.retreat_position)。rotate を回してよい位置。
    # TODO(実機で確認): 仮値。rotate の干渉域を抜ける実測値へ詰めること
    clear: 40.0
    work_1_via_1: 30.0
    work_1_via_2: 60.0
    work_1_via_3: 90.0
    work_1: 120.0
    work_2_via_1: 80.0
    work_2_via_2: 160.0
    work_2_via_3: 240.0
    work_2: 320.0
    work_3_via_1: 130.0
    work_3_via_2: 260.0
    work_3_via_3: 390.0
    work_3: 520.0
    work_shared_via_1: 162.5
    work_shared_via_2: 325.0
    work_shared_via_3: 487.5
    work_shared: 650.0

  rotate:
    # y_axis = 0 と rotate = 0 は機構が干渉する。HOME は y_axis: home と
    # rotate: home の組なので、片方を原点から離さないと初期姿勢そのものが
    # 干渉姿勢になる。離すのは rotate の側 (y_axis.home は 0.0 のまま)。
    # 0.0 は零点確定のスイッチの動作点そのものでもある。ON 区間の実測 約 2deg に
    # 対して tolerance が 2.0deg なので、0.0 を目標にすると到達帯が ON 区間へ
    # 食い込み、その内側からの指令を可動端インターロック (guard.limits.minus)
    # が拒む。5.0 なら到達帯 3.0〜7.0deg が ON 区間の外に出る。
    home: 5.0
    work_1_via_1: 45.0
    work_1_via_2: 90.0
    work_1_via_3: 135.0
    work_2_via_1: 45.0
    work_2_via_2: 90.0
    work_2_via_3: 135.0
    work_3_via_1: 45.0
    work_3_via_2: 90.0
    work_3_via_3: 135.0
    work_shared_via_1: 45.0
    work_shared_via_2: 90.0
    work_shared_via_3: 135.0
    pick: 180.0
    # home と同値。**偶然の一致ではない** —— どちらも上の 2 つの理由から 0.0 を
    # 取れず、結果として同じ 5.0 に並んでいる。
    # TODO(実機で確認): 置く角が待機の角と同じでよいかは未確認。ワークを置ける角が
    # 決まったら home と揃っている必要は無いので、別の値になってよい
    place: 5.0

  gripper:
    open: 0.0
    closed: 65.0

  # TODO(実機で確認): 赤を正 (= 正転) とする符号は仮置き。対になる
  # firmware/dc_motor/include/config.h の kDirForwardIsLow も TODO のまま。
  # 0.3 はファーム側 kDefaultMaxDuty と同値で、超えるとクランプされる。
  conveyor:
    stop: 0.0
    run: { red: 0.3, blue: -0.3 }

  wall_f:
    initial: 270.0
    closed: 180.0
    open: 90.0

  # TODO(実機で確認): closed が initial と同値なので動作確認の 1 段目が指令量 0 になり、
  # closed へ届かない故障を拾えない。後壁の実可動域が決まったら別々の値にすること。
  wall_r:
    initial: 90.0
    closed: 90.0
    open: 180.0
