axes:
  sub_arm_joint:
    unit: deg
    command_unit: rad
    scale: 0.017453292519943295
    offset: 0.0          # TODO: 機械原点と電気原点のずれ [rad]。実機で実測
    timeout_s: 3.0
    # TODO: 機構完成後、メインハンドと干渉しない角度範囲へ詰めること
    manual:
      min: -5.0
      max: 15.0
      steps: [1.0, 5.0]

  # TODO: 実機で確認 (収納側へ寄せる向き / ストローク全長)。リミットスイッチを
  # 付けても DM3520 は supports_origin_capture() が False なので現状は有効化できない。
  # homing:
  #   sensor: sub_y_axis_origin_sensor
  #   direction: -1
  #   search_distance: 40.0   # [mm]
  #   step: 0.5               # [mm]
  #   settle_s: 0.05
  sub_y_axis:
    unit: mm
    command_unit: rad
    scale: 0.0555556
    offset: 0.0
    timeout_s: 4.0
    tolerance: 1.0
    # TODO: 機構完成後、実測のストローク端より内側へ詰めること
    manual:
      min: -5.0
      max: 30.0
      steps: [1.0, 5.0, 10.0]

  # TODO(実機で確認): 正が上、負が下。逆なら scale の符号を反転する。
  sub_lift:
    unit: mm
    command_unit: rad
    scale: 0.0555556     # TODO: 昇降側のピニオンが違うなら差し替える
    offset: 0.0
    timeout_s: 4.0
    tolerance: 1.0
    # TODO: 機構完成後、実測のストローク端より内側へ詰めること
    manual:
      min: -2.0
      max: 30.0
      steps: [1.0, 5.0, 10.0]

  sub_gripper:
    unit: deg
    command_unit: deg
    scale: 1.0
    offset: 0.0
    timeout_s: 2.0

  # TODO(実機で確認): settle_s は弁の応答時間 + 吸着が効くまでの時間。
  valve_1: &valve_axis
    unit: on_off
    command_unit: on_off
    command_mode: on_off
    scale: 1.0
    offset: 0.0
    settle_s: 0.2
    timeout_s: 1.0
  valve_2: *valve_axis
  valve_3: *valve_axis
  valve_4: *valve_axis
  valve_5: *valve_axis
  valve_6: *valve_axis

  # TODO(実機で確認): settle_s はポンプが規定の負圧 / 正圧に達するまでの時間。
  pump_vac:
    unit: duty
    command_unit: duty
    command_mode: duty
    scale: 1.0
    offset: 0.0
    settle_s: 0.5
    timeout_s: 1.0

  pump_blow:
    unit: duty
    command_unit: duty
    command_mode: duty
    scale: 1.0
    offset: 0.0
    settle_s: 0.5
    timeout_s: 1.0

positions:
  # TODO: 機構完成後に実測値へ。現状は微小可動量のみ。
  sub_arm_joint:
    home: 0.0
    extended: 8.0
    handoff: 5.0
    place: 10.0

  # TODO: 機構完成後に実測値へ。現状は「動いたことが目で分かる」だけの仮値。
  sub_y_axis:
    home: 0.0
    extended: 20.0

  sub_lift:
    home: 0.0
    lifted: 20.0

  sub_gripper:
    open: 5.0
    closed: 0.0

  valve_1: &valve_states
    open: 1.0
    closed: 0.0
  valve_2: *valve_states
  valve_3: *valve_states
  valve_4: *valve_states
  valve_5: *valve_states
  valve_6: *valve_states

  # TODO(実機で確認): 吸引力が足りなければファームの max_duty を上げてから
  # ここを上げること (ここだけ上げても効かない)。
  pump_vac:
    stop: 0.0
    run: 0.95

  pump_blow:
    stop: 0.0
    run: 0.95
