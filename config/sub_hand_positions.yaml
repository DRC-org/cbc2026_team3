axes:
  # 昇降。**+ 方向が下**。コートでモータの回転と上下の対応が鏡になり、スイッチは
  # 重力側に固定なので、scale の符号だけをコート別に持つ (2026-09-09 両コートで実機確認)。
  sub_lift:
    homing:
      sensor: sub_lift_b_limit_sensor
      direction: 1
      # manual の全幅を賄う。狭いと上端側から始めたとき下端スイッチへ届かない
      search_distance: 250.0
      # 確定した直後は下端のすぐ上に居る。前後を走らせる高さ (pick) まで自分で上がる。
      # top まで上げると当たる (2026-09-11 実機)
      retreat_position: pick
      step: 0.1
      # ON 区間の実測 2.37mm (2026-09-10 作動点測定) より狭く取る。
      # 2026-09-11 に 0.5 から 1.5 倍
      coarse_step: 0.75
      release_distance: 10.0
      settle_s: 0.05
    guard:
      # + が下なので plus が下端。逆に書くと守りが反転する
      limits:
        plus: sub_lift_b_limit_sensor
        minus: sub_lift_t_limit_sensor
      # 桁の違う目標だけを止める。manual の全幅より広く取る
      max_step: 300.0
      # 動き出しで 2.14Nm まで立つ (2026-09-11 距離測定)。前後と同じ 4.0 に
      stall_torque: 4.0
    unit: mm
    command_unit: rad
    scale: { blue: 1.0668451, red: -1.0668451 }
    offset: 0.0
    # 2026-09-10 の実測は同じ区間で 17.4mm/s と 7.3mm/s に割れた (遅いほうは機構が渋り、
    # 直前にトルクが上限 2Nm まで立った回)。遅いほうを下限に取る。
    # timeout_s は渋ったままでも全幅を賄う長さで、機構が直ったら詰める
    min_speed: 7.0
    timeout_s: 200.0
    tolerance: 1.0
    manual:
      # スイッチ間の実測 191.2mm (2026-09-11 距離測定) の手前
      min: -188.0
      max: 2.0
      # 先頭が既定の刻み。寄せるのに 1mm 刻みだと回らない
      steps: [50.0, 10.0, 5.0, 1.0]

  sub_y_axis:
    homing:
      sensor: sub_y_axis_f_limit_sensor
      direction: 1
      # スイッチ間の実測は 447mm (2026-09-09 赤コート)。機構が動くうちは余裕を広く取る
      search_distance: 650.0
      # ON 区間の実測 2.2mm より狭く取る (広いと粗い 1 歩で跨ぎ切る)。
      # 2026-09-11 に 1.0 から 1.5 倍
      coarse_step: 1.5
      # スイッチの移動許容 0.3mm より小さく。原点のばらつきは刻み幅そのもの
      step: 0.1
      release_distance: 10.0
      settle_s: 0.05
    guard:
      # 逆に書くと守りが反転し、押されている端へ進む指令だけが通る
      limits:
        plus: sub_y_axis_f_limit_sensor
        minus: sub_y_axis_r_limit_sensor
      # 桁の違う目標だけを止める。実ストロークより広く取る
      max_step: 600.0
      # 移動中は 0.6Nm 以下、押し込みで 0.7Nm 超 (2026-09-09 実測)
      stall_torque: 4.0
      # 昇降の高さは条件にしない (2026-09-11 の判断)。当たらないのは pick〜top の
      # あたりだが、零点未確定の昇降を条件にすると前後が 1mm も動かせず、手で寄せて
      # 測る作業が回らない。守りは零点確定の並び (sub_lift が先・top へ退避) と
      # 操縦者の目視に移した
    unit: mm
    command_unit: rad
    # 位置はロータ角なので減速比が乗る: Gr * 2 / (m * z) = 19.203211 * 2 / 36
    scale: 1.0668451
    offset: 0.0
    # この軸は未実測。同じ機構の sub_lift が渋って 7.3mm/s まで落ちた実測があるので
    # そちらへ合わせる (速く見積もると短すぎる timeout_s が検算を通ってしまう)
    min_speed: 7.0
    timeout_s: 200.0
    tolerance: 1.0
    manual:
      # スイッチ間の実測 418.8mm (2026-09-11 距離測定、伸ばした後) の手前
      min: -415.0
      max: 2.0
      # 先頭が既定の刻み。寄せるのに 1mm 刻みだと回らない
      steps: [50.0, 10.0, 5.0, 1.0]

  # サーボ 3 軸の timeout_s は firmware/servo/include/config.h のスルーレート
  # (90deg/s) と対。突き合わせは tests/test_servo_travel_budget.py。
  sub_rotate:
    # 前後の位置は条件にしない (2026-09-11 に外した)。棚の手前で回すと当たるが、
    # 調整中に回せないほうが困る。当たるかは操縦者の目視
    unit: deg
    command_unit: deg
    timeout_s: 2.0
    tolerance: 2.0       # 到達許容差 [deg]
    motors:
      sub_rotate_r: { scale: 1.0, offset: 0.0 }
      # 左右直結ペアの折り返し点 (2026-09-10 実測。右 + 左 = 270)。取り付け向きで
      # 決まるので、付け直したら測り直す。ずれていると直結した機構をその場で捻る
      sub_rotate_l: { scale: -1.0, offset: 270.0 }

  sub_pitch:
    guard:
      # ピッチとオフセットを同じ指令で動かすと途中の姿勢で重なる。
      # 片側だけ書く —— 読み込み時に sub_offset 側へも対称化される
      not_with: [sub_offset]
    # サーボの回転をクランク 65 / ロッド 90 のリンクで直線にしている (2026-09-12)。
    # 軸の値は**左右の先端どうしの隙間 [mm]** で、0 が真ん中でぴったり合う姿勢。
    # 左右の和は span - 隙間 に固定されるので、中心をずらしても押し合いようがない
    unit: mm
    command_unit: deg
    timeout_s: 3.0
    tolerance: 2.0
    linkage:
      crank: 65.0
      rod: 90.0
      span: 230.0           # 左右のサーボ軸間
      # zero は伸びきり (クランク角 0deg) のサーボ角。左は取り付けが鏡なので sign が逆
      # (右 + 左 = 270 の関係は今までどおり)
      right: { motor: sub_pitch_r, zero: 80.0, sign: 1 }
      left: { motor: sub_pitch_l, zero: 190.0, sign: -1 }
    motors:
      # 換算は linkage が持つ。ここの scale/offset は使わない
      sub_pitch_r: { scale: 1.0, offset: 0.0 }
      sub_pitch_l: { scale: 1.0, offset: 0.0 }

  sub_offset:
    unit: deg
    command_unit: deg
    scale: 1.0
    offset: 0.0
    timeout_s: 3.0
    tolerance: 2.0

  wall_r:
    unit: deg
    command_unit: deg
    scale: 1.0
    offset: 0.0
    timeout_s: 2.0

  # settle_s は弁の応答時間 + 吸着が効くまでの時間。2026-09-11 に実機で 3 秒へ
  # (0.2 だと吸い切る前に持ち上げてワークを落とす)。
  # manual_always: 吸着が外れないときに、弁 1 個のためシーケンスの制御権を奪わずに済む
  valve_1: &valve_axis
    unit: on_off
    command_unit: on_off
    command_mode: on_off
    scale: 1.0
    offset: 0.0
    settle_s: 3.0
    timeout_s: 4.0
    manual_always: true
  valve_2: *valve_axis
  valve_3: *valve_axis
  valve_4: *valve_axis
  valve_5: *valve_axis
  valve_6: *valve_axis

  # TODO(実機で確認): settle_s はポンプが規定の負圧に達するまでの時間。
  pump_vac:
    unit: duty
    command_unit: duty
    command_mode: duty
    scale: 1.0
    offset: 0.0
    settle_s: 0.5
    timeout_s: 1.0

positions:
  # TODO(機構が付いてから実測): 直動 2 軸・サーボ 3 軸とも仮値。値そのものではなく、
  # 下に書いた「満たすべき条件」のほうが正である (条件を崩すと試合シーケンスが
  # 干渉制約を守れなくなる。tests/test_sub_hand_positions_config.py が固定している)。
  #
  # コート別に分岐させないこと。コートで変わるのは sub_lift の mm↔rad 換算
  # (scale の符号) だけで、mm の座標系は両コートで揃えてある。
  sub_y_axis:
    # 0.0 は前端スイッチの動作点そのもの。tolerance 1.0mm (移動許容 0.3mm) と
    # ON 区間 2mm の外へ離す。どれも manual の -440.0〜2.0mm の内側に取る。
    retracted: -414.0    # 収納位置 [mm]。一番後ろ (後端スイッチ -418.8 の手前。2026-09-11)
    # 初期位置。零点確定を終えた位置 (前端から離脱した -10mm) の 15cm 後ろ
    home: -160.0         # 初期位置 [mm]
    # sub_rotate を回してよいのはここだけ。前端スイッチから 150mm 以上離すこと
    # (機構が回転しながら前端側の構造物に当たる)。
    clear: -200.0        # 回転可能位置 [mm]
    receive: -4.0        # 棚から受け取る位置 [mm]。前端スイッチ (0.0) のぎりぎり手前
    # 箱 4 箇所。**間隔は実測 147mm**、前から順に後ろへ並ぶ。前端スイッチの 150mm 以内に
    # 入るのは place_1 だけで、残りは直接回しても当たらない位置にある。それでもシーケンスは
    # 全箱で clear を経由する (並びで守る)。値は機構が付いてから実測で確定する。
    place_1: -100.05     # 箱 1 の上 [mm]。place_2 の 142mm 前 (間隔の実測から)
    place_2: -262.05     # 箱 2 の上 [mm]。実測 -242.05 から 2cm 後ろ (2026-09-11)
    place_3: -404.05     # 箱 3 の上 [mm]。place_2 の 142mm 後ろ
    # 箱 4 は 142mm 間隔だと -526.05 で、伸ばした可動域 (418.8mm) にも 10.7cm 足りない。
    # 届く範囲の仮値で順序だけ保つ
    place_4: -410.0      # 箱 4 の上 [mm]。仮 (retracted -414 より前に置く)

  sub_lift:
    # **上昇側が負。** + 方向が下なので、上げるほど値が小さくなる。0.0 は下端
    # スイッチの動作点そのもので、ON 区間の縁に座ると読みが揺れ、guard も 0.0 への
    # move_to を拒みうる。どれも manual の -450.0〜2.0mm の内側に取る。
    # 上端スイッチの実測 -170.69mm (2026-09-11 距離測定) のほぼ上端
    top: -170.0          # 移動高さ [mm]。回すのはこの高さ (低いとワークが箱に当たる)
    pick: -81.0          # 吸着高さ [mm]。2026-09-11 に 5mm 下げた
    lifted: -91.0        # 吸着後に棚から離す高さ [mm]。**pick のちょうど 10mm 上**。ここから後退する
    # 箱へ下ろす手前で一度止まる高さ。ワークが箱に入らないところで前後を詰める
    above_box: -150.0    # 箱の縁の高さ [mm]。place の 10mm 上
    place: -140.0        # 箱へ下ろす高さ [mm]。top から 30mm 下げるだけ (2026-09-11)

  # TODO(実機で確認): closed が initial と同値なので動作確認の 1 段目が指令量 0 になり、
  # closed へ届かない故障を拾えない。後壁の実可動域が決まったら別々の値にすること。
  wall_r:
    initial: 90.0
    closed: 90.0
    open: 180.0

  # サーボ 3 軸は 2026-09-10 に実機で実測した。初期姿勢の角 (sub_rotate.receive /
  # sub_pitch.open / sub_offset.open) は firmware/servo/include/config.h の基板 #2 の
  # initialAngleDeg と対で、通電・瞬断からの再起動でその角へ駆動する
  # (突き合わせは tests/test_sub_hand_positions_config.py がモータ 1 台ずつ行う)。
  # 実機で確認済み (2026-09-10)。軸の値は右の生角で、左は offset 270.0 により
  # receive で 270deg・carry で 180deg になる (どちらも r + l = 270 で対になる)。
  sub_rotate:
    receive: 0.0         # 受け取り姿勢 [deg]
    carry: 85.0          # 搬送姿勢 [deg]。2026-09-11 に receive 側へ 5deg 戻した

  # 実機で確認済み (2026-09-10)。軸の値は右の生角で、左は offset 270.0 により
  # open で 10deg・close で 190deg になる (どちらも r + l = 270 で対になる)。
  # 値は左右の先端どうしの隙間 [mm]。open は縮めきり (片側 25mm、サーボ 260/10deg)、
  # close は真ん中でぴったり (片側 115mm、サーボ 131.3/138.7deg)
  sub_pitch:
    open: 180.0          # 開いた持ち方 [mm]
    close: 0.0           # 閉じた持ち方 [mm]

  # 実機で確認済み (2026-09-10)。0 -> 5 -> 30 -> 180deg を通した。
  sub_offset:
    open: 0.0            # 開いた持ち方 [deg]
    close: 170.0         # 閉じた持ち方 [deg]。2026-09-11 に 180 から変更

  # 三方弁なので閉じた側が大気開放になる。ワークの解放は閉じるだけで済み、
  # 排気の駆動源を別に持たない。
  valve_1: &valve_states
    open: 1.0            # 開 (吸着パッドへ吸気経路をつなぐ)
    closed: 0.0          # 閉 (吸気経路を遮断し、パッド側を大気開放)
  valve_2: *valve_states
  valve_3: *valve_states
  valve_4: *valve_states
  valve_5: *valve_states
  valve_6: *valve_states

  # TODO(実機で確認): 吸引力が足りなければファームの max_duty を上げてから
  # ここを上げること。ここだけ上げても効かない。
  pump_vac:
    stop: 0.0            # 停止 [duty]
    run: 0.95             # 吸気 [duty]

# 軸どうしの干渉 (docs/invariants.md §4)。ピッチが close のあいだ、オフセットは close 以外の
# 姿勢を取れない (機構が干渉する)。手動操縦とシーケンスの両方が指令の瞬間に判定する。
# 「居る」かどうかは各軸の tolerance で決まり、中間の角は「居ない」と扱う。
interlocks:
  - when: { sub_pitch: close }
    require: { sub_offset: close }
