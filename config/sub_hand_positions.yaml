# サブハンドの機構位置定数。書き方は config/main_hand_positions.yaml と同じ。
#
# !!! 機構が未完成のため、ここに書かれた値はすべて仮値 (安全側の小さい可動量) !!!
# sequences/sub_hand.py には数値を書かないこと。
#
# --- サーボ軸の角度の書き方 -------------------------------------------------
# 値は**出力軸の絶対角 [deg]**。**180 度サーボか 270 度サーボかはここに現れない** ——
# 角度 → パルス幅の変換は firmware/servo/include/config.h の ServoPulseSpec だけが
# 持つので、**型を載せ替えてもこのファイルは 1 行も変わらない** (仕様書 §7.7)。
# 代わりに 2 つ制約がある:
#   - **負の角度は書けない。** ファームは 0deg でパルス幅の下端に張り付くようクランプ
#     するので、270 度サーボの中央を 0 とした ±135 のような書き方は取れない。0 起点の
#     片側絶対角で書き、機械原点をずらしたいときは axes.<軸>.offset で寄せる
#   - **ファームの angle_min / angle_max を超えた値は黙ってクランプされる。** 症状は
#     「送ったのに途中で止まる」だけで、SET_TARGET には書いた値が載っているので
#     candump からも読めない。範囲を変えるときはファーム側の**そのスロットの**
#     定数を直す (このロボットのぶんは kSubRotateRLimits / kSubRotateLLimits /
#     kSubPitchRLimits / kSubPitchLLimits / kSubOffsetLimits。1 つを共有すると
#     1 スロットの都合で全部が緩む)
#
# --- サーボの左右ペアは offset で折り返す ------------------------------------
# **メインハンドの rotate (EDULITE) と書き方が違う。** あちらは連続回転なので
# scale の符号だけで逆回転を表せるが、**サーボは 0〜270deg の絶対角**なので、
# 符号を反転しただけでは逆回転側が負の角度になり、ファームが 0deg でクランプして
# 動かなくなる (症状は「片側だけ動かない」だけで、SET_TARGET には書いた値が載って
# いるので candump からも読めない)。offset とセットで折り返すこと。

axes:
  # RobStride EDULITE 05 の補助アーム関節。指令・フィードバックともに rad。
  sub_arm_joint:
    unit: deg
    command_unit: rad
    scale: 0.017453292519943295   # deg -> rad (pi/180)
    offset: 0.0          # 機械原点と電気原点のずれ [rad]。TODO: 実機で実測
    timeout_s: 3.0       # この時間で到達しなければシーケンスを停止する
    # 手動操縦の可動範囲 [deg]。書き方と考え方は main_hand_positions.yaml を参照。
    # TODO: 機構完成後、メインハンドと干渉しない角度範囲へ詰めること
    manual:
      min: -5.0
      max: 15.0
      steps: [1.0, 5.0]

  # ラックアンドピニオンの直動 2 軸 (Damiao DM3520)。指令・フィードバックともに
  # **出力軸の rad** —— 減速比 3591/187 は本機のドライバが内部で吸収済みなので、
  # M3508 の y_axis と違って減速比は scale に現れない。
  #
  # scale = 2*pi / (pi * m * z) = 2 / (m * z)   [rad / mm]
  #   ラックピニオンは基準円で転がるので、出力軸 1 回転 = 基準円周 pi*m*z [mm]
  #   ピニオンは モジュール 1 / 歯数 36 (基準円 36.0mm)
  #   -> 2 / 36 = 0.0555556 rad/mm (出力軸 1 回転 = 113.097mm)
  # 組み立て後に一度だけ実測で確かめること。ずれていたら
  #   scale_new = scale_old * 指令値 / 実測値
  # **測るときは必ず同じ方向から寄せる** — バックラッシュは scale では吸収できず、
  # 往復で測ると遊びのぶんが scale の誤差として紛れ込む (main_hand の y_axis と同じ)。
  # TODO: 昇降側のピニオンが前後軸と違うなら、sub_lift の scale だけ差し替えること。
  #
  # 可動範囲は p_max (12.5rad) が上限で、scale 換算で ±225mm。ここを超えた位置は
  # ドライバ側で頭打ちになり、フィードバックも張り付くので「送ったのに途中で止まる」
  # という形でしか現れない。
  #
  # **前後軸の原点は前端のリミットスイッチ** (sub_y_axis_f_limit_sensor = 0x49)。
  # 零点確定は Dm3520Driver の SET_ZERO 経路 (無励磁 -> 0xFE -> 再励磁) を通る。
  #
  # !!! sub_lift の原点は依然として電源投入位置 !!! 本機は投入時に 0.0rad へ固定
  # されるので、搬送中に手で動かしたぶんがそのまま座標のずれになる。上下端の
  # スイッチ (0x4B / 0x4C) は配線も極性も確定しているが、探索パラメータが未実測
  # なので homing: を書いていない。書けば前後軸と同じ経路で動く。
  #
  # 前後方向 (Y 方向)。**軸名に sub_ を付けるのは main_hand の y_axis と衝突させない
  # ため** —— 統合動作確認は両ハンドの位置定数を PositionTable.merged で 1 つに
  # まとめるので、軸名が重なると起動ごと落ちる (main.py の _wire_motor_check_sequence)。
  sub_y_axis:
    # 原点 = 前端。**唯一の無人の歯止めは search_distance だけ**なので、
    # 実測ストロークが分かるまでこの値を広げないこと。
    homing:
      sensor: sub_y_axis_f_limit_sensor   # config/sub_hand.yaml の sensors: に登録した名前
      direction: 1            # 前端へ寄せる向き。TODO(実機で確認): 逆だと後端まで押し込む
      search_distance: 40.0   # [mm] TODO(実機で確認): 実測ストローク + わずかな余裕へ
      step: 0.5               # [mm] 下限は静止摩擦、上限は tolerance 1.0 の半分
      settle_s: 0.05          # 指令が機構へ届き、センサの状態が返る余裕
    unit: mm
    command_unit: rad
    scale: 0.0555556     # mm -> rad (出力軸)。導出は上のコメント
    offset: 0.0
    timeout_s: 4.0       # この時間で到達しなければシーケンスを停止する
    tolerance: 1.0       # 到達許容差 [mm]
    # 手動操縦の可動範囲 [mm]。**機構の物理端ではなくその内側に取る** ——
    # 手動は操縦者が端へ寄せていく操作なので、境界を物理端に合わせると
    # 「指令は範囲内なのに機構は突き当たっている」状態が作れてしまう。
    # TODO: 機構完成後、実測のストローク端より内側へ詰めること
    # **原点が前端なので収納側が負になる。** max をわずかな正に留めてあるのは、
    # 前端スイッチを越えた先が機構の突き当たりだから。
    manual:
      min: -30.0
      max: 2.0
      steps: [1.0, 5.0, 10.0]

  # 昇降。正が上、負が下 (TODO: 実機で確認し、逆なら scale の符号を反転する)。
  #
  # **緊急停止では無励磁になる。** 本機の「止める」は消磁の一手しか無く、サーボの
  # ような「現在角を保持」は持たない。減速比 19.2 のギヤで自重落下しない前提に
  # 乗っているので、機構が付いたら config/checklist.yaml の sub_lift_holds で
  # 必ず実機確認すること。
  sub_lift:
    unit: mm
    command_unit: rad
    scale: 0.0555556     # TODO: 昇降側のピニオンが違うなら差し替える
    offset: 0.0
    timeout_s: 4.0
    tolerance: 1.0
    # 下端側を 0 未満まで許していないのは、原点 (電源投入位置) を最下点に取る想定のため。
    # TODO: 機構完成後、実測のストローク端より内側へ詰めること
    manual:
      min: -2.0
      max: 30.0
      steps: [1.0, 5.0, 10.0]

  # --- 自作モータドライバのサーボ 3 軸 (サーボ基板 #2) ---
  # 指令・フィードバックともに出力軸の絶対角 [deg]。
  #
  # **manual: は書かない。** 位置名によるプリセット指令だけに絞ることで、「定義した
  # 状態以外を送れない」という通常運用の保証がそのまま残る (メインハンドの gripper と
  # 同じ扱い)。機構が付くまで角度が仮値なので、連続値で端へ寄せていける口を開けると
  # 仮値の可動範囲を信じて機構へ突き当てることになる。
  #
  # **homing: も書かない。** 同じ基板群の 6 センサはどれも報告のみで、零点確定には
  # 使わない (サブハンドの直動 2 軸は DM3520 で、そもそも原点確定の手段を宣言して
  # いない)。サーボは指令角がそのまま位置なので零点確定という概念を持たない。
  #
  # !!! sync_tolerance / sync_kp は書かない。書き忘れではない !!!
  # 左右ペア軸の 3 重の保護のうち、**②偏差監視だけがサーボでは原理的に働かない** ——
  # サーボの FEEDBACK は**クランプ後の指令角のエコー**であって実位置ではないので、
  # 偏差監視に載せても見えるのは「PC が送った指令の差」だけで、片側が固着しても
  # ホーンが外れても差は 0 のままである。効かない保護を書くと「守っているように見えて
  # 守っていない」層が 1 枚できる (次に読む人はそこを保護と数える) ので書かない。
  # 残る 2 つは motors: に束ねるだけで効く: ①左右が同じフレームで同時に指令される
  # ②フィードバック途絶をペア単位で判定する。
  # ずれの検出は目視 (config/checklist.yaml) が担う。
  #
  # **timeout_s はその軸で起きうる最大移動から決める。** サーボの移動時間は
  # firmware/servo/include/config.h のスルーレート (90deg/s) で決まり、PC 側から
  # 変える経路は無い。下の 3 軸は home(0) ↔ working(90) の 90deg が最大なので
  # 1.000s かかる —— 到達判定に早出しは無く (reachedTolerance 0deg)、FEEDBACK 100Hz の
  # 遅延も乗るので 1.0 では毎回 SequenceTimeoutError になる。
  # 突き合わせは tests/test_servo_travel_budget.py が機械的に行う。
  # **positions を広げたらここも一緒に見直すこと** (片方だけ動かすと、機構が完全に
  # 正常でもその move_to が毎回・決定的に落ちる)。

  # サブハンドの回転。左右 2 台が機構的に直結し、逆回転で同一動作。
  sub_rotate:
    unit: deg
    command_unit: deg
    timeout_s: 2.0
    tolerance: 2.0       # 到達許容差 [deg]
    motors:
      sub_rotate_r: { scale: 1.0, offset: 0.0 }
      # 逆回転で同一動作。**符号の反転だけでは足りず offset が要る** (上のコメント)。
      # TODO(実機で確認): offset 270.0 は仮値。実際の折り返し点は、左右のサーボを
      # どの向きに取り付けるかで決まるので機構が付いてから実測する。ずれていると
      # 左右が同じ論理位置で違う姿勢を取り、直結した機構をその場で捻る
      sub_rotate_l: { scale: -1.0, offset: 270.0 }

  # サブハンドのピッチ。sub_rotate と同じ左右直結ペア。
  sub_pitch:
    unit: deg
    command_unit: deg
    timeout_s: 2.0
    tolerance: 2.0
    motors:
      sub_pitch_r: { scale: 1.0, offset: 0.0 }
      # TODO(実機で確認): sub_rotate と同じく offset 270.0 は仮値。
      # **sub_rotate の実測値を写してはならない** —— 取り付けの向きは軸ごとに違う
      sub_pitch_l: { scale: -1.0, offset: 270.0 }

  # オフセット機構。**左右ペアではない単独軸**なので motors: を書かず、
  # 「軸名 = モータ名」の既定の対応に乗せる。
  sub_offset:
    unit: deg
    command_unit: deg
    scale: 1.0
    offset: 0.0
    timeout_s: 2.0
    tolerance: 2.0

  # 電磁弁 6 個。**6 軸とも同じ定義**なので、settle_s などを変えるときは
  # 6 箇所すべてを直すこと (1 つだけ残ると、その弁だけ待ち時間が違う)。
  #
  # on_off 軸は到達判定を持たない (基板が弁の開閉を観測できない。仕様書 §9.3)。
  # 指令の直後に次のステップへ進まないよう settle_s で待つ。
  # duty 軸と同じく manual: は書けない (書くと起動を拒否する) ので、手動操縦でも
  # open / closed のプリセットだけを送る。
  #
  # TODO(実機で確認): settle_s は弁の応答時間 + 吸着が効くまでの時間。
  # 機構が付いたら「離した直後に持ち上げても落ちない」ところまで実測して詰めること。
  valve_1: &valve_axis
    unit: on_off
    command_unit: on_off
    command_mode: on_off
    scale: 1.0
    offset: 0.0
    settle_s: 0.2
    timeout_s: 1.0
  valve_2: *valve_axis
  valve_3: *valve_axis
  valve_4: *valve_axis
  valve_5: *valve_axis
  valve_6: *valve_axis

  # 吸気ポンプ / 排気ポンプ。DC 基板なので duty 指令 (conveyor と同じ扱い)。
  # duty 軸に可動範囲は存在しないので manual: は書けない。
  #
  # TODO(実機で確認): settle_s はポンプが規定の負圧 / 正圧に達するまでの時間。
  # 短すぎると「回し始めた直後に弁を開けて吸着し損ねる」ことになる。
  pump_vac:
    unit: duty
    command_unit: duty
    command_mode: duty
    scale: 1.0
    offset: 0.0
    settle_s: 0.5
    timeout_s: 1.0

  pump_blow:
    unit: duty
    command_unit: duty
    command_mode: duty
    scale: 1.0
    offset: 0.0
    settle_s: 0.5
    timeout_s: 1.0

positions:
  # TODO: 機構完成後に実測値へ。現状は微小可動量のみ。
  sub_arm_joint:
    home: 0.0            # 収納姿勢 [deg]
    extended: 8.0        # 展開姿勢 [deg]
    handoff: 5.0         # メインハンドからの受け取り姿勢 [deg]
    place: 10.0          # 配置姿勢 [deg]

  # 直動 2 軸 [mm]。原点 (0.0) は電源投入位置。
  # TODO: 機構完成後に実測値へ。現状は「動いたことが目で分かる」ことだけを狙った仮値。
  # **前後軸の原点は前端** (零点確定でそこへ寄せる) なので、収納側が負になる。
  sub_y_axis:
    home: -20.0          # 収納位置 [mm]。前端から後ろへ
    extended: 0.0        # 前方への展開位置 = 前端 = 原点

  sub_lift:
    home: 0.0            # 下端 = 電源投入位置
    lifted: 20.0         # 上昇位置 [mm] (出力軸で約 64deg)

  # --- サーボ 3 軸 [deg] ---
  # TODO(機構が付いてから実測): 3 軸とも仮値。**home 0.0 / working 90.0 は「動いたことが
  # 目で分かる」ことだけを狙った値**で、機構の姿勢とは何の関係も無い。
  #
  # !!! ファームの起動角 (initialAngleDeg) と home を揃えること !!!
  # 基板 #2 の 5 スロットは通電した瞬間と瞬断からの再起動で initialAngleDeg へ駆動する
  # (現在 0.0deg で、これも仮値)。ここが食い違うと、電源を入れるたび・基板が瞬断する
  # たびに機構が別の姿勢へ飛ぶ。**再起動は FEEDBACK の「起動後未受信」ビットとして
  # PC に出るが、飛んだ後にしか出ない。**
  #
  # **左右ペアの 2 軸は論理位置を 1 つ書くだけでよい** —— 左右へ届く実際の角度は
  # axes.<軸>.motors の scale / offset が別々に作る。
  sub_rotate:
    home: 0.0            # 収納姿勢 [deg]
    working: 90.0        # 作業姿勢 [deg]

  sub_pitch:
    home: 0.0            # 収納姿勢 [deg]
    working: 90.0        # 作業姿勢 [deg]

  sub_offset:
    home: 0.0            # 収納姿勢 [deg]
    working: 90.0        # 作業姿勢 [deg]

  # 電磁弁は開 / 閉の 2 状態しか取らない。**値は 0 か非 0 かだけが意味を持つ**
  # (仕様書 §9.2)。0.5 のような中間値を書いても基板は ON として扱うので、
  # 「半開」を意図した値を書かないこと。
  valve_1: &valve_states
    open: 1.0            # 開 (吸着パッドへ吸気経路をつなぐ)
    closed: 0.0          # 閉 (吸気経路を遮断)
  valve_2: *valve_states
  valve_3: *valve_states
  valve_4: *valve_states
  valve_5: *valve_states
  valve_6: *valve_states

  # ポンプの duty。**ファーム側の max_duty (既定 0.30) でクランプされる**ので、
  # ここに 0.30 を超える値を書いても 0.30 で回る (仕様書 §5.3)。
  # TODO(実機で確認): 吸引力が足りなければファームの max_duty を上げてから
  # ここを上げること。ここだけ上げても効かない。
  pump_vac:
    stop: 0.0            # 停止 [duty]
    run: 0.95             # 吸気 [duty]

  pump_blow:
    stop: 0.0            # 停止 [duty]
    run: 0.95             # 排気 (ワークを離すときの正圧) [duty]
