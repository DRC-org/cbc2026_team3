axes:
  sub_arm_joint:
    unit: deg
    command_unit: rad
    scale: 0.017453292519943295   # deg -> rad (pi/180)
    offset: 0.0          # 機械原点と電気原点のずれ [rad]。TODO: 実機で実測
    timeout_s: 3.0       # この時間で到達しなければシーケンスを停止する
    # TODO: 機構完成後、メインハンドと干渉しない角度範囲へ詰めること
    manual:
      min: -5.0
      max: 15.0
      steps: [1.0, 5.0]

  sub_y_axis:
    homing:
      sensor: sub_y_axis_f_limit_sensor
      direction: 1
      # スイッチ間の実測は 500〜520mm (機構側の想定 750mm とは食い違う)
      search_distance: 560.0
      # ON 区間の実測 2.2mm より狭く取る (広いと粗い 1 歩で跨ぎ切る)
      coarse_step: 1.0
      # スイッチの移動許容 0.3mm より小さく。原点のばらつきは刻み幅そのもの
      step: 0.1
      release_distance: 10.0
      settle_s: 0.05
    guard:
      # 逆に書くと守りが反転し、押されている端へ進む指令だけが通る
      limits:
        plus: sub_y_axis_f_limit_sensor
        minus: sub_y_axis_r_limit_sensor
      # 桁の違う目標だけを止める。実ストローク 500〜520mm より広く取る
      max_step: 600.0
      # 移動中は 0.6Nm 以下、押し込みで 0.7Nm 超 (2026-09-09 実測)
      stall_torque: 2.0
    unit: mm
    command_unit: rad
    # 位置はロータ角なので減速比が乗る: Gr * 2 / (m * z) = 19.203211 * 2 / 36
    scale: 1.0668451
    offset: 0.0
    timeout_s: 4.0
    tolerance: 1.0
    manual:
      min: -495.0
      max: 2.0
      steps: [1.0, 5.0, 10.0]

  # 昇降。**+ 方向が下** (2026-09-09 実機、青コート)。コートでモータの回転と上下の対応が
  # 鏡になり、スイッチは重力側に固定なので、scale の符号だけをコート別に持つ (赤は未実測)。
  sub_lift:
    homing:
      sensor: sub_lift_b_limit_sensor
      direction: 1
      # スイッチ間の実測は 189mm (機構側の想定 400mm とは食い違う)
      search_distance: 220.0
      step: 0.1
      # ON 区間 1.0mm より狭く取る (前後軸より狭いのはこの実測差による)
      coarse_step: 0.5
      release_distance: 10.0
      settle_s: 0.05
    guard:
      # + が下なので plus が下端。逆に書くと守りが反転する
      limits:
        plus: sub_lift_b_limit_sensor
        minus: sub_lift_t_limit_sensor
      max_step: 250.0
      stall_torque: 2.0
    unit: mm
    command_unit: rad
    scale: { blue: 1.0668451, red: -1.0668451 }  # TODO: 昇降側のピニオンが違うなら差し替える
    offset: 0.0
    timeout_s: 4.0
    tolerance: 1.0
    manual:
      min: -185.0
      max: 2.0
      steps: [1.0, 5.0, 10.0]

  # サーボ 3 軸の timeout_s は firmware/servo/include/config.h のスルーレート
  # (90deg/s) と対。突き合わせは tests/test_servo_travel_budget.py。
  sub_rotate:
    unit: deg
    command_unit: deg
    timeout_s: 2.0
    tolerance: 2.0       # 到達許容差 [deg]
    motors:
      sub_rotate_r: { scale: 1.0, offset: 0.0 }
      # TODO(実機で確認): offset 270.0 は仮値。折り返し点は左右のサーボの取り付け向きで決まる。
      sub_rotate_l: { scale: -1.0, offset: 270.0 }

  sub_pitch:
    unit: deg
    command_unit: deg
    timeout_s: 2.0
    tolerance: 2.0
    motors:
      sub_pitch_r: { scale: 1.0, offset: 0.0 }
      # TODO(実機で確認): sub_rotate と同じく offset 270.0 は仮値。
      sub_pitch_l: { scale: -1.0, offset: 270.0 }

  sub_offset:
    unit: deg
    command_unit: deg
    scale: 1.0
    offset: 0.0
    timeout_s: 2.0
    tolerance: 2.0

  # TODO(実機で確認): settle_s は弁の応答時間 + 吸着が効くまでの時間。
  # manual_always: 吸着が外れないときに、弁 1 個のためシーケンスの制御権を奪わずに済む
  valve_1: &valve_axis
    unit: on_off
    command_unit: on_off
    command_mode: on_off
    scale: 1.0
    offset: 0.0
    settle_s: 0.2
    timeout_s: 1.0
    manual_always: true
  valve_2: *valve_axis
  valve_3: *valve_axis
  valve_4: *valve_axis
  valve_5: *valve_axis
  valve_6: *valve_axis

  # TODO(実機で確認): settle_s はポンプが規定の負圧 / 正圧に達するまでの時間。
  pump_vac:
    unit: duty
    command_unit: duty
    command_mode: duty
    scale: 1.0
    offset: 0.0
    settle_s: 0.5
    timeout_s: 1.0

  pump_blow:
    unit: duty
    command_unit: duty
    command_mode: duty
    scale: 1.0
    offset: 0.0
    settle_s: 0.5
    timeout_s: 1.0

positions:
  # TODO: 機構完成後に実測値へ。現状は微小可動量のみ。
  sub_arm_joint:
    home: 0.0            # 収納姿勢 [deg]
    extended: 8.0        # 展開姿勢 [deg]
    handoff: 5.0         # メインハンドからの受け取り姿勢 [deg]
    place: 10.0          # 配置姿勢 [deg]

  # TODO: 機構完成後に実測値へ。現状は「動いたことが目で分かる」ことだけを狙った仮値。
  sub_y_axis:
    home: -20.0          # 収納位置 [mm]。前端から後ろへ
    # 0.0 は動作点そのもの。tolerance 1.0mm (移動許容 0.3mm) と ON 区間 2mm の外へ離す。
    extended: -5.0       # 前方への展開位置 [mm]

  sub_lift:
    # 0.0 は動作点そのもの。ON 区間の縁に座ると読みが揺れ、guard も 0.0 への
    # move_to を拒みうる
    home: -5.0           # 待機位置 [mm]
    # **上昇側が負。** + 方向が下なので、上げるほど値が小さくなる。
    # TODO(機構が付いてから実測): スイッチ間 189mm の内側で実運用の高さへ詰めること
    lifted: -20.0        # 上昇位置 [mm]

  # TODO(機構が付いてから実測): 3 軸とも仮値。home は firmware/servo/include/config.h の
  # 基板 #2 の initialAngleDeg と対 (通電・瞬断からの再起動でその角へ駆動する)。
  sub_rotate:
    home: 0.0            # 収納姿勢 [deg]
    working: 90.0        # 作業姿勢 [deg]

  sub_pitch:
    home: 0.0            # 収納姿勢 [deg]
    working: 90.0        # 作業姿勢 [deg]

  sub_offset:
    home: 0.0            # 収納姿勢 [deg]
    working: 90.0        # 作業姿勢 [deg]

  valve_1: &valve_states
    open: 1.0            # 開 (吸着パッドへ吸気経路をつなぐ)
    closed: 0.0          # 閉 (吸気経路を遮断)
  valve_2: *valve_states
  valve_3: *valve_states
  valve_4: *valve_states
  valve_5: *valve_states
  valve_6: *valve_states

  # TODO(実機で確認): 吸引力が足りなければファームの max_duty を上げてから
  # ここを上げること。ここだけ上げても効かない。
  pump_vac:
    stop: 0.0            # 停止 [duty]
    run: 0.95             # 吸気 [duty]

  pump_blow:
    stop: 0.0            # 停止 [duty]
    run: 0.95             # 排気 (ワークを離すときの正圧) [duty]
