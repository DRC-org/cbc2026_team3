# CAN バス定義の単一情報源。udev ルールと scripts/setup_can.sh の双方がここを読む。
#
# link: 接続方式。省略時は gs_usb (CANable2 = カーネルが直接 netdev を生やす)。
#   gs_usb … usb: の VID/PID + 個体の serial で netdev をリネームする
#   slcan  … CAN トランシーバを持たない基板。USB CDC の tty を個体固定し、
#            slcand で netdev へ昇格させる。VID/PID はバスごとに持つ

usb:
  vendor_id: "1d50"
  product_id: "606f"

buses:
  can_m3508:
    serial: "004600224E4D501520343332"
    bitrate: 1000000
    txqueuelen: 1000

  can_edulite:
    serial: "006F004A4E4D501820343332"
    bitrate: 1000000
    txqueuelen: 1000

  can_generic:
    serial: "0068005C4E4D501520343332"
    bitrate: 1000000
    txqueuelen: 1000

  can_dm3520:
    serial: "0069003F4E4D501820343332"
    bitrate: 1000000
    txqueuelen: 1000

  # DC 基板は CAN トランシーバ故障のため USB CDC (SLCAN) で PC へ繋ぐ。
  # VID/PID は Arduino UNO R4 Minima の USB CDC のもの。
  can_dc:
    link: slcan
    vendor_id: "2341"
    product_id: "0069"
    serial: "390F192B363235362B0E33334B572F52"
    bitrate: 1000000
    txqueuelen: 1000
