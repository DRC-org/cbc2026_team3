# CAN バス定義の単一情報源。
#
# CANable の USB 列挙順は挿す順・ハブのポート・起動タイミングで変わるため、
# can0/can1/can2 という番号は個体との対応を保証しない (番号が入れ替わると C620 に
# EDULITE 用コマンドが飛ぶ)。STM32 UID 由来の serial で固定名を割り当てる。
#
# udev ルール (99-canable.rules) も setup_can.sh もこのファイルから生成/参照する。
# serial の採取手順は docs/impl_plan.md「CAN バス命名規約」を参照。
#
# restart_ms は bus-off からの自動復帰までの待ち時間 [ms]。省略時は 100。
# **0 にしてはならない** —— 0 は「自動復帰しない」の意味で、一度 bus-off に落ちた
# インタフェースは手動で down/up するまで送受信とも死んだままになる。
# バス上に 1 台しか居ない構成 (can_dm3520) では、相手が電源を失うだけで ACK が
# 返らなくなり TEC が 256 に達して bus-off へ落ちる。
#
# **ただし現行の CANable2 では実際には効かない。** SocketCAN の restart-ms は
# ドライバが do_set_mode を実装している場合しか設定できず、CANable2 の gs_usb は
# 持たない (カーネルが EOPNOTSUPP =「Device doesn't support restart from Bus Off」
# を返す)。setup_can.sh は非対応を検出したら restart-ms 0 のまま続行して警告する。
# この値は「ドライバが対応していれば使う要求値」であって、実効値は setup_can.sh の
# ログ (実インタフェースから読み戻したもの) で確認すること。

# CANable2 (candleLight FW) の USB ID。全個体共通。
usb:
  vendor_id: "1d50"
  product_id: "606f"

buses:
  can_m3508:
    serial: "004600224E4D501520343332"
    bitrate: 1000000
    # 既定の 10 では制御周期での連続送信時に溢れる
    txqueuelen: 1000

  can_edulite:
    serial: "006F004A4E4D501820343332"
    bitrate: 1000000
    txqueuelen: 1000

  can_generic:
    serial: "0068005C4E4D501520343332"
    bitrate: 1000000
    txqueuelen: 1000

  # Damiao DM3520-1EC（サブハンドのスライド軸）専用。
  #
  # **相乗りできる既存バスが無いので 1 本増やしている。** DM3520 は 11bit 標準 ID を
  # 帯で使い、下位 8bit だけを見て自分宛かを判定する（上位 3bit は制御モードの区別）。
  #   0x000+ID = MIT / 特殊コマンド, 0x100+ID = 位置速度, 0x200+ID = 速度
  # どのバスとどう衝突するかは docs/invariants.md「Damiao DM3520 は専用バスに載せる」。
  #
  can_dm3520:
    serial: "0069003F4E4D501820343332"
    bitrate: 1000000
    txqueuelen: 1000
