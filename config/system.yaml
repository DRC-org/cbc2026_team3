can_buses:
  m3508_bus: can_m3508
  edulite_bus: can_edulite
  generic_bus: can_generic
  dm3520_bus: can_dm3520

health:
  feedback_timeout_ms: 500
  temp_warning_c: 65
  temp_critical_c: 80
  tx_error_threshold: 96

match:
  duration_s: 180

# 複数のロボットから指令する軸 → 追加で指令できるロボット。
# 持ち主は軸を定義した config/<robot>_positions.yaml のほうで、ここには貸し先だけを書く。
# 貸すのは実体そのもの (位置定数も CAN へ出す口も持ち主のものを引き続ける) なので、
# 位置定数を直すのは持ち主の yaml 1 箇所でよい。
shared_axes:
  # コンベア前壁。メインハンドが寄せに使い、サブハンドからも開け閉めする
  wall_f: [sub_hand]
