# 両ロボットで共有する制御プログラムの設定。
#
# ここに置くのは「PC 上に 1 つしか存在しないもの」に限る。以前はこの 3 ブロックを
# main_hand.yaml / sub_hand.yaml の両方にコメントごと逐語で書いていたが、読み込み側は
# 最初に見つけた値だけを採用していたため、sub_hand.yaml 側の編集は WARNING ログを
# 残して黙って捨てられていた。「書けるのに効かない設定」を作らないため 1 箇所へ集約する。
#
# モータ構成 (ドライバ種別・CAN ID・PID・動作確認の個別上書き) はロボットごとに違うので
# config/<robot>.yaml に残す。

# バス別名 -> SocketCAN インタフェース名。
# インタフェース名の実体 (serial / bitrate) は config/can_buses.yaml が単一情報源。
# can0/can1/can2 は USB 列挙順で入れ替わるため使わない。番号が入れ替わると
# C620 に EDULITE 用のコマンドが飛んでモータを壊す。
can_buses:
  m3508_bus: can_m3508
  edulite_bus: can_edulite
  generic_bus: can_generic
  # Damiao DM3520 専用バス。相乗りできる既存バスが無い理由は
  # config/can_buses.yaml の can_dm3520 に書いてある
  dm3520_bus: can_dm3520

health:
  feedback_timeout_ms: 500   # この時間フィードバックなければ STALE
  temp_warning_c: 65         # この温度で WARNING
  temp_critical_c: 80        # この温度で FAULT
  tx_error_threshold: 96     # CAN error_passive 境界

# 動作確認 (motor_check) の設定はここには無い。両ハンドを 1 本のシーケンスで駆動する
# 形へ変えたので (robots/motor_check.py)、駆動量・タイムアウト・許容差はすべて
# config/*_positions.yaml の位置定数が持つ。運用で使う値そのものへ動かすため、
# 確認専用の設定が存在しない = 位置定数とずれようがない。

match:
  duration_s: 180   # 試合時間。ここが操縦者画面のカウントダウンの上限になる

# PID 調整支援。M3508 の位置制御ループが目標値のステップを検出して応答を記録し、
# /pid-tuning に波形・指標 (立ち上がり/行き過ぎ/整定/定常偏差/振動/飽和)・助言を出す。
#
# **記録のために機体を動かす経路は無い。** 記録されるのは操縦者が手動ジョグで
# 動かした 1 回と、シーケンスの move_to 1 回で、どちらも既にある操作である。
# 専用の「試験を実行する」コマンドを足すと機体が動く条件が 1 つ増え、フェーズ
# ゲート・緊急停止・動作確認との排他をそのぶん多く守り続けることになる。
#
# 配信は試合中を除く (試合中に調整はしないうえ、1 回の記録が数十 KB になるため
# テレメトリの帯域を奪う)。記録自体は常に回る。
tuning:
  enabled: true
  window_s: 3.0        # ステップ 1 回あたりの記録長 [s]。整定まで入る長さにする
  pre_trigger_s: 0.2   # ステップ直前も残す [s]。静止からの立ち上がりか判別するため
  min_step_deg: 0.5    # これ以上目標が動いたらステップとみなす [deg]。
                       # **モータの累積角であって軸の単位ではない。**
                       # 小さいと微小な揺れで窓が開き続け、大きいとジョグを取りこぼす
  max_points: 300      # 配信する波形の最大点数。解析は常に全点で行い、間引くのは表示だけ
