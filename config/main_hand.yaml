robot_name: main_hand

# バス別名 (m3508_bus 等) の定義・health・motor_check の共通設定は config/system.yaml。
# 両ロボットで同じ値しか取り得ないため、ここには書けない (書くと起動が拒否される)。

motors:
  # --- 逆回転ペア軸 y_axis (ラックアンドピニオンの前後移動) ---
  # 左右 2 台が機構的に直結しており、位置がずれるとその場で機構が壊れる。
  # そのため両者に motor_check.magnitude: 0 を指定して動作確認から除外する:
  # MotorCheckRunner は 1 台ずつ順に駆動する設計で、さらに M3508Driver.encode_target は
  # 自スロット以外を 0 で埋めるため、単独駆動が構造的に避けられない。
  # 代わりに config/checklist.yaml の y_axis_sync で指差喚呼による目視確認を行う。

  # DJI M3508 (C620 ESC) — CAN Standard Frame
  y_axis_r:
    driver: m3508
    bus: m3508_bus
    can_id: 1
    motor_check:
      magnitude: 0             # 片側だけ駆動すると左右直結の機構が壊れるため SKIPPED にする
    # PC 側位置制御 PID。入力=累積角 [deg]、出力=C620 電流指令 [counts] (16384 ≒ 20A)。
    # !!! 機構寸法が未確定のため実ゲインは未定。以下は「暴れない」ことだけを狙った仮値で、
    #     実機で要チューニング (kp を少しずつ上げ、振動が出る手前で止めること)。
    pid:
      kp: 2.0              # 100deg の偏差でも 200counts (≒0.24A)。振動しない領域から開始
      ki: 0.0              # 重力補償が必要と判明してから足す (機構端で積分が育つと危険)
      kd: 0.0              # ノイズを増幅するため、kp を上げて振動が出てから入れる
      integral_limit: null # ki を入れるときに出力寄与の上限 [counts] を必ず設定する
      dead_band: 1.0       # 目標付近の唸り防止 [deg] (減速比 19:1 で出力軸 0.05deg 相当)
      output_limit: 2000   # 電流上限 [counts] ≒2.4A。C620 フルスケールの約 12% に制限

  # y_axis_r と対になる側。左右で追従特性が変わると押し合いになるため PID は同一値にする
  y_axis_l:
    driver: m3508
    bus: m3508_bus
    can_id: 2
    motor_check:
      magnitude: 0             # 片側だけ駆動すると左右直結の機構が壊れるため SKIPPED にする
    pid:
      kp: 2.0
      ki: 0.0
      kd: 0.0
      integral_limit: null
      dead_band: 1.0
      output_limit: 2000

  # --- 逆回転ペア軸 rotate (エンドエフェクタ回転) ---
  # y_axis と同じ理由で動作確認から除外する。目視確認は checklist.yaml の rotate_sync。

  # RobStride EDULITE 05 — CAN Extended Frame
  rotate_r:
    driver: edulite05
    bus: edulite_bus
    can_id: 1
    host_id: 0xFD
    mode: position
    limit_speed: 2.0
    limit_current: 5.0
    position_kp: 30.0
    set_zero_on_start: false
    motor_check:
      magnitude: 0             # 片側だけ駆動すると左右直結の機構が壊れるため SKIPPED にする

  rotate_l:
    driver: edulite05
    bus: edulite_bus
    can_id: 2
    host_id: 0xFD
    mode: position
    limit_speed: 2.0
    limit_current: 5.0
    position_kp: 30.0
    set_zero_on_start: false
    motor_check:
      magnitude: 0             # 片側だけ駆動すると左右直結の機構が壊れるため SKIPPED にする

  # --- 離散状態アクチュエータ (自作モータドライバ — CAN Standard Frame) ---
  # 開 / 閉 のような数状態しか取らないため、generic 既定の 0.1deg は
  # 「どの状態でもない」無意味な指令になる。動作確認では安全な状態そのものを指令する。
  # !!! magnitude は config/main_hand_positions.yaml の対応する位置定数と同じ値にすること。
  #     ずれると「動作確認で動いた位置」と「運用で使う位置」が別物になり、確認が意味を失う。

  # デバイス ID は「基板種別 | 基板番号 | スロット番号」の固定ビット分割 (仕様書 §2.2)。
  # サーボ基板 (種別 1) の基板番号 0、スロット 0-4 が 0x40-0x44。
  # ID を見ればどの基板のどのスロットかが直接読めるので、candump を眺めるときに
  # 対応表を引かなくてよい。
  gripper:
    driver: generic
    bus: generic_bus
    can_id: 0x40               # サーボ基板 #0 SV0
    control_type: position
    # INFO（1Hz の自己申告）と突き合わせる期待値（仕様書 §3.4）。**不一致は FAULT。**
    # 焼き忘れも 180/270 サーボの取り違えも、機体は指令どおり動いたようにしか見えない
    # （FEEDBACK が返すのはクランプ後の指令角）ので、この照合以外に気付く手段が無い。
    # 値は firmware/servo/include/config.h の kFirmwareVersion と
    # kServoSlots[].pulse.angleRangeDeg に対応する。**ファームを直したらここも直す。**
    expected_firmware: 2
    expected_angle_range_deg: 270.0
    motor_check:
      magnitude: 5.0           # positions.gripper.open と一致させること

  # DC モータ。位置の概念がないので duty 指令。
  # DC 基板 (種別 2) の基板番号 0、スロット 0-2 が 0x80-0x82。
  # ch0=0x80(conveyor) / ch1=0x81 / ch2=0x82 で、ch1・ch2 は現在未使用。
  conveyor:
    driver: generic
    bus: generic_bus
    can_id: 0x80               # DC 基板 #0 ch0
    control_type: duty
    motor_check:
      # この基板はエンコーダも電流センスも持たず、FEEDBACK の velocity は常に 0。
      # 「回ったかどうか」を自動判定する手段が無いので動作確認から除外し、
      # config/checklist.yaml の conveyor_run で目視確認する
      magnitude: 0

  # ワーク保持用の壁。初期 / 閉 / 開 の 3 状態のみ。
  wall_f:
    driver: generic
    bus: generic_bus
    can_id: 0x41               # サーボ基板 #0 SV1
    control_type: position
    expected_firmware: 2
    expected_angle_range_deg: 270.0     # firmware/servo/include/config.h と対
    motor_check:
      magnitude: 6.0           # positions.wall_f.open と一致させること

  wall_r:
    driver: generic
    bus: generic_bus
    can_id: 0x42               # サーボ基板 #0 SV2
    control_type: position
    expected_firmware: 2
    expected_angle_range_deg: 270.0     # firmware/servo/include/config.h と対
    motor_check:
      magnitude: 6.0           # positions.wall_r.open と一致させること

# --- センサ入力 (自作サーボ基板のスロット SV4) ---
# **センサはモータではない。** 自作基板は 1 スロット = 1 CAN デバイスで、センサも
# 自分のデバイス ID で FEEDBACK を送る (仕様書 §5.2)。ここに登録しないと CANManager の
# 受信ループがそのフレームを誰にも配らず、接触が PC まで届かない。
#
# motors ではなくこちらに書くことで、動作確認・目標値再送・UI のモータ一覧に
# 「常に 0 のモータ」が並ばない。途絶は STALE として監視される
# (センサが死んだまま原点合わせを始めると「いつまでも当たらない」形でしか分からない)。
sensors:
  origin_sensor:
    bus: generic_bus
    can_id: 0x44               # サーボ基板 #0 SV4
