robot_name: main_hand

motors:
  y_axis_r:
    driver: m3508
    bus: m3508_bus
    can_id: 1
    pid:
      kp: 32.0
      ki: 10.0
      kd: 1.0
      integral_limit: 1000.0
      dead_band: 1.0       # 目標付近の唸り防止 [deg] (減速比 19:1 で出力軸 0.05deg 相当)
      output_limit: 5000

  y_axis_l:
    driver: m3508
    bus: m3508_bus
    can_id: 2
    pid:
      kp: 32.0
      ki: 10.0
      kd: 1.0
      integral_limit: 1000.0
      dead_band: 1.0
      output_limit: 5000

  rotate_r:
    driver: edulite05
    bus: edulite_bus
    can_id: 1
    host_id: 0xFD
    mode: position
    limit_speed: 2.0
    limit_current: 5.0
    position_kp: 30.0
    set_zero_on_start: true

  rotate_l:
    driver: edulite05
    bus: edulite_bus
    can_id: 2
    host_id: 0xFD
    mode: position
    limit_speed: 2.0
    limit_current: 5.0
    position_kp: 30.0
    set_zero_on_start: true

  gripper:
    driver: generic
    bus: generic_bus
    can_id: 0x40               # サーボ基板 #0 SV0
    control_type: position
    expected_firmware: 6
    expected_angle_range_deg: 270.0

  conveyor:
    driver: generic
    bus: generic_bus
    can_id: 0x80               # DC 基板 #0 ch0
    control_type: duty
    expected_firmware: 2          # firmware/dc_motor/include/config.h の kFirmwareVersion

  wall_f:
    driver: generic
    bus: generic_bus
    can_id: 0x41               # サーボ基板 #0 SV1
    control_type: position
    expected_firmware: 6
    expected_angle_range_deg: 270.0     # firmware/servo/include/config.h と対

sensors:
  rotate_origin_sensor:
    bus: generic_bus
    can_id: 0x43               # サーボ基板 #0 SV3
    expected_firmware: 6       # firmware/servo/include/config.h の kFirmwareVersion

  y_axis_r_origin_sensor:
    bus: generic_bus
    can_id: 0x44               # サーボ基板 #0 SV4
    expected_firmware: 6

  y_axis_l_origin_sensor:
    bus: generic_bus
    can_id: 0x48               # サーボ基板 #1 SV0
    expected_firmware: 6
