robot_name: main_hand

# インターフェース名は udev で個体ごとに固定する (config/can_buses.yaml 参照)。
# can0/can1/can2 は USB 列挙順で入れ替わるため使わない。
can_buses:
  m3508_bus: can_m3508
  edulite_bus: can_edulite
  generic_bus: can_generic

health:
  feedback_timeout_ms: 500   # この時間フィードバックなければ STALE
  temp_warning_c: 65         # この温度で WARNING
  temp_critical_c: 80        # この温度で FAULT
  tx_error_threshold: 96     # CAN error_passive 境界
  # bus_check_interval_ms は将来の独立ヘルスチェックループ用 (現状未使用)

motor_check:
  per_motor_timeout_ms: 1500   # 1 モータあたりのタイムアウト
  default_magnitude:
    m3508: 500                 # mA
    edulite05: 5.0             # deg
    generic: 0.1               # POSITION/VELOCITY/DUTY 共通の小さい目標値
  # tolerance はドライバ側のデフォルト (1deg / 5rpm 等) を採用。
  # 個別上書きしたい場合は motors[name].motor_check で行う。

motors:
  # DJI M3508 (C620 ESC) — CAN Standard Frame
  lift_motor:
    driver: m3508
    bus: m3508_bus
    can_id: 1
    # PC 側位置制御 PID。入力=累積角 [deg]、出力=C620 電流指令 [counts] (16384 ≒ 20A)。
    # !!! 機構が未完成のため実ゲインは未定。以下は「暴れない」ことだけを狙った仮値で、
    #     実機で要チューニング (kp を少しずつ上げ、振動が出る手前で止めること)。
    pid:
      kp: 2.0              # 100deg の偏差でも 200counts (≒0.24A)。振動しない領域から開始
      ki: 0.0              # 重力補償が必要と判明してから足す (機構端で積分が育つと危険)
      kd: 0.0              # ノイズを増幅するため、kp を上げて振動が出てから入れる
      integral_limit: null # ki を入れるときに出力寄与の上限 [counts] を必ず設定する
      dead_band: 1.0       # 目標付近の唸り防止 [deg] (減速比 19:1 で出力軸 0.05deg 相当)
      output_limit: 2000   # 電流上限 [counts] ≒2.4A。C620 フルスケールの約 12% に制限

  # RobStride EDULITE 05 — CAN Extended Frame
  arm_joint:
    driver: edulite05
    bus: edulite_bus
    can_id: 1
    host_id: 0xFD
    mode: position
    limit_speed: 2.0
    limit_current: 5.0
    position_kp: 30.0
    set_zero_on_start: false

  # 自作モータドライバ — CAN Standard Frame
  gripper:
    driver: generic
    bus: generic_bus
    can_id: 0x01
    control_type: position
