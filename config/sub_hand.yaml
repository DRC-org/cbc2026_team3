robot_name: sub_hand

# インターフェース名は udev で個体ごとに固定する (config/can_buses.yaml 参照)。
# can0/can1/can2 は USB 列挙順で入れ替わるため使わない。
can_buses:
  m3508_bus: can_m3508
  edulite_bus: can_edulite
  generic_bus: can_generic

health:
  feedback_timeout_ms: 500   # この時間フィードバックなければ STALE
  temp_warning_c: 65         # この温度で WARNING
  temp_critical_c: 80        # この温度で FAULT
  tx_error_threshold: 96     # CAN error_passive 境界
  # bus_check_interval_ms は将来の独立ヘルスチェックループ用 (現状未使用)

motor_check:
  per_motor_timeout_ms: 1500   # 1 モータあたりのタイムアウト
  default_magnitude:
    m3508: 500                 # mA
    edulite05: 5.0             # deg
    generic: 0.1               # POSITION/VELOCITY/DUTY 共通の小さい目標値
  # tolerance はドライバ側のデフォルト (1deg / 5rpm 等) を採用。
  # 個別上書きしたい場合は motors[name].motor_check で行う。

# !!! can_id はバス単位でロボット横断に一意にすること !!!
# can_edulite / can_generic はメインハンドと物理的に同じバスを共有する。
# CANManager はロボットごとに別インスタンスだが CAN ID 空間は共有されるため、
# 同じ can_id を両者が使うと CANManager._receive_loop が最初にマッチした 1 台で break し、
# もう一方は永久にフィードバックを得られない。EDULITE 05 は
# requires_fresh_feedback_for_activation が True なので、無励磁のまま運用に入ってしまう。
# メインハンド (config/main_hand.yaml) が edulite:1,2 / generic:0x01〜0x04 を使うため、
# サブハンドは後ろにずらしてある。
motors:
  # RobStride EDULITE 05 — 補助アーム関節
  sub_arm_joint:
    driver: edulite05
    bus: edulite_bus
    can_id: 3                  # main_hand の rotate_r/rotate_l (1,2) との衝突回避
    host_id: 0xFD
    mode: position
    limit_speed: 2.0
    limit_current: 5.0
    position_kp: 30.0
    set_zero_on_start: false

  # 自作モータドライバ — 補助ハンドのグリッパ
  sub_gripper:
    driver: generic
    bus: generic_bus
    can_id: 0x05               # main_hand の generic 系 (0x01〜0x04) との衝突回避
    control_type: position
