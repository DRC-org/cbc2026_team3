robot_name: sub_hand

# バス別名 (m3508_bus 等) の定義・health・motor_check の共通設定は config/system.yaml。
# 両ロボットで同じ値しか取り得ないため、ここには書けない (書くと起動が拒否される)。

# !!! can_id はバス単位でロボット横断に一意にすること !!!
# can_edulite / can_generic はメインハンドと物理的に同じバスを共有する。
# CANManager はロボットごとに別インスタンスだが CAN ID 空間は共有されるため、
# 同じ can_id を両者が使うと CANManager._receive_loop が最初にマッチした 1 台で break し、
# もう一方は永久にフィードバックを得られない。EDULITE 05 は
# requires_fresh_feedback_for_activation が True なので、無励磁のまま運用に入ってしまう。
# メインハンド (config/main_hand.yaml) が edulite:1,2 / generic:0x01〜0x04 を使うため、
# サブハンドは後ろにずらしてある。
motors:
  # RobStride EDULITE 05 — 補助アーム関節
  sub_arm_joint:
    driver: edulite05
    bus: edulite_bus
    can_id: 3                  # main_hand の rotate_r/rotate_l (1,2) との衝突回避
    host_id: 0xFD
    mode: position
    limit_speed: 2.0
    limit_current: 5.0
    position_kp: 30.0
    set_zero_on_start: false

  # --- 離散状態アクチュエータ (自作モータドライバ) ---
  # 開 / 閉 の 2 状態しか取らないため、generic 既定の 0.1deg は「どの状態でもない」
  # 無意味な指令になる。しかもサーボは補間完了で reached を立てるので、0.1deg しか
  # 動いていなくても動作確認は PASSED になる。安全な状態そのものを指令する。
  # !!! magnitude は config/sub_hand_positions.yaml の対応する位置定数と同じ値にすること。
  #     ずれると「動作確認で動いた位置」と「運用で使う位置」が別物になり、確認が意味を失う。
  sub_gripper:
    driver: generic
    bus: generic_bus
    can_id: 0x05               # main_hand の generic 系 (0x01〜0x04) との衝突回避
    control_type: position
    motor_check:
      magnitude: 5.0           # positions.sub_gripper.open と一致させること
