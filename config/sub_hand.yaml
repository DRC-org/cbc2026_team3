robot_name: sub_hand

# バス別名 (m3508_bus 等) の定義・health の共通設定は config/system.yaml。
# 両ロボットで同じ値しか取り得ないため、ここには書けない (書くと起動が拒否される)。

# !!! can_id はバス単位でロボット横断に一意にすること !!!
# can_edulite / can_generic はメインハンドと物理的に同じバスを共有する。
# CANManager はロボットごとに別インスタンスだが CAN ID 空間は共有されるため、
# 同じ can_id を両者が使うと CANManager._receive_loop が最初にマッチした 1 台で break し、
# もう一方は永久にフィードバックを得られない。EDULITE 05 は
# requires_fresh_feedback_for_activation が True なので、無励磁のまま運用に入ってしまう。
# メインハンド (config/main_hand.yaml) が edulite:1,2 / generic:0x01〜0x04 を使うため、
# サブハンドは後ろにずらしてある。
motors:
  # RobStride EDULITE 05 — 補助アーム関節
  sub_arm_joint:
    driver: edulite05
    bus: edulite_bus
    can_id: 3                  # main_hand の rotate_r/rotate_l (1,2) との衝突回避
    host_id: 0xFD
    mode: position
    limit_speed: 2.0
    limit_current: 5.0
    position_kp: 30.0
    set_zero_on_start: false

  # --- 直動 2 軸 (Damiao DM3520-1EC / DM-S3519-1EC ギヤードモータ) ---
  # どちらもラックアンドピニオン。**位置ループはドライバ内蔵** (Position Velocity
  # Mode = 位置→速度→電流の三重ループ) なので、M3508 のような PC 側 PID は持たない。
  # /pid-tuning に現れないのはそのためで、ゲイン調整は Damiao の調整アシスタント側。
  #
  # **can_dm3520 は専用バス。** 相乗りできる既存バスが無い (DM3520 の
  # 0x100+ID / 0x200+ID が can_generic の SET_TARGET / SET_PARAM と、また C620 の
  # フィードバック 0x201〜0x204 と重なる)。理由は config/can_buses.yaml に書いてある。
  #
  # --- ID の付け方 -----------------------------------------------------------
  # ESC_ID (レジスタ 0x08) / MST_ID (レジスタ 0x07) は 2026-08-30 に実機へ書き込み済み。
  # 出荷値は 2 台とも ESC_ID == MST_ID (0x010 / 0x013) だった。
  #
  # **ESC_ID は 0x01..0x0F に限る。** フィードバックには CAN ID の下位 4bit しか
  # 載らない (仕様の Feedback Frame の D0) ので、下位 4bit が重なる 2 台は原理的に
  # 区別できず、2 台目のフィードバックが 1 台目の状態を上書きする。
  # lib/config_schema.py の CAN_ID_RANGES がこれを起動時に弾く。
  #
  # **MST_ID はどの ESC_ID とも下位 8bit が一致しない値にする。** 本機は受信 ID の
  # 下位 8bit だけを見て自分宛かを判定するため、一致するとフィードバックが別の個体
  # (あるいは自分自身) への指令として解釈される。0x01/0x02 に対する 0x11/0x12 は
  # この条件を満たす。
  #
  # !!! p_max / v_max / t_max はフィードバックの固定小数点レンジ !!!
  # 実機のレジスタ (0x15 / 0x16 / 0x17) と一致していないと**比例倍の値が読める**。
  # 指令は float なので効かず、症状は「指令どおり動いたのに到達判定を通らない」だけ。
  # 以下は 2026-08-30 に実機から読んだ値 (2 台とも同一)。読み方は
  # ID=0x7FF / D0-D1=can_id / D2=0x33 / D3=レジスタ番号 で、応答は MST_ID に
  # D2=0x33 で返り D4-D7 が float32 (リトルエンディアン)。
  # **v_max は定格speed ではなくマッピングレンジ** (本機の無負荷最高は 435rpm ≒
  # 45.6rad/s だがレジスタは 200)。速度の分解能は 400/4095 ≒ 0.098rad/s になる。

  # 前後方向 (Y 方向) の直動軸。
  sub_y_axis:
    driver: dm3520
    bus: dm3520_bus
    can_id: 0x01
    master_id: 0x11
    mode: position
    # 移動中の速度上限 [rad/s]。**出力軸の値**なので、位置定数の scale
    # (0.0555556 rad/mm) で割ると 36mm/s になる。目標速度ではなく上限であることに注意
    limit_speed: 2.0
    p_max: 12.5                # レジスタ 0x15 [rad]  (scale 換算で ±225mm)
    v_max: 200.0               # レジスタ 0x16 [rad/s]
    t_max: 10.0                # レジスタ 0x17 [Nm]
    # 原点は電源投入位置 (本機は投入時に 0.0rad へ固定される)。true にすると起動時に
    # SET_ZERO を送ってその場を原点にするが、どちらでも「投入時の姿勢が原点」である
    # ことは変わらない。リミットスイッチによる零点確定は未対応
    set_zero_on_start: false

  # 昇降軸。
  #
  # !!! 緊急停止・シャットダウンでは無励磁になる !!! 本機の「止める」は消磁の一手で、
  # サーボのような「現在角を保持」は持たない。**減速比 19.2 のギヤで自重落下しない**
  # という前提に乗っているので、機構が付いたら必ず実機で確かめること
  # (config/checklist.yaml の sub_lift_holds)。落ちるなら機械ブレーキか
  # カウンタバランスが要る —— ソフトでは解決できない。
  sub_lift:
    driver: dm3520
    bus: dm3520_bus
    can_id: 0x02
    master_id: 0x12
    mode: position
    # 昇降は落下方向へ加速しうるので前後軸より遅くしてある。
    # TODO: 機構の重量が分かったら実機で詰めること
    limit_speed: 1.0
    p_max: 12.5
    v_max: 200.0
    t_max: 10.0
    set_zero_on_start: false

  # --- 離散状態アクチュエータ (自作モータドライバ) ---
  # 開 / 閉 の 2 状態しか取らない。動作確認も運用と同じ位置名へ動かすので
  # (robots/motor_check.py)、確認専用の駆動量は存在しない。かつては magnitude を
  # 別に持っており、微小量を指令すると「サーボは補間完了で reached を立てるので、
  # 0.1deg しか動いていなくても PASSED になる」という形で確認が意味を失っていた。
  sub_gripper:
    driver: generic
    bus: generic_bus
    can_id: 0x43               # サーボ基板 #0 SV3 (仕様書 §2.2)
    control_type: position
    # INFO（1Hz の自己申告）と突き合わせる期待値（仕様書 §3.4）。**不一致は FAULT。**
    # 焼き忘れも 180/270 サーボの取り違えも、機体は指令どおり動いたようにしか見えない
    # （FEEDBACK が返すのはクランプ後の指令角）ので、この照合以外に気付く手段が無い。
    # 値は firmware/servo/include/config.h の kFirmwareVersion と
    # kServoSlots[].pulse.angleRangeDeg に対応する。**ファームを直したらここも直す。**
    expected_firmware: 2
    expected_angle_range_deg: 270.0

  # --- 吸着系: 電磁弁 (自作モータドライバ / 電磁弁基板) ---
  # 電磁弁基板 #0 の ch0-5 = 0xC0〜0xC5 (仕様書 §2.2 / §9)。
  #
  # 開 / 閉の 2 状態しか取らないので control_type: on_off。duty を流用しないのは、
  # 「duty 0.3 の電磁弁」という意味を持たない指令を構造的に作れなくするため。
  # DC 基板とサーボ基板は on_off を黙って捨てるので、can_id の書き間違いは
  # 「その弁が動かない」として現れる (別の機構が動くことはない)。
  #
  # !!! この基板の動作は自動判定できない !!!
  # 弁が実際に開いたかを観測する手段を持たず (圧力センサもリミットスイッチも
  # 非搭載)、FEEDBACK の到達フラグも立てない (仕様書 §9.3)。動作確認は弁を
  # 開閉するところまでを担い、鳴ったかどうかは config/checklist.yaml の
  # valves_actuate で打音・目視確認する。
  # on_off 軸は到達判定を持たないので、シーケンスは settle_s の固定待ちへ落ちる
  # (config/sub_hand_positions.yaml)。
  valve_1:
    driver: generic
    bus: generic_bus
    can_id: 0xC0               # 電磁弁基板 #0 ch0 (PB7)
    control_type: on_off
    # INFO（1Hz の自己申告）と突き合わせる期待値（仕様書 §3.4）。**不一致は FAULT。**
    # ファームを一部の基板にだけ焼き忘れると、症状は「そのモータが応答しない」か、
    # 悪くすると「違うものが動く」だけで、CAN 越しには何も見えない。
    # **ファームの kFirmwareVersion を上げたらここも上げること**（上げ忘れると
    # その基板のモータが一斉に FAULT になり、原因は表示された不一致から読める）。
    expected_firmware: 1          # firmware/solenoid/include/config.h の kFirmwareVersion

  valve_2:
    driver: generic
    bus: generic_bus
    can_id: 0xC1               # 電磁弁基板 #0 ch1 (PB6)
    control_type: on_off
    expected_firmware: 1          # firmware/solenoid/include/config.h の kFirmwareVersion

  valve_3:
    driver: generic
    bus: generic_bus
    can_id: 0xC2               # 電磁弁基板 #0 ch2 (PB5)
    control_type: on_off
    expected_firmware: 1          # firmware/solenoid/include/config.h の kFirmwareVersion

  valve_4:
    driver: generic
    bus: generic_bus
    can_id: 0xC3               # 電磁弁基板 #0 ch3 (PB4)
    control_type: on_off
    expected_firmware: 1          # firmware/solenoid/include/config.h の kFirmwareVersion

  valve_5:
    driver: generic
    bus: generic_bus
    can_id: 0xC4               # 電磁弁基板 #0 ch4 (PB3)
    control_type: on_off
    expected_firmware: 1          # firmware/solenoid/include/config.h の kFirmwareVersion

  valve_6:
    driver: generic
    bus: generic_bus
    can_id: 0xC5               # 電磁弁基板 #0 ch5 (PA15)
    control_type: on_off
    expected_firmware: 1          # firmware/solenoid/include/config.h の kFirmwareVersion

  # --- 吸着系: ポンプ (自作モータドライバ / DC 基板) ---
  # **ポンプは電磁弁基板ではなく DC 基板が動かす** (仕様書 §9.6)。電磁弁基板の 6ch は
  # すべて弁で埋まっており、またポンプは起動電流が大きく max_duty で立ち上がりを
  # 抑えられる DC 基板の側が適している。
  #
  # DC 基板 #0 の ch1 / ch2 は空いていたのでそこへ載せる。**メインハンドの conveyor
  # (0x80) と同じ基板を共有する**ので、サブハンド側に基板をもう 1 枚置くなら
  # can_id を 0x88 / 0x89 (DC 基板 #1 = DIP 1) へ移すこと。
  #
  # duty 指令で、回ったかどうかを観測する手段は無い (conveyor と同じ)。
  # 動作確認は回して止めるところまでを担い、鳴ったかどうかは checklist の
  # pumps_run で聴音確認する。
  pump_vac:
    driver: generic
    bus: generic_bus
    can_id: 0x81               # DC 基板 #0 ch1
    control_type: duty
    expected_firmware: 1          # firmware/dc_motor/include/config.h の kFirmwareVersion

  pump_blow:
    driver: generic
    bus: generic_bus
    can_id: 0x82               # DC 基板 #0 ch2
    control_type: duty
    expected_firmware: 1          # firmware/dc_motor/include/config.h の kFirmwareVersion
