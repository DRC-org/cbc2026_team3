robot_name: sub_hand

motors:
  sub_arm_joint:
    driver: edulite05
    bus: edulite_bus
    can_id: 3
    host_id: 0xFD
    mode: position
    limit_speed: 2.0
    limit_current: 5.0
    position_kp: 30.0
    set_zero_on_start: false

  sub_y_axis:
    driver: dm3520
    bus: dm3520_bus
    can_id: 0x01
    master_id: 0x11
    mode: position
    limit_speed: 2.0
    p_max: 12.5
    v_max: 200.0
    t_max: 10.0
    set_zero_on_start: false

  # TODO: limit_speed は機構の重量が分かったら実機で詰めること。
  sub_lift:
    driver: dm3520
    bus: dm3520_bus
    can_id: 0x02
    master_id: 0x12
    mode: position
    limit_speed: 1.0
    p_max: 12.5
    v_max: 200.0
    t_max: 10.0
    set_zero_on_start: false

  sub_gripper:
    driver: generic
    bus: generic_bus
    can_id: 0x48
    control_type: position
    expected_firmware: 5
    expected_angle_range_deg: 270.0

  valve_1:
    driver: generic
    bus: generic_bus
    can_id: 0xC0
    control_type: on_off
    expected_firmware: 2

  valve_2:
    driver: generic
    bus: generic_bus
    can_id: 0xC1
    control_type: on_off
    expected_firmware: 2

  valve_3:
    driver: generic
    bus: generic_bus
    can_id: 0xC2
    control_type: on_off
    expected_firmware: 2

  valve_4:
    driver: generic
    bus: generic_bus
    can_id: 0xC3
    control_type: on_off
    expected_firmware: 2

  valve_5:
    driver: generic
    bus: generic_bus
    can_id: 0xC4
    control_type: on_off
    expected_firmware: 2

  valve_6:
    driver: generic
    bus: generic_bus
    can_id: 0xC5
    control_type: on_off
    expected_firmware: 2

  pump_vac:
    driver: generic
    bus: generic_bus
    can_id: 0x81
    control_type: duty
    expected_firmware: 2

  pump_blow:
    driver: generic
    bus: generic_bus
    can_id: 0x82
    control_type: duty
    expected_firmware: 2
